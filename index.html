/* ============================= VIEW: RTD DASHBOARD ============================= */
var RTD_SORT = { field:'name', dir:1 };
function viewRTDDashboard(){
  var cases = scopedCases();
  var filtered = applyEmployeeFilters(cases.map(function(c){return c.employee;}), 'rtd').map(function(e){ return byId(cases, null) || fullCase(e); });
  // simpler: filter cases directly
  filtered = cases.filter(function(c){
    var f = UI.filters['rtd']||{};
    return Object.keys(f).every(function(k){
      if (k==='rating') return c.rating.finalRating===f[k];
      if (k==='eligibility') return c.eligibility.status===f[k];
      if (k==='learning') return c.learning.status===f[k];
      if (k==='cert') return (c.cert.gap?'Gap':'Met')===f[k];
      if (k==='risk') return c.risk.length>0;
      return String(c.employee[k])===String(f[k]);
    });
  });
  var searchQ = UI.search.trim().toLowerCase();
  if (searchQ) filtered = filtered.filter(function(c){ return c.employee.name.toLowerCase().indexOf(searchQ)>=0 || c.employee.ggid.toLowerCase().indexOf(searchQ)>=0 || c.employee.practice.toLowerCase().indexOf(searchQ)>=0; });

  // Ranked globally (not just the current filtered/quick-filtered view) so the same rank shows
  // up consistently everywhere a tied case appears — RTD Review, its dossier, anywhere else.
  var achvRanks = achievementRanks(allCases());
  filtered.sort(function(a,b){
    var s = RTD_SORT;
    function val(c){
      if (s.field==='rating') return RATING_RANK[c.rating.finalRating];
      if (s.field==='eligibility') return c.eligibility.status;
      if (s.field==='name') return c.employee.name;
      if (s.field==='grade') return c.employee.globalGrade;
      return c.employee[s.field];
    }
    var av=val(a), bv=val(b);
    if (av<bv) return -1*s.dir; if (av>bv) return 1*s.dir;
    // Tie: both land on the same Exceptional/Exceeding rating at 100% confidence, so there's
    // nothing left in the rating itself to order them by — fall back to achievements. Computed
    // as a full, consistent secondary key (not just for pairs that happen to both have a rank)
    // so the comparator stays transitive for the sort algorithm.
    if (a.rating.finalRating===b.rating.finalRating){
      var ra = achvRanks[a.employee.id] ? achvRanks[a.employee.id].rank : Infinity;
      var rb = achvRanks[b.employee.id] ? achvRanks[b.employee.id].rank : Infinity;
      if (ra !== rb) return ra - rb;
    }
    return 0;
  });

  var html = '<div class="section-title">RTD Review</div><div class="section-sub">'+filtered.length+' of '+cases.length+' cases · click a row to open the full dossier</div>';
  if ((UI.filters['rtd']||{}).risk) html += '<div class="table-sub" style="margin:-4px 0 10px;">Showing only cases flagged for risk. <span class="breadcrumb-link" id="clear-risk-filter">Clear</span></div>';
  html += filterBar([
    {field:'rating', label:'Rating', options:RATINGS},
    {field:'eligibility', label:'Promotion', options:['Eligible','Eligible With Exception','Not Eligible']},
    {field:'globalGrade', label:'Grade', options:GRADE_ORDER},
    {field:'peopleManager', label:'People Manager'},
  ], 'rtd');

  html += '<div class="card table-scroll"><table><thead><tr>'+
    thSort('Employee','name')+thSort('Grade','grade')+thSort('People Manager','peopleManager')+
    thSort('Rating','rating')+thSort('Promotion','eligibility')+
    '<th>Actions</th></tr></thead><tbody>'+
    filtered.map(function(c){
      return '<tr>'+
        '<td class="clickable" data-go="dossiers/'+c.employee.id+'"><div style="display:flex;align-items:center;gap:9px;"><div class="badge-avatar" style="width:28px;height:28px;font-size:10.5px;">'+initials(c.employee.name)+'</div>'+
        '<div><div class="table-name">'+esc(c.employee.name)+dataQualityBadge(c.employee)+'</div><div class="table-sub mono">'+(c.employee.ggid||'—')+'</div></div></div></td>'+
        '<td>'+c.employee.globalGrade+' <span class="table-sub">('+esc(c.employee.localGrade)+')</span></td>'+
        '<td>'+esc(c.employee.peopleManager||'—')+'</td>'+
        '<td>'+pill(c.rating.finalRating, ratingPillClass(c.rating.finalRating))+(c.rating.systemRating!==c.rating.finalRating?' <span class="table-sub">HR override</span>':'')+ratingConfidenceSubline(c)+achievementRankBadge(c, achvRanks)+'</td>'+
        '<td>'+pill(c.eligibility.status, eligPillClass(c.eligibility.status))+(c.eligibility.overridden?' <span class="table-sub">HR override</span>':'')+promotionConfidenceSubline(c)+'</td>'+
        '<td>'+(isHR()?
          '<div style="display:flex;gap:5px;"><button class="btn btn-icon btn-sm" data-override-rating="'+c.employee.id+'" title="Override rating">'+icon('edit',13)+'</button>'+
          '<button class="btn btn-icon btn-sm" data-override-promo="'+c.employee.id+'" title="Override promotion eligibility">'+icon('override',13)+'</button></div>'
          :'<span style="color:var(--text-tertiary);">—</span>')+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table>'+(filtered.length?'':'<div class="empty-state">No cases match the current filters.</div>')+'</div>';

  document.getElementById('view').innerHTML = html;
  bindFilterBar('rtd', function(){ viewRTDDashboard(); });
  var clearRiskBtn = document.getElementById('clear-risk-filter');
  if (clearRiskBtn) clearRiskBtn.addEventListener('click', function(){ delete UI.filters['rtd'].risk; viewRTDDashboard(); });
  bindGoLinks();
  Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'), function(el){
    el.addEventListener('click', function(){
      var f = el.getAttribute('data-sort');
      if (RTD_SORT.field===f) RTD_SORT.dir *= -1; else { RTD_SORT.field=f; RTD_SORT.dir=1; }
      viewRTDDashboard();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-override-rating]'), function(btn){
    btn.addEventListener('click', function(ev){ ev.stopPropagation(); openRatingOverrideModal(btn.getAttribute('data-override-rating')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-override-promo]'), function(btn){
    btn.addEventListener('click', function(ev){ ev.stopPropagation(); openEligibilityOverrideModal(btn.getAttribute('data-override-promo')); });
  });
}
function thSort(label, field){
  var arrow = RTD_SORT.field===field ? (RTD_SORT.dir===1?' ↑':' ↓') : '';
  return '<th data-sort="'+field+'">'+esc(label)+arrow+'</th>';
}

/* ============================= VIEW: CALIBRATION DASHBOARD ============================= */
/* Forced-distribution quota compliance: actual counts (from the given case list) vs the admin-configured
   caps per Global Grade, always grouped by grade regardless of the dashboard's own Group-by toggle. */
function quotaActuals(cases){
  var byGrade = {};
  cases.forEach(function(c){
    var g = c.employee.globalGrade;
    byGrade[g] = byGrade[g] || { total:0, ratings:{}, promotable:0 };
    RATINGS.forEach(function(r){ if (byGrade[g].ratings[r]==null) byGrade[g].ratings[r]=0; });
    byGrade[g].total++;
    byGrade[g].ratings[c.rating.finalRating]++;
    if (c.eligibility.status !== 'Not Eligible') byGrade[g].promotable++;
  });
  return byGrade;
}
function quotaBadge(actual, quota){
  if (quota==null) return '<span class="table-sub">'+actual+' <span style="color:var(--text-tertiary);">(no cap)</span></span>';
  var over = actual > quota;
  return '<span style="font-weight:700;" class="tabular">'+actual+'</span> <span class="table-sub">/ '+quota+'</span> '+
    (over ? pill('+'+(actual-quota)+' over','pill-critical') : (actual===quota ? pill('At cap','pill-warning') : pill('Under','pill-success')));
}
function renderQuotaCompliancePanel(cases){
  var configuredGrades = GRADE_ORDER.filter(function(g){
    var q = STATE.quotaConfig[g] || {};
    return q.promotions!=null || RATINGS.some(function(r){ return q[r]!=null; });
  });
  if (!configuredGrades.length){
    return '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Forced distribution quota compliance</div>'+
      '<div class="table-sub" style="margin-top:6px;">No quotas configured yet. Set caps per grade under Administration → Rating & Promotion Quotas.</div></div>';
  }
  var actuals = quotaActuals(cases);
  var html = '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Forced distribution quota compliance</div>'+
    '<div class="section-sub">Actual counts in view vs. the caps set under Administration for each grade</div>'+
    '<div class="table-scroll"><table><thead><tr><th>Grade</th><th>Promotions</th>'+RATINGS.map(function(r){return '<th>'+r+'</th>';}).join('')+'</tr></thead><tbody>'+
    configuredGrades.map(function(g){
      var q = STATE.quotaConfig[g] || {};
      var a = actuals[g] || { total:0, ratings:{}, promotable:0 };
      return '<tr><td class="table-name">'+g+'</td>'+
        '<td>'+quotaBadge(a.promotable, q.promotions)+'</td>'+
        RATINGS.map(function(r){ return '<td>'+quotaBadge(a.ratings[r]||0, q[r])+'</td>'; }).join('')+
        '</tr>';
    }).join('')+
    '</tbody></table></div></div>';
  return html;
}

function viewCalibrationDashboard(){
  var cases = scopedCases();
  var groupBy = UI.calibGroup || 'practice';
  var groups = {};
  cases.forEach(function(c){ var k=c.employee[groupBy]; groups[k]=groups[k]||[]; groups[k].push(c); });

  var html = '<div class="section-title">Rating calibration</div><div class="section-sub">Compare distribution shape across groups to spot outlier leniency or severity before RTD sign-off</div>';

  html += renderQuotaCompliancePanel(cases);

  html += '<div class="section-title" style="margin-top:22px;">Distribution by group</div><div class="section-sub">'+({practice:'Practice',region:'Region',globalGrade:'Global Grade',country:'Country'})[groupBy]+' view — switch below</div>';
  html += '<div class="filter-bar"><span style="font-size:12px;color:var(--text-secondary);margin-right:2px;">Group by</span>';
  ['practice','region','globalGrade','country'].forEach(function(g){
    html += '<span class="chip-filter'+(groupBy===g?' active':'')+'" data-calib-group="'+g+'">'+({practice:'Practice',region:'Region',globalGrade:'Global Grade',country:'Country'})[g]+'</span>';
  });
  html += '</div>';

  html += '<div class="grid-3">';
  Object.keys(groups).sort().forEach(function(k){
    var list = groups[k];
    var counts = {}; RATINGS.forEach(function(r){counts[r]=0;});
    list.forEach(function(c){ counts[c.rating.finalRating]++; });
    var avg = (list.reduce(function(s,c){return s+RATING_RANK[c.rating.finalRating];},0)/list.length);
    var flagHigh = avg > 2.15;
    var flagLow = avg < 0.85;
    html += '<div class="card card-pad">'+

/* ============================= MODAL ============================= */
function openModal(title, bodyHtml, buttons){
  var wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modal-root';
  wrap.innerHTML = '<div class="modal"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn btn-icon" id="modal-close">'+icon('x',15)+'</button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div>'+
    '<div class="modal-foot">'+buttons.map(function(b,i){return '<button class="'+b.cls+'" data-mbtn="'+i+'">'+esc(b.label)+'</button>';}).join('')+'</div></div>';
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  wrap.addEventListener('click', function(ev){ if (ev.target===wrap) closeModal(); });
  buttons.forEach(function(b,i){
    var el = wrap.querySelector('[data-mbtn="'+i+'"]');
    el.addEventListener('click', function(){ if (b.action) b.action(); else closeModal(); });
  });
}
function closeModal(){ var m = document.getElementById('modal-root'); if (m) m.remove(); }
/* Shared confirmation step for actions that can't be undone from the UI (removing reference data,
   turning off a rule that's actively gating live cases). Cancel just closes the modal. */
function confirmAction(title, message, confirmLabel, onConfirm){
  openModal(title, '<div class="table-sub">'+esc(message)+'</div>', [
    {label:'Cancel', cls:'btn'},
    {label:confirmLabel||'Confirm', cls:'btn btn-danger', action:function(){ closeModal(); onConfirm(); }}
  ]);
}

/* People Manager Considerations — only shown for employees who are themselves people managers.
   Sourced from STATE.managerRecords, which the app already collects but didn't surface anywhere
   until now. "# of Counselees" is deliberately shown as context only, never as a pass/fail check —
   per HR's own note, a manager doesn't control how many counselees they're assigned, so it isn't a
   fair KPI. Check-ins, coaching training, and career conversations don't have a finalized target
   count/date yet (see the corresponding Rules Engine entries), so they're shown as raw counts/dates
   here rather than a complete/incomplete verdict. */
function dossierPeopleManagerCard(mgrRec){
  if (!mgrRec) return '<div class="card card-pad" style="margin-top:16px;"><div class="section-title" style="font-size:15px;">People Manager Considerations</div><div class="empty-state" style="padding:24px;">No manager record on file for this employee.</div></div>';
  var row = function(label, valueHtml){ return '<div class="reason-item"><span><strong>'+esc(label)+':</strong> '+valueHtml+'</span></div>'; };
  var yn = function(b){ return b ? pill('Completed','pill-success') : pill('Not completed','pill-neutral'); };
  var cfg = STATE.managerConfig;
  var checkinsRequired = mgrRec.counseleeCount * (cfg.minCheckInsRequired||0);
  var checkinsOk = checkinsRequired===0 || mgrRec.checkInsCompleted >= checkinsRequired;
  var coachingOk = !!(mgrRec.coachingTrainingDate && mgrRec.coachingTrainingDate <= cfg.coachingTrainingDueDate);
  var careerOk = !!(mgrRec.careerConversationDate && mgrRec.careerConversationDate <= cfg.careerConversationDueDate);
  var html = '<div class="card card-pad" style="margin-top:16px;">'+
    '<div class="section-title" style="font-size:15px;">People Manager Considerations</div>'+
    '<div class="section-sub">This employee is a people manager — tracked separately from their own rating and promotion case.</div>'+
    '<div class="reason-list" style="margin-top:8px;">'+
    row('# of Counselees', mgrRec.counseleeCount+' <span class="table-sub" style="display:inline;">(context only — not used as a KPI)</span>')+
    row('Check-ins completed', mgrRec.checkInsCompleted+' of '+checkinsRequired+' required <span class="table-sub" style="display:inline;">('+cfg.minCheckInsRequired+' per counselee)</span> '+pill(checkinsOk?'On track':'Behind', checkinsOk?'pill-success':'pill-warning'))+
    row('Counselee reviews completed', mgrRec.counseleeReviewsCompleted+' of '+mgrRec.counseleeCount)+
    row('Coaching training', yn(mgrRec.coachingTrainingCompleted)+(mgrRec.coachingTrainingDate?' on '+fmtDate(mgrRec.coachingTrainingDate):'')+' <span class="table-sub" style="display:inline;">(due by '+fmtDate(cfg.coachingTrainingDueDate)+')</span> '+pill(coachingOk?'On time':'Past due', coachingOk?'pill-success':'pill-warning'))+
    row('360 survey', yn(mgrRec.feedback360Completed))+
    row('Career conversations completed', mgrRec.careerConversationsCompleted+' of '+mgrRec.counseleeCount+(mgrRec.careerConversationDate?' · latest '+fmtDate(mgrRec.careerConversationDate):'')+' <span class="table-sub" style="display:inline;">(due by '+fmtDate(cfg.careerConversationDueDate)+')</span> '+pill(careerOk?'On time':'Past due', careerOk?'pill-success':'pill-warning'))+
    row('Account check-ins completed', mgrRec.accountCheckinsCompleted+' <span class="table-sub" style="display:inline;">(documentation location not yet decided — see Rule A012)</span>')+
    '</div></div>';
  return html;
}

}
function renderWorkflowActions(empId){
  var e = emp(empId);

function bindWorkflowActions(empId){
  var advBtn = document.querySelector('[data-advance-step="'+empId+'"]');
  if (advBtn) advBtn.addEventListener('click', function(){ advanceWorkflow(empId); });
  var apprBtn = document.querySelector('[data-approve-exception="'+empId+'"]');
  if (apprBtn) apprBtn.addEventListener('click', function(){
    var e = emp(empId);
    var before = e.botpExceptionApproved;
    e.botpExceptionApproved = true;
    invalidateCases();
    logAudit('BOTP Exception', 'botpExceptionApproved', before, true, empId, 'Exception Approved');
    STATE.workflow[empId].status = 'In Progress';
    persist('Exception approved');
    viewDossierDetail(empId);
  });
}
function advanceWorkflow(empId){
  var wf = STATE.workflow[empId];
  var e = emp(empId);
  var names = STATE.stepNames;
  var nextStep = wf.currentStep + 1;
  wf.history.push({ step: nextStep, stepName: names[nextStep-1], completedBy: currentUserName(), completedAt: nowIso(), notes:'' });
  wf.currentStep = nextStep;
  // Auto re-block if entering exception approval with active unapproved BOTP
  if (e.activeBOTP && !e.botpExceptionApproved && nextStep >= 6){
    wf.status = 'Blocked - Exception Pending';
  } else if (nextStep >= 9){
    wf.status = 'Archived';
  } else {
    wf.status = 'In Progress';
  }
  logAudit('Workflow', 'currentStep', nextStep-1, nextStep, empId, 'Advanced to '+names[nextStep-1]);
  persist('Advanced to '+names[nextStep-1]);
  viewDossierDetail(empId);
}

/* ============================= RULES ENGINE ============================= */
var RULE_FIELD_OPTIONS = [
  {v:'globalGrade', label:'Global Grade'}, {v:'region', label:'Region'}, {v:'country', label:'Country'},
  {v:'practice', label:'Practice'}, {v:'currentRating', label:'Current Rating (pre-rule)'},
  {v:'promotedPriorYear', label:'Promoted Prior Year'}, {v:'activeBOTP', label:'Active BOTP'},
  {v:'timeInGrade', label:'Time in Grade'}, {v:'learningHoursCompleted', label:'Learning Hours Completed'},
  {v:'mandatoryTrainingStatus', label:'Mandatory Training Status'}, {v:'promotionReadiness', label:'Promotion Readiness'},
  {v:'certificationLevel', label:'Certification Level'}, {v:'utilization', label:'Utilization'}
];
var OP_OPTIONS = [{v:'==',label:'equals'},{v:'!=',label:'not equals'},{v:'>',label:'greater than'},{v:'>=',label:'greater or equal'},{v:'<',label:'less than'},{v:'<=',label:'less or equal'},{v:'isTrue',label:'is true'},{v:'isFalse',label:'is false'}];

var PARAM_META = {
  capRating: {type:'select', options:RATINGS}, forcedRating: {type:'select', options:RATINGS},
  allowException: {type:'bool'}, rtdCutoffDate: {type:'date'}, yearEndCutoffDate: {type:'date'},
  requiredReadiness: {type:'select', options:['Ready Now','Ready 1-2 Yrs','Ready 2+ Yrs','Not Ready']},
  l1MinGrade: {type:'select', options:GRADE_ORDER}, l2MinGrade: {type:'select', options:GRADE_ORDER},
  allowManualOverride: {type:'bool'}, maxContributionLift: {type:'number'}, blockLiftFromNeedsImprovement: {type:'bool'},
};

var SEVERITY_OPTIONS = ['High','Medium','Low'];
var RULE_CATEGORY_OPTIONS = ['Rating','Promotion','Eligibility','Account','People Manager','L&D'];
var RULES_SEARCH = '';
function severityPillClass(sev){ return sev==='High'?'pill-critical':sev==='Medium'?'pill-warning':'pill-success'; }
function nextRuleId(category){
  var prefix = category==='Account' ? 'A' : category==='People Manager' ? 'M' : category==='L&D' ? 'L' : 'R';
  var max = 0;
  STATE.rules.forEach(function(r){
    var rid = r.ruleId||'';
    if (rid.charAt(0)===prefix){ var n = parseInt(rid.slice(1),10); if (!isNaN(n) && n>max) max = n; }
  });
  var n = max+1;
  return prefix + (n<10?'00':n<100?'0':'') + n;
}
/* How many currently-active cases this rule touches, using the same "Rule N · label" / "name (custom)"
   prefix every rating/promotion rule already stamps onto its rating-trace and eligibility-reason strings
   — no separate tracking needed, we just look for the rule's own signature in output that's already
   computed. Rules added from the People Manager / Account / L&D criteria doc don't drive the rating or
   promotion computation at all (they're tracking/completeness checks, not gating logic), so those carry
   a trackType and are measured directly against the roster/account/manager-record data instead. */
function ruleImpactStats(r){
  if (r.trackType === 'draft'){
    return {total: allCases().length, evaluated: 0, changed: 0, needsConfig: true};
  }
  if (r.trackType === 'completeness'){
    var items = r.trackOn==='account' ? STATE.accounts : STATE.employees;
    var complete = items.filter(function(x){ var v = x[r.trackField]; return v!==null && v!==undefined && v!==''; }).length;
    return {total: items.length, evaluated: items.length, changed: complete, tracking:true, trackLabel:'have this documented'};
  }
  if (r.trackType === 'ratio' || r.trackType === 'boolean'){
    var mgrs = STATE.managerRecords.filter(function(m){ var e = emp(m.employeeId); return e && e.isPeopleManager; });
    var complete2 = mgrs.filter(function(m){
      return r.trackType==='ratio' ? (m[r.ratioTotalField]===0 || m[r.ratioCompletedField] >= m[r.ratioTotalField]) : !!m[r.trackField];
    }).length;
    return {total: mgrs.length, evaluated: mgrs.length, changed: complete2, tracking:true, trackLabel:'have this fully completed'};
  }
  if (r.trackType === 'formula' && r.formulaId === 'learningHours'){
    var complete3 = STATE.employees.filter(function(e){ return computeLearningCompliance(e).status === 'Meets Requirement'; }).length;
    return {total: STATE.employees.length, evaluated: STATE.employees.length, changed: complete3, tracking:true, trackLabel:'meet their learning hours requirement'};
  }
  // Check-ins are required per counselee, so the target is computed live from the configured
  // minimum (Administration → Manager Config) × each manager's own counselee count — not a
  // static number baked in at data-load time, so changing the config here takes effect.
  if (r.trackType === 'checkinRatio'){
    var mgrsCI = STATE.managerRecords.filter(function(m){ var e = emp(m.employeeId); return e && e.isPeopleManager; });
    var perCounselee = STATE.managerConfig.minCheckInsRequired || 0;
    var completeCI = mgrsCI.filter(function(m){ var req = m.counseleeCount*perCounselee; return req===0 || m.checkInsCompleted >= req; }).length;
    return {total: mgrsCI.length, evaluated: mgrsCI.length, changed: completeCI, tracking:true, trackLabel:'have completed their required check-ins'};
  }
  // Completed-by-a-configured-date checks (coaching training, career conversations) — the cutoff
  // itself lives in managerConfig and is editable under Administration → Manager Config.
  if (r.trackType === 'dateCutoff'){
    var mgrsDC = STATE.managerRecords.filter(function(m){ var e = emp(m.employeeId); return e && e.isPeopleManager; });
    var cutoff = STATE.managerConfig[r.cutoffConfigField];
    var completeDC = mgrsDC.filter(function(m){ return cutoff && m[r.dateField] && m[r.dateField] <= cutoff; }).length;
    return {total: mgrsDC.length, evaluated: mgrsDC.length, changed: completeDC, tracking:true, trackLabel:'completed this by the configured due date'};
  }
  var prefix = r.builtin ? ('Rule '+parseInt(r.id.replace('rule',''),10)+' ·') : (r.name+' (custom)');
  var total = 0, evaluated = 0, changed = 0;
  allCases().forEach(function(c){
    total++;
    var traceHits = (c.rating.trace||[]).filter(function(t){ return t.rule && t.rule.indexOf(prefix)===0; });
    var reasonHits = (c.eligibility.reasons||[]).filter(function(x){ return x.text && x.text.indexOf(prefix)===0; });
    if (traceHits.length || reasonHits.length) evaluated++;
    if (traceHits.some(function(t){ return t.forced || t.exception; }) || reasonHits.length) changed++;
  });
  return {total:total, evaluated:evaluated, changed:changed};
}
function filteredRules(){
  var f = UI.filters['rules']||{};
  var q = (RULES_SEARCH||'').trim().toLowerCase();
  return STATE.rules.filter(function(r){
    if (f.category && r.category!==f.category) return false;
    if (f.severity && r.severity!==f.severity) return false;
    if (q && r.name.toLowerCase().indexOf(q)<0 && (r.ruleId||r.id).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){ return (a.ruleId||a.id).localeCompare(b.ruleId||b.id, undefined, {numeric:true}); });
}

function conditionSummary(r){
  return (r.conditions||[]).map(function(c){ var f=RULE_FIELD_OPTIONS.find(function(x){return x.v===c.field;}); var o=OP_OPTIONS.find(function(x){return x.v===c.operator;}); return (f?f.label:c.field)+' '+(o?o.label:c.operator)+(c.value!=null&&c.value!==''?' "'+c.value+'"':''); }).join(' '+(r.conditionLogic||'AND')+' ');
}
function actionSummary(r){
  var a = r.action||{}; if (a.type==='capRating') return 'cap rating at '+a.value; if (a.type==='setRating') return 'set rating to '+a.value; return '—';
}
function renderParamField(r,k){
  var meta = PARAM_META[k];
  var val = r.params[k];
  var label = k.replace(/([A-Z])/g,' $1').replace(/^./,function(s){return s.toUpperCase();});
  var input;
  if (meta.type==='select') input = '<select data-param="'+k+'">'+meta.options.map(function(o){return '<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
  else if (meta.type==='bool') input = '<select data-param="'+k+'"><option value="true"'+(val?' selected':'')+'>Yes</option><option value="false"'+(!val?' selected':'')+'>No</option></select>';
  else if (meta.type==='date') input = '<input type="date" data-param="'+k+'" value="'+esc(val)+'"/>';
  else input = '<input type="number" data-param="'+k+'" value="'+esc(val)+'" style="width:80px;"/>';
  return '<div class="field" data-rule-param="'+r.id+'"><label>'+esc(label)+'</label>'+input+'</div>';
}

function bindRuleRowEvents(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-rule]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-toggle-rule'); var r = rule(id);
      function doToggle(){
        var before = r.enabled; r.enabled = !r.enabled; invalidateCases();
        logAudit('Rule Configuration', r.name+' enabled', before, r.enabled, null, 'Rule Toggled');
        persist(r.name+(r.enabled?' enabled':' disabled'));
        renderRulesTableBody();
      }
      // Turning a rule off changes live ratings/eligibility for real cases the moment it happens —
      // confirm before doing that. Turning one on is additive/safe, so it doesn't need a prompt.
      if (r.enabled) confirmAction('Disable '+(r.ruleId||r.id)+'?', 'Disable "'+r.name+'"? It stops applying to every currently active case immediately, which can change ratings or promotion eligibility for real people. You can re-enable it any time.', 'Disable rule', doToggle);
      else doToggle();
    });

function exportRulesCsv(){
  var headers = ['ruleId','name','category','severity','enabled','builtin','description'];
  var rows = STATE.rules.map(function(r){
    return { ruleId:r.ruleId||r.id, name:r.name, category:r.category, severity:r.severity||'', enabled:r.enabled?'Yes':'No', builtin:r.builtin?'Yes':'No', description:r.description };
  });
  offerDownload('rtd_rules_'+STATE.meta.cycleLabel.replace(/\s+/g,'_')+'.csv', csvStringify(headers, rows));
}
function handleRulesCsvImport(ev){
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var rows = csvParse(String(reader.result));
    var updated = 0, unmatched = [];
    rows.forEach(function(row){
      var rid = (row.ruleId||'').trim();
      if (!rid) return;
      var r = STATE.rules.find(function(x){ return (x.ruleId||x.id).toLowerCase()===rid.toLowerCase(); });
      if (!r){ unmatched.push(rid); return; }
      var before = { name:r.name, category:r.category, severity:r.severity, enabled:r.enabled, description:r.description };
      if (row.name) r.name = row.name;
      if (row.category) r.category = row.category;
      if (row.severity) r.severity = row.severity;
      if (row.description) r.description = row.description;
      if (row.enabled) r.enabled = /^y/i.test(row.enabled);
      logAudit('Rule Configuration', r.name+' (CSV import)', JSON.stringify(before), JSON.stringify({name:r.name,category:r.category,severity:r.severity,enabled:r.enabled,description:r.description}), null, 'Rule Updated via CSV');
      updated++;
    });
    invalidateCases();
    persist('CSV import: '+updated+' rule(s) updated'+(unmatched.length?', '+unmatched.length+' rule ID(s) not found ('+unmatched.slice(0,5).join(', ')+(unmatched.length>5?'…':'')+')':''));
    viewRulesEngine('admin-tab-content');
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function openRuleBuilderModal(editId){
  var existing = editId ? rule(editId) : null;
  var isCustom = existing ? !existing.builtin : true;
  var draft = { conditions: (existing && existing.conditions && existing.conditions.length) ? clone(existing.conditions) : [{field:'globalGrade', operator:'==', value:''}],
    conditionLogic: (existing && existing.conditionLogic) || 'AND',
    action: (existing && existing.action) || {type:'capRating', value:'Succeeding'} };
  function conditionsHtml(){
    return draft.conditions.map(function(c,i){
      return '<div class="field-row" data-cond-row="'+i+'" style="align-items:center;">'+
        '<select data-cf="'+i+'">'+RULE_FIELD_OPTIONS.map(function(f){return '<option value="'+f.v+'"'+(f.v===c.field?' selected':'')+'>'+f.label+'</option>';}).join('')+'</select>'+
        '<select data-co="'+i+'">'+OP_OPTIONS.map(function(o){return '<option value="'+o.v+'"'+(o.v===c.operator?' selected':'')+'>'+o.label+'</option>';}).join('')+'</select>'+
        '<input data-cv="'+i+'" type="text" placeholder="value" value="'+esc(c.value)+'" style="width:110px;"/>'+
        (draft.conditions.length>1?'<button class="btn btn-sm btn-icon" data-cdel="'+i+'">'+icon('x',12)+'</button>':'')+
        '</div>';
    }).join('');
  }
  var paramKeys = existing ? Object.keys(existing.params||{}).filter(function(k){ return PARAM_META[k]; }) : [];

  var body = (existing ? '<div class="field"><label>Rule ID</label><div class="mono" style="font-weight:600;">'+esc(existing.ruleId||existing.id)+'</div></div>' : '')+
    '<div class="field"><label>Rule name</label><input id="nr-name" type="text" placeholder="e.g. High Utilization Bonus Eligibility" value="'+(existing?esc(existing.name):'')+'"/></div>'+
    '<div class="field-row"><div class="field"><label>Category</label><select id="nr-category">'+RULE_CATEGORY_OPTIONS.map(function(c){return '<option'+(existing&&existing.category===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Severity</label><select id="nr-severity">'+SEVERITY_OPTIONS.map(function(s){return '<option'+(existing&&existing.severity===s?' selected':(!existing&&s==='Medium'?' selected':''))+'>'+s+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Enabled</label><select id="nr-enabled"><option value="true"'+(!existing||existing.enabled?' selected':'')+'>Yes</option><option value="false"'+(existing&&!existing.enabled?' selected':'')+'>No</option></select></div></div>'+
    '<div class="field"><label>Description</label><textarea id="nr-desc" rows="2" placeholder="What this rule does…">'+(existing?esc(existing.description):'')+'</textarea></div>'+
    (paramKeys.length ? '<div class="field"><label>Parameters</label><div class="field-row" id="nr-params">'+paramKeys.map(function(k){ return renderParamField(existing,k); }).join('')+'</div></div>' : '')+
    (isCustom ? (
      '<div class="field"><label>Match logic</label><select id="nr-logic"><option value="AND"'+(draft.conditionLogic==='AND'?' selected':'')+'>Match ALL conditions (AND)</option><option value="OR"'+(draft.conditionLogic==='OR'?' selected':'')+'>Match ANY condition (OR)</option></select></div>'+
      '<div class="field"><label>Conditions</label><div id="nr-conditions">'+conditionsHtml()+'</div>'+
      '<button class="btn btn-sm" id="nr-add-cond" style="align-self:flex-start;margin-top:4px;">'+icon('plus',12)+' Add condition</button></div>'+
      '<div class="field"><label>Action</label><div class="field-row">'+
      '<select id="nr-action-type"><option value="capRating"'+(draft.action.type==='capRating'?' selected':'')+'>Cap rating at</option><option value="setRating"'+(draft.action.type==='setRating'?' selected':'')+'>Set rating to</option></select>'+
      '<select id="nr-action-value">'+RATINGS.map(function(r){return '<option value="'+r+'"'+(draft.action.value===r?' selected':'')+'>'+r+'</option>';}).join('')+
      '</select></div></div>'
    ) : '<div class="table-sub">Built-in rules run on fixed logic — name, category, severity, description, enabled state, and the parameters above are configurable; the underlying condition/action logic isn\'t (that\'s hardcoded in the engine for reliability). Create a Custom Rule for new condition-based logic.</div>');

  var buttons = [{label:'Cancel', cls:'btn'}];
  if (existing && isCustom) buttons.push({label:'Delete rule', cls:'btn btn-danger', action:function(){
    STATE.rules = STATE.rules.filter(function(x){return x.id!==existing.id;});
    invalidateCases();
    logAudit('Rule Configuration', existing.name, 'Active', 'Deleted', null, 'Rule Deleted');
    closeModal();
    persist('Rule deleted');
    viewRulesEngine('admin-tab-content');
  }});
  buttons.push({label: existing?'Save changes':'Create Rule', cls:'btn btn-primary', action:function(){
    var name = document.getElementById('nr-name').value.trim();
    if (!name){ showToast('Rule name is required'); return; }
    var category = document.getElementById('nr-category').value;
    var severity = document.getElementById('nr-severity').value;
    var enabled = document.getElementById('nr-enabled').value === 'true';
    var description = document.getElementById('nr-desc').value.trim() || (name+' — custom rule.');

    if (existing){
      var before = clone({name:existing.name, category:existing.category, severity:existing.severity, enabled:existing.enabled, description:existing.description, params:existing.params, conditions:existing.conditions, action:existing.action});
      existing.name = name; existing.category = category; existing.severity = severity; existing.enabled = enabled; existing.description = description;
      if (paramKeys.length){
        var pcard = document.getElementById('nr-params');
        Array.prototype.forEach.call(pcard.querySelectorAll('[data-param]'), function(inp){
          var k = inp.getAttribute('data-param'); var meta = PARAM_META[k]; var v = inp.value;
          if (meta.type==='bool') v = (v==='true'); else if (meta.type==='number') v = parseFloat(v);
          existing.params[k] = v;
        });
      }
      if (isCustom){
        existing.conditionLogic = document.getElementById('nr-logic').value;
        existing.conditions = draft.conditions.map(function(c,i){
          return { field: document.querySelector('[data-cf="'+i+'"]').value, operator: document.querySelector('[data-co="'+i+'"]').value, value: document.querySelector('[data-cv="'+i+'"]').value };
        });
        existing.action = { type: document.getElementById('nr-action-type').value, value: document.getElementById('nr-action-value').value };
      }
      invalidateCases();
      logAudit('Rule Configuration', existing.name, JSON.stringify(before), JSON.stringify({name:existing.name,category:existing.category,severity:existing.severity,enabled:existing.enabled,description:existing.description,params:existing.params,conditions:existing.conditions,action:existing.action}), null, 'Rule Updated');
      closeModal();
      persist('Rule updated');
      viewRulesEngine('admin-tab-content');
      return;
    }

    var conditions = draft.conditions.map(function(c,i){
      return { field: document.querySelector('[data-cf="'+i+'"]').value, operator: document.querySelector('[data-co="'+i+'"]').value, value: document.querySelector('[data-cv="'+i+'"]').value };
    });
    var newRule = {
      id: uid('rule'), ruleId: nextRuleId(category), name: name, category: category, severity: severity,
      description: description, enabled: enabled, builtin: false,
      conditionLogic: document.getElementById('nr-logic').value, conditions: conditions,
      action: { type: document.getElementById('nr-action-type').value, value: document.getElementById('nr-action-value').value },
      params: {},
    };
    STATE.rules.push(newRule);
    invalidateCases();
    logAudit('Rule Configuration', newRule.name, '(none)', 'Created', null, 'Rule Created');
    closeModal();
    persist('New rule created — '+newRule.ruleId);
    viewRulesEngine('admin-tab-content');
  }});

  openModal(existing ? ('Edit Rule · '+(existing.ruleId||existing.id)) : 'Create Rule', body, buttons);

  if (isCustom){
    var addCondBtn = document.getElementById('nr-add-cond');
    if (addCondBtn) addCondBtn.addEventListener('click', function(){
      draft.conditions.push({field:'globalGrade', operator:'==', value:''});
      document.getElementById('nr-conditions').innerHTML = conditionsHtml();
      bindConditionRowEvents();
    });
    bindConditionRowEvents();
  }
  function bindConditionRowEvents(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-cdel]'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-cdel'),10);
        draft.conditions.splice(i,1);
        document.getElementById('nr-conditions').innerHTML = conditionsHtml();
        bindConditionRowEvents();
      });
    });
  }
}

/* Each entry under Administration — Rules Engine included — is its own route (admin/<key>), so
   viewAdmin renders whichever page the hash names, defaulting to the first page when none is
   given (bare '#admin'). Navigating between pages happens via the Administration dropdown in the
   topbar (see renderTopbar/ADMIN_TABS), not an in-page tab row, so this just renders the one
   current page — 'rules' supplies its own heading (viewRulesEngine), everything else gets a
   generic one naming the page. */
function viewAdmin(sub){
  var tab = (sub && ADMIN_TABS.some(function(t){return t[0]===sub;})) ? sub : ADMIN_TABS[0][0];
  var html = (tab==='rules') ? '' : '<div class="section-title">'+esc(adminTabLabel(tab))+'</div><div class="section-sub">Administration</div>';

  if (tab==='rules'){
    viewRulesEngine('admin-tab-content');

    document.getElementById('admin-tab-content').innerHTML = renderAdminTab(tab);

  }
}

          '<button class="btn btn-sm" data-admin-cancel-edit="'+storeKey+'">Cancel</button></div></td></tr>';

    }).join('')+
    '<button class="btn btn-primary btn-sm" data-admin-add="'+storeKey+'">'+icon('plus',12)+' Add</button></div></div>';
  return html;
}

/* ============================= XLSX HELPERS (client-side, no backend) =============================
   .xlsx is a ZIP archive of XML parts. We read the ZIP central directory ourselves (plain binary
   parsing — a well-documented, stable format), decompress each part with the browser's native
   DecompressionStream('deflate-raw') (no hand-rolled inflate algorithm), and parse the XML with the
   browser's own DOMParser. That keeps the risky part of "write a binary format parser" to a small,
   auditable ZIP-directory reader; the compression and XML parsing are both delegated to the browser's
   own battle-tested engines. Legacy binary .xls (Excel 97-2003 BIFF format) is a different, much more
   involved format and is intentionally NOT supported — those files should be re-saved as .xlsx or .csv. */
function xlsxSupported(){
  return typeof DecompressionStream !== 'undefined' && typeof DOMParser !== 'undefined';
}
async function xlsxInflateRaw(bytes){
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function xlsxUnzip(arrayBuffer){
  var buf = new Uint8Array(arrayBuffer);
  var dv = new DataView(arrayBuffer);
  var eocdSig = 0x06054b50;
  var pos = -1;
  var minPos = Math.max(0, buf.length - 65557);
  for (var i = buf.length - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === eocdSig){ pos = i; break; }
  }
  if (pos < 0) throw new Error('Could not find the end of the Excel file — it may be corrupted, or not actually a .xlsx file.');
  var entryCount = dv.getUint16(pos+10, true);
  var cdOffset = dv.getUint32(pos+16, true);
  var entries = {};
  var offset = cdOffset;
  var dec = new TextDecoder('utf-8');
  for (var e=0; e<entryCount; e++){
    if (offset+46 > buf.length) break;
    var sig = dv.getUint32(offset, true);
    if (sig !== 0x02014b50) break;
    var compMethod = dv.getUint16(offset+10, true);
    var compSize = dv.getUint32(offset+20, true);
    var uncompSize = dv.getUint32(offset+24, true);
    var nameLen = dv.getUint16(offset+28, true);
    var extraLen = dv.getUint16(offset+30, true);
    var commentLen = dv.getUint16(offset+32, true);
    var localHeaderOffset = dv.getUint32(offset+42, true);
    var nameBytes = buf.subarray(offset+46, offset+46+nameLen);
    var name = dec.decode(nameBytes);
    entries[name] = { compMethod:compMethod, compSize:compSize, uncompSize:uncompSize, localHeaderOffset:localHeaderOffset };
    offset += 46 + nameLen + extraLen + commentLen;
  }
  return { buf:buf, dv:dv, entries:entries };
}
async function xlsxReadEntry(zip, name){
  var meta = zip.entries[name];
  if (!meta) return null;
  var dv = zip.dv, buf = zip.buf;
  var lh = meta.localHeaderOffset;
  if (lh+30 > buf.length || dv.getUint32(lh, true) !== 0x04034b50) throw new Error('Malformed Excel file (unreadable "'+name+'" part).');
  var nameLen = dv.getUint16(lh+26, true);
  var extraLen = dv.getUint16(lh+28, true);
  var dataStart = lh + 30 + nameLen + extraLen;
  var compressed = buf.subarray(dataStart, dataStart + meta.compSize);
  if (meta.compMethod === 0) return compressed.slice();
  if (meta.compMethod === 8) return await xlsxInflateRaw(compressed);
  throw new Error('Unsupported compression method in Excel file.');
}
function xlsxParseXml(text){
  var doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Could not parse part of the Excel file — it may be corrupted.');
  return doc;
}
function xlsxParseSharedStrings(text){
  if (!text) return [];
  var doc = xlsxParseXml(text);
  var siNodes = doc.getElementsByTagName('si');
  var out = [];
  for (var i=0;i<siNodes.length;i++){
    var tNodes = siNodes[i].getElementsByTagName('t');
    var s = '';
    for (var j=0;j<tNodes.length;j++){ s += tNodes[j].textContent; }
    out.push(s);
  }
  return out;
}
var XLSX_BUILTIN_DATE_FMT_IDS = {14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,27:1,28:1,29:1,30:1,31:1,32:1,33:1,34:1,35:1,36:1,45:1,46:1,47:1,50:1,57:1};
function xlsxParseStyles(text){
  var result = { numFmts:{}, cellXfs:[] };
  if (!text) return result;
  var doc = xlsxParseXml(text);
  var numFmtNodes = doc.getElementsByTagName('numFmt');
  for (var i=0;i<numFmtNodes.length;i++){
    result.numFmts[numFmtNodes[i].getAttribute('numFmtId')] = numFmtNodes[i].getAttribute('formatCode') || '';
  }
  var cellXfsParent = doc.getElementsByTagName('cellXfs')[0];
  if (cellXfsParent){
    var xfNodes = cellXfsParent.getElementsByTagName('xf');
    for (var j=0;j<xfNodes.length;j++){ result.cellXfs.push(xfNodes[j].getAttribute('numFmtId') || '0'); }
  }
  return result;
}
function xlsxStyleIsDate(styles, styleIndex){
  if (styleIndex==null || isNaN(styleIndex)) return false;
  var numFmtId = styles.cellXfs[styleIndex];
  if (numFmtId==null) return false;
  if (XLSX_BUILTIN_DATE_FMT_IDS[numFmtId]) return true;
  var code = styles.numFmts[numFmtId];
  if (!code) return false;
  var stripped = code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'');
  return /[ymdh]/i.test(stripped) && !/general/i.test(stripped);
}
function xlsxSerialToIsoDate(serial){
  if (!isFinite(serial)) return '';
  var ms = Math.round((serial - 25569) * 86400 * 1000);
  var d = new Date(ms);
  if (isNaN(d.getTime())) return '';
  var y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart ? String(d.getUTCMonth()+1).padStart(2,'0') : ('0'+(d.getUTCMonth()+1)).slice(-2);
  var day = String(d.getUTCDate()).padStart ? String(d.getUTCDate()).padStart(2,'0') : ('0'+d.getUTCDate()).slice(-2);
  return y+'-'+m+'-'+day;
}
function xlsxColLettersToIndex(letters){
  var idx = 0;
  for (var i=0;i<letters.length;i++){ idx = idx*26 + (letters.charCodeAt(i) - 64); }
  return idx - 1;
}
function xlsxParseSheet(text, sharedStrings, styles){
  var doc = xlsxParseXml(text);
  var rowNodes = doc.getElementsByTagName('row');
  var rows = [];
  for (var i=0;i<rowNodes.length;i++){
    var rowNode = rowNodes[i];
    var rAttr = parseInt(rowNode.getAttribute('r'), 10);
    var rowIndex = isNaN(rAttr) ? rows.length : rAttr - 1;
    var rowArr = rows[rowIndex] || (rows[rowIndex] = []);
    var cellNodes = rowNode.getElementsByTagName('c');
    for (var j=0;j<cellNodes.length;j++){
      var c = cellNodes[j];
      var ref = c.getAttribute('r') || '';
      var colLetters = ref.replace(/[0-9]/g,'');
      var colIndex = colLetters ? xlsxColLettersToIndex(colLetters) : rowArr.length;
      var type = c.getAttribute('t');
      var styleAttr = c.getAttribute('s');
      var styleIndex = styleAttr!=null ? parseInt(styleAttr,10) : null;
      var value = '';
      if (type === 'inlineStr'){
        var isNode = c.getElementsByTagName('is')[0];
        if (isNode){
          var tNodes = isNode.getElementsByTagName('t');
          var text2 = ''; for (var k=0;k<tNodes.length;k++){ text2 += tNodes[k].textContent; }
          value = text2;
        }
      } else {
        var vNode = c.getElementsByTagName('v')[0];
        var raw = vNode ? vNode.textContent : '';
        if (type === 's'){
          var sIdx = parseInt(raw, 10);
          value = sharedStrings[sIdx] != null ? sharedStrings[sIdx] : '';
        } else if (type === 'str'){
          value = raw;
        } else if (type === 'b'){
          value = (raw === '1') ? 'TRUE' : 'FALSE';
        } else if (raw === ''){
          value = '';
        } else if (xlsxStyleIsDate(styles, styleIndex)){
          value = xlsxSerialToIsoDate(parseFloat(raw));
        } else {
          value = raw;
        }
      }
      rowArr[colIndex] = value;
    }
  }
  return rows;
}
async function xlsxLocateFirstSheetPath(zip){
  var fallback = 'xl/worksheets/sheet1.xml';
  var wbBytes = await xlsxReadEntry(zip, 'xl/workbook.xml');
  if (!wbBytes) return fallback;
  var dec = new TextDecoder('utf-8');
  var wbDoc = xlsxParseXml(dec.decode(wbBytes));
  var sheetNode = wbDoc.getElementsByTagName('sheet')[0];
  if (!sheetNode) return fallback;
  var rId = sheetNode.getAttribute('r:id');
  var relsBytes = await xlsxReadEntry(zip, 'xl/_rels/workbook.xml.rels');
  if (!rId || !relsBytes) return fallback;
  var relsDoc = xlsxParseXml(dec.decode(relsBytes));
  var relNodes = relsDoc.getElementsByTagName('Relationship');
  for (var i=0;i<relNodes.length;i++){
    if (relNodes[i].getAttribute('Id') === rId){
      var target = (relNodes[i].getAttribute('Target') || '').replace(/^\/?/, '');
      if (!/^xl\//.test(target)) target = 'xl/' + target.replace(/^\.\//,'');
      return target;
    }
  }
  return fallback;
}
async function parseXlsxWorkbook(arrayBuffer){
  var zip = await xlsxUnzip(arrayBuffer);
  var hasAnySheet = Object.keys(zip.entries).some(function(n){ return /^xl\/worksheets\/.*\.xml$/.test(n); });
  if (!hasAnySheet) throw new Error('This doesn\'t look like a valid .xlsx file (missing the expected worksheet data inside).');
  var dec = new TextDecoder('utf-8');
  var sheetPath = await xlsxLocateFirstSheetPath(zip);
  if (!zip.entries[sheetPath]) sheetPath = 'xl/worksheets/sheet1.xml';
  var sheetBytes = await xlsxReadEntry(zip, sheetPath);
  if (!sheetBytes) throw new Error('Could not find worksheet data in this Excel file.');
  var sharedStringsBytes = await xlsxReadEntry(zip, 'xl/sharedStrings.xml');
  var stylesBytes = await xlsxReadEntry(zip, 'xl/styles.xml');
  var sharedStrings = sharedStringsBytes ? xlsxParseSharedStrings(dec.decode(sharedStringsBytes)) : [];
  var styles = stylesBytes ? xlsxParseStyles(dec.decode(stylesBytes)) : { numFmts:{}, cellXfs:[] };
  var rows = xlsxParseSheet(dec.decode(sheetBytes), sharedStrings, styles);
  var compact = rows.filter(function(r){ return r != null; });
  if (!compact.length) return [];
  var headerRow = compact[0] || [];
  var headers = headerRow.map(function(h){ return (h==null?'':String(h)).trim(); });
  var dataRows = compact.slice(1).filter(function(r){
    return r && r.some(function(v){ return v!=null && String(v).trim()!==''; });
  });
  return dataRows.map(function(r){
    var o = {};
    headers.forEach(function(h, i){
      if (!h) return;
      var v = r[i];
      o[h] = (v==null ? '' : String(v)).trim();
    });
    return o;
  });
}

/* ============================= CSV HELPERS ============================= */
function csvParse(text){
  var rows = []; var row = []; var field = ''; var inQuotes = false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (var i=0;i<text.length;i++){
    var ch = text[i];
    if (inQuotes){
      if (ch==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += ch;
    } else {
      if (ch==='"') inQuotes = true;
      else if (ch===','){ row.push(field); field=''; }
      else if (ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += ch;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  rows = rows.filter(function(r){ return !(r.length===1 && r[0]===''); });
  if (!rows.length) return [];
  var headers = rows[0].map(function(h){ return h.trim(); });
  return rows.slice(1).map(function(r){
    var o = {}; headers.forEach(function(h,i){ o[h] = (r[i]!=null?r[i]:'').trim(); }); return o;
  });
}
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function csvStringify(headers, rows){
  return headers.join(',') + '\n' + rows.map(function(r){ return headers.map(function(h){ return csvCell(r[h]); }).join(','); }).join('\n');
}

function loadXlsxFile(file){
  if (!xlsxSupported()){
    DL_PARSED = null;
    renderDataLoadPreview('excel-error', 'Your browser doesn\'t support in-browser Excel decompression. Try updating your browser, or save the file as CSV instead.');
    return;
  }
  renderDataLoadPreview('loading');
  file.arrayBuffer().then(function(buf){ return parseXlsxWorkbook(buf); }).then(function(rows){
    DL_PARSED = rows;
    renderDataLoadPreview();
  }).catch(function(err){
    DL_PARSED = null;
    renderDataLoadPreview('excel-error', (err && err.message) ? err.message : String(err));
  });
}
function nextCycleLabel(){
  var m = STATE.meta.cycleLabel.match(/(\d{4})/);
  if (!m) return STATE.meta.cycleLabel + ' (Next)';
  return STATE.meta.cycleLabel.replace(m[1], String(parseInt(m[1],10)+1));
}
function renderDataLoadPreview(mode, detail){
  var el = document.getElementById('dl-preview');
  if (mode==='loading'){
    el.innerHTML = '<div class="table-sub">Reading and parsing the Excel workbook — entirely in your browser, nothing is uploaded anywhere…</div>';
    return;
  }
  if (mode==='legacy-xls'){
    el.innerHTML = '<div class="card card-pad" style="background:var(--warning-soft);border-color:var(--warning);">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
      '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">Legacy .xls files aren\'t supported</div>'+
      '<div class="table-sub">Modern Excel workbooks (.xlsx) are read directly — but the older binary .xls format (Excel 97–2003) uses a different, much more complex encoding this page doesn\'t parse. In Excel: <strong>File → Save As</strong> → choose <strong>Excel Workbook (*.xlsx)</strong> or <strong>CSV (Comma delimited) (*.csv)</strong>, then upload that instead.</div></div></div></div>';
    return;
  }
  if (mode==='excel-error'){
    el.innerHTML = '<div class="card card-pad" style="background:var(--critical-soft);border-color:var(--critical);">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
      '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">Couldn\'t read that Excel file</div>'+
      '<div class="table-sub">'+esc(detail||'The file may be corrupted, password-protected, or in an unexpected format.')+' You can also save it as CSV and upload that instead.</div></div></div></div>';
    return;
  }
  if (!DL_PARSED || !DL_PARSED.length){ el.innerHTML = '<div class="table-sub">No rows parsed from that file. Make sure the first row of the first sheet has column headers matching the template, with data starting on row 2.</div>'; return; }
  var existingByGgid = {}; STATE.employees.forEach(function(e){ if (e.ggid) existingByGgid[e.ggid]=e; });
  var updates = 0, creates = 0, flagged = 0;
  var rowMeta = DL_PARSED.map(function(r){
    var existing = r.ggid ? existingByGgid[r.ggid] : null;
    var issues = existing ? dataLoadIssuesForUpdate(r, existing) : dataLoadIssuesForCreate(r);
    if (existing) updates++; else creates++;
    if (issues.length) flagged++;
    return { r:r, issues:issues };
  });
  var html = '<div class="reason-list" style="margin-bottom:12px;">'+
    '<div class="reason-item">'+icon('check',13)+'<span>All '+DL_PARSED.length+' rows will be loaded — none are skipped. '+updates+' will update existing employees, '+creates+' will be added as new cases.</span></div>'+
    (flagged? '<div class="reason-item" style="color:var(--warning);">'+icon('alert',13)+'<span>'+flagged+' row(s) are missing some information — they\'ll still be loaded, and flagged with a "Missing data" badge under RTD Review so HR can follow up.</span></div>' : '')+
    '</div>';
  html += '<div class="table-scroll" style="max-height:280px;overflow-y:auto;"><table><thead><tr><th>GGID</th><th>Name</th><th>Region</th><th>Grade</th><th>Practice</th><th>Rating</th><th>Data quality</th></tr></thead><tbody>'+
    rowMeta.slice(0,15).map(function(m){
      var r = m.r;
      return '<tr><td class="mono">'+esc(r.ggid||'—')+'</td><td>'+esc(r.name||'—')+'</td><td>'+esc(r.region||'—')+'</td><td>'+esc(r.globalGrade||'—')+'</td><td>'+esc(r.practice||'—')+'</td><td>'+esc(r.priorYearRating||'—')+'</td>'+
        '<td>'+(m.issues.length? '<span class="pill pill-warning" title="'+esc(m.issues.join(' · '))+'">'+icon('alert',11)+' '+m.issues.length+' missing</span>' : '<span class="pill pill-success">'+icon('check',11)+' OK</span>')+'</td></tr>';
    }).join('')+
    '</tbody></table></div>'+(DL_PARSED.length>15?'<div class="table-sub" style="margin-top:6px;">+ '+(DL_PARSED.length-15)+' more rows not shown</div>':'')+
    '<button class="btn btn-primary btn-sm" id="dl-commit" style="margin-top:14px;">'+icon('check',12)+' Commit upload ('+DL_PARSED.length+' rows'+(flagged? ', '+flagged+' flagged':'')+')</button>';
  el.innerHTML = html;
  document.getElementById('dl-commit').addEventListener('click', commitDataLoad);
}
/* Every parsed row is loaded — none are dropped for missing data. These compute exactly which
   fields are absent so the resulting case can be flagged (not silently defaulted-and-forgotten)
   under RTD Review until someone corrects it, typically via a follow-up upload. */
function dataLoadIssuesForCreate(r){
  var issues = [];
  if (!r.ggid) issues.push('Missing GGID from source upload — could not be matched to an existing employee, and a future upload with the correct GGID will create a separate case rather than updating this one until it\'s corrected');
  if (!r.name) issues.push('Missing Name');
  if (!r.region) issues.push('Missing Region');
  if (!r.globalGrade) issues.push('Missing Global Grade');
  if (!r.practice) issues.push('Missing Practice');
  if (!r.priorYearRating || RATINGS.indexOf(r.priorYearRating)<0) issues.push('Missing/invalid Prior Year Rating — defaulted to "Succeeding"');
  return issues;
}
function dataLoadIssuesForUpdate(r, existing){
  var issues = [];
  if (!(r.name || existing.name)) issues.push('Missing Name');
  if (!(r.region || existing.region)) issues.push('Missing Region');
  if (!(r.globalGrade || existing.globalGrade)) issues.push('Missing Global Grade');
  if (!(r.practice || existing.practice)) issues.push('Missing Practice');
  return issues;
}
function commitDataLoad(){
  var existingByGgid = {}; STATE.employees.forEach(function(e){ if (e.ggid) existingByGgid[e.ggid]=e; });
  var updated = 0, created = 0, flagged = 0;
  DL_PARSED.forEach(function(r){
    var yesNo = function(v){ return /^y/i.test(v); };
    var existing = r.ggid ? existingByGgid[r.ggid] : null;
    if (existing){
      var updateIssues = dataLoadIssuesForUpdate(r, existing);
      if (r.name) existing.name = r.name;
      if (r.email) existing.email = r.email;
      if (r.region) existing.region = r.region;
      if (r.country) existing.country = r.country;
      if (r.globalGrade) existing.globalGrade = r.globalGrade;
      if (r.localGrade) existing.localGrade = r.localGrade;
      if (r.practice) existing.practice = r.practice;
      if (r.subPractice) existing.subPractice = r.subPractice;
      if (r.supervisor) existing.supervisor = r.supervisor;
      if (r.peopleManager) existing.peopleManager = r.peopleManager;
      if (r.priorYearRating && RATINGS.indexOf(r.priorYearRating)>=0){ existing.ratingsHistory = existing.ratingsHistory.slice(1).concat([r.priorYearRating]); }
      if (r.performanceTrack) existing.performanceTrack = r.performanceTrack;
      if (r.promotionReadiness) existing.promotionReadiness = r.promotionReadiness;
      if (r.promotionRecommendation) existing.promotionRecommendation = yesNo(r.promotionRecommendation);
      if (r.timeInGrade) existing.timeInGrade = parseFloat(r.timeInGrade);
      if (r.lpdDate) existing.lpdDate = r.lpdDate;
      if (r.mandatoryTrainingStatus) existing.mandatoryTrainingStatus = r.mandatoryTrainingStatus;
      if (r.learningHoursCompleted) existing.learningHoursCompleted = parseFloat(r.learningHoursCompleted);
      if (r.certificationLevel) existing.certificationLevel = r.certificationLevel;
      if (r.certificationDate) existing.certificationDate = r.certificationDate;
      if (r.promotedPriorYear) existing.promotedPriorYear = yesNo(r.promotedPriorYear);
      if (r.activeBOTP) existing.activeBOTP = yesNo(r.activeBOTP);
      if (r.botpCompleted) existing.botpCompleted = yesNo(r.botpCompleted);
      if (r.utilization) existing.utilization = parseFloat(r.utilization);
      existing.dataQualityIssues = updateIssues;
      if (updateIssues.length) flagged++;
      updated++;
    } else {
      var id = uid('EMP');
      var createIssues = dataLoadIssuesForCreate(r);
      STATE.employees.push({
        id:id, ggid:r.ggid||'', name:r.name||r.ggid||'Unnamed (missing data)', firstName:(r.name||'').split(' ')[0]||'', lastName:(r.name||'').split(' ').slice(1).join(' '),
        email:r.email||'', regionType:'Region', region:r.region||'', country:r.country||'', globalGrade:r.globalGrade||'C1', localGrade:r.localGrade||'',
        practice:r.practice||'', subPractice:r.subPractice||'', supervisor:r.supervisor||'', peopleManager:r.peopleManager||'', isPeopleManager:false,
        ratingsHistory:[(r.priorYearRating && RATINGS.indexOf(r.priorYearRating)>=0) ? r.priorYearRating : 'Succeeding','Succeeding','Succeeding'].slice(-3), performanceTrack:r.performanceTrack||'Consulting Track',
        promotionEligibilityOverride:null, promotionReadiness:r.promotionReadiness||'Not Ready', promotionRecommendation:yesNo(r.promotionRecommendation||''),
        timeInGrade:parseFloat(r.timeInGrade)||0, lpdDate:r.lpdDate||'', awards:[], mandatoryTrainingStatus:r.mandatoryTrainingStatus||'Not Started',
        learningHoursCompleted:parseFloat(r.learningHoursCompleted)||0, industryCertifications:[], certificationLevel:r.certificationLevel||'None',
        certificationDate:r.certificationDate||null, promotedPriorYear:yesNo(r.promotedPriorYear||''), activeBOTP:yesNo(r.activeBOTP||''),
        botpCompleted:yesNo(r.botpCompleted||''), botpExceptionApproved:false, primaryAccountOverride:null, utilization:parseFloat(r.utilization)||70,
        businessImpactNotes:'', ratingOverride:null, ratingOverrideNote:null, dataQualityIssues:createIssues
      });
      if (createIssues.length) flagged++;
      STATE.workflow[id] = { employeeId:id, currentStep:1, status:'In Progress', history:[{step:1, stepName:STATE.stepNames[0], completedBy:'System', completedAt:nowIso(), notes:'Loaded via annual data upload'}] };
      created++;
    }
  });
  invalidateCases();
  logAudit('Data Load', 'Employees', existingByGgid ? Object.keys(existingByGgid).length+' existing' : '0', updated+' updated, '+created+' created'+(flagged?', '+flagged+' flagged for missing data':''), null, 'Annual Data Upload');
  DL_PARSED = null;
  persist('Loaded '+updated+' updates and '+created+' new cases'+(flagged?' — '+flagged+' flagged for missing data (see RTD Review)':''));
  viewDataLoad();
}

function archiveCurrentCycle(nextLabel){
  var snapshot = {
    cases: allCases().map(function(c){ return { employeeId:c.employee.id, name:c.employee.name, ggid:c.employee.ggid, region:c.employee.region,
      country:c.employee.country, practice:c.employee.practice, globalGrade:c.employee.globalGrade, localGrade:c.employee.localGrade, finalRating:c.rating.finalRating,
      eligibilityStatus:c.eligibility.status, promotionRecommendation:c.employee.promotionRecommendation }; }),
    employees: clone(STATE.employees), accounts: clone(STATE.accounts), contributions: clone(STATE.contributions),
    managerRecords: clone(STATE.managerRecords), rules: clone(STATE.rules)
  };
  STATE.archives.unshift({ id: uid('ARC'), cycleLabel: STATE.meta.cycleLabel, archivedAt: nowIso(), archivedBy: currentUserName(),
    employeeCount: STATE.employees.length, snapshot: snapshot });
  logAudit('Archive', 'Cycle', STATE.meta.cycleLabel, 'Archived', null, 'Cycle Archived');
  Object.keys(STATE.workflow).forEach(function(eid){
    STATE.workflow[eid] = { employeeId:eid, currentStep:1, status:'In Progress', history:[{step:1, stepName:STATE.stepNames[0], completedBy:currentUserName(), completedAt:nowIso(), notes:'New cycle started'}] };
  });
  var prevLabel = STATE.meta.cycleLabel;
  STATE.meta.cycleLabel = nextLabel;
  logAudit('Cycle', 'cycleLabel', prevLabel, nextLabel, null, 'New Cycle Started');
  invalidateCases();
  persist('Archived '+prevLabel+' — now in '+nextLabel);
}

}
/* Reached when the sidebar's Year quick filter is set to a past (archived) cycle instead of the
   current one — shown in place of whatever dashboard is selected, since a historical cycle's
   snapshot only has this flat case summary, not the full live employee/account/workflow detail
   the dashboards render. Region/Country/Local Grade/Practice quick filters still apply, since the
   archived case objects carry those same fields (see archiveCurrentCycle). */
function viewYearSnapshot(cycleLabel){
  var a = STATE.archives.find(function(x){ return x.cycleLabel===cycleLabel; });
  if (!a){ QF.year=''; saveQuickFilters(); renderApp(); return; }
  var cases = a.snapshot.cases.filter(matchesQuickFilters);
  var html = '<div class="card card-pad" style="margin-bottom:16px;background:var(--accent-soft);border-color:var(--accent);">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">'+
    '<div><div style="font-weight:700;font-family:var(--font-display);font-size:14.5px;">Viewing '+esc(a.cycleLabel)+' — read-only</div>'+
    '<div class="table-sub">Archived '+fmtDateTime(a.archivedAt)+' by '+esc(a.archivedBy)+'. This is a historical snapshot; ratings, eligibility, and workflow can\'t be edited here.</div></div>'+
    '<button class="btn btn-sm" id="ys-back">'+icon('grid',12)+' Back to '+esc(STATE.meta.cycleLabel)+'</button>'+
    '</div></div>';
  html += '<div class="card card-pad" style="margin-bottom:16px;"><div class="grid-3">'+
    stat('Cases in view', cases.length)+stat('Total Archived', a.snapshot.cases.length)+stat('Cycle', esc(a.cycleLabel))+'</div></div>';

  // The actual "year-over-year comparison" the Archives page promises: the same rating-distribution
  // and eligibility charts Executive shows for the live cycle, computed for the archived cycle AND
  // for the live one side by side (both under the same Region/Country/Grade/Practice quick filters
  // — everything except Year, so it's a fair like-for-like comparison, not the archive vs. an
  // unrelated unfiltered population).
  if (cases.length){
    var archRatingCounts = {}; RATINGS.forEach(function(r){archRatingCounts[r]=0;});
    cases.forEach(function(c){ archRatingCounts[c.finalRating]=(archRatingCounts[c.finalRating]||0)+1; });
    var archEligCounts = {'Eligible':0,'Eligible With Exception':0,'Not Eligible':0};
    cases.forEach(function(c){ archEligCounts[c.eligibilityStatus]=(archEligCounts[c.eligibilityStatus]||0)+1; });

    var liveCases = scopedCases();
    var liveRatingCounts = {}; RATINGS.forEach(function(r){liveRatingCounts[r]=0;});
    liveCases.forEach(function(c){ liveRatingCounts[c.rating.finalRating]++; });
    var liveEligCounts = {'Eligible':0,'Eligible With Exception':0,'Not Eligible':0};
    liveCases.forEach(function(c){ liveEligCounts[c.eligibility.status]++; });

    var ratingColors = ['var(--critical)','var(--warning)','var(--success)','var(--special)'];
    var eligData = function(counts){ return [{label:'Eligible',value:counts['Eligible'],color:'var(--success)'},{label:'Eligible With Exception',value:counts['Eligible With Exception'],color:'var(--warning)'},{label:'Not Eligible',value:counts['Not Eligible'],color:'var(--critical)'}]; };

    html += '<div class="section-title" style="margin-top:4px;">'+esc(a.cycleLabel)+' vs. '+esc(STATE.meta.cycleLabel)+'</div>'+
      '<div class="section-sub">Same Region/Country/Grade/Practice quick filters applied to both — Year itself is the only difference</div>';
    html += '<div class="grid-2" style="margin-bottom:16px;">';
    html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Rating distribution — '+esc(a.cycleLabel)+' ('+cases.length+')</div>'+
      svgBarChart(RATINGS.map(function(r,i){return {label:r, value:archRatingCounts[r], color:ratingColors[i]};}), {height:180})+'</div>';
    html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Rating distribution — '+esc(STATE.meta.cycleLabel)+' ('+liveCases.length+')</div>'+
      svgBarChart(RATINGS.map(function(r,i){return {label:r, value:liveRatingCounts[r], color:ratingColors[i]};}), {height:180})+'</div>';
    html += '</div>';
    html += '<div class="grid-2" style="margin-bottom:16px;">';
    html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Eligibility — '+esc(a.cycleLabel)+'</div>'+
      '<div style="display:flex;align-items:center;gap:20px;">'+svgDonut(eligData(archEligCounts))+legendRow(eligData(archEligCounts))+'</div></div>';
    html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Eligibility — '+esc(STATE.meta.cycleLabel)+'</div>'+
      '<div style="display:flex;align-items:center;gap:20px;">'+svgDonut(eligData(liveEligCounts))+legendRow(eligData(liveEligCounts))+'</div></div>';
    html += '</div>';
  }

  if (!cases.length){
    html += '<div class="empty-state">No archived cases match the current quick filters.</div>';
  } else {
    html += '<div class="card table-scroll"><table><thead><tr><th>Employee</th><th>Grade</th><th>Practice</th><th>Region</th><th>Country</th><th>Final Rating</th><th>Eligibility</th></tr></thead><tbody>'+
      cases.map(function(c){
        return '<tr><td class="table-name">'+esc(c.name)+'</td><td>'+esc(c.globalGrade)+' ('+esc(c.localGrade)+')</td><td>'+esc(c.practice)+'</td><td>'+esc(c.region)+'</td><td>'+esc(c.country||'—')+'</td>'+
        '<td>'+pill(c.finalRating, ratingPillClass(c.finalRating))+'</td><td>'+pill(c.eligibilityStatus, eligPillClass(c.eligibilityStatus))+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  document.getElementById('view').innerHTML = html;
  var back = document.getElementById('ys-back');
  if (back) back.addEventListener('click', function(){ QF.year=''; saveQuickFilters(); renderApp(); });
}

/* ============================= ROUTER / BOOT ============================= */
function viewAccessRestricted(msg){
  document.getElementById('view').innerHTML = '<div class="card card-pad" style="max-width:480px;margin:40px auto;text-align:center;">'+
    '<div style="color:var(--critical);margin-bottom:10px;">'+icon('shield',26)+'</div>'+
    '<div class="section-title" style="font-size:15px;">Restricted</div>'+
    '<div class="table-sub" style="margin-top:6px;">'+esc(msg)+'</div></div>';
}

function renderApp(){
  saveUiState();
  var route = currentRoute();
  var parts = route.split('/');
  var top = parts[0];
  renderSidebar();

  if (ROUTE_HR[top] && !isHR()){
    renderTopbar();
    viewAccessRestricted('This section is available to HR Admin only. Open Account in the upper-right corner to sign in as an HR Admin.');
    window.scrollTo(0,0);
    return;
  }
  // Year quick filter set to a past cycle: the four dashboards below assume the live, editable
  // roster, so a selected archive replaces whichever dashboard is active with its read-only
  // snapshot instead. Other routes (Data Load, Admin, Account, Archives itself, ...) don't use
  // quick filters at all and are unaffected. HR-gated same as Archives, since this surfaces the
  // same historical data.
  var DASH_ROUTES = ['dash-exec','dash-rtd','dash-promo','dash-calib'];
  if (QF.year && QF.year!==STATE.meta.cycleLabel && isHR() && DASH_ROUTES.indexOf(top)>=0){
    renderTopbar('Historical snapshot');
    viewYearSnapshot(QF.year);
    window.scrollTo(0,0);
    return;
  }
  if (top==='dash-exec'){ renderTopbar(); viewExecutiveDashboard(); }
  else if (top==='dash-rtd'){ renderTopbar(); viewRTDDashboard(); }
  else if (top==='dash-promo'){ renderTopbar(); viewPromotionDashboard(); }
  else if (top==='dash-calib'){ renderTopbar(); viewCalibrationDashboard(); }
  else if (top==='dossiers' && parts[1]){
    var e = emp(parts[1]);
    renderTopbar(e?e.name:'');
    if (!e) viewAccessRestricted('This employee could not be found.');
    else viewDossierDetail(parts[1]);
  }
  else if (top==='account'){ renderTopbar(); viewAccount(); }
  else if (top==='admin'){ renderTopbar(adminTabLabel(parts[1] || ADMIN_TABS[0][0])); viewAdmin(parts[1]); }
  else if (top==='audit'){ renderTopbar(); viewAudit(); }
  else if (top==='dataload'){ renderTopbar(); viewDataLoad(); }
  else if (top==='archives' && parts[1]){ renderTopbar('Archived cycle'); viewArchiveDetail(parts[1]); }
  else if (top==='archives'){ renderTopbar(); viewArchives(); }
  else { renderTopbar(); viewExecutiveDashboard(); }

  window.scrollTo(0,0);
}

/* Narrow-screen sidebar: an off-canvas drawer toggled from the hamburger button in the topbar
   (see renderTopbar). #app and #sidebar-backdrop are outside the parts of the DOM that get
   replaced on every render, so this only needs to be bound once. */
function toggleSidebar(){ document.getElementById('app').classList.toggle('sidebar-open'); }
function closeSidebar(){ document.getElementById('app').classList.remove('sidebar-open'); }
document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

/* The Administration dropdown (see renderTopbar) is rebuilt fresh on every render, so this looks
   the elements up live rather than capturing references — a single listener bound once here,
   same rationale as the sidebar backdrop above, closes it on any click outside the button/menu. */
document.addEventListener('click', function(ev){
  var menu = document.getElementById('admin-dropdown-menu');
  var btn = document.getElementById('topbar-admin-btn');
  if (menu && menu.classList.contains('open') && !menu.contains(ev.target) && ev.target!==btn && !(btn && btn.contains(ev.target))){
    menu.classList.remove('open');
  }
});

restoreUiStateIfEmpty();
window.addEventListener('hashchange', renderApp);
initArtifact();
initDownloads();
renderModeBanner();
renderApp();

})();
</script>

</html>
