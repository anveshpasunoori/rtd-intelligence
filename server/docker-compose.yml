services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rtd
      POSTGRES_USER: rtd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rtd_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtd -d rtd"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://rtd:${POSTGRES_PASSWORD}@db:5432/rtd
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  rtd_pgdata:
