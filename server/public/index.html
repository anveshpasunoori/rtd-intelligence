    '<div class="section-title" style="font-size:15px;">People Manager Considerations</div>'+
    '<div class="section-sub">This employee is a people manager — tracked separately from their own rating and promotion case.</div>'+
    '<div class="reason-list" style="margin-top:8px;">'+
    row('# of Counselees', mgrRec.counseleeCount+' <span class="table-sub" style="display:inline;">(context only — not used as a KPI)</span>')+
    row('Check-ins completed', mgrRec.checkInsCompleted+' of '+checkinsRequired+' required <span class="table-sub" style="display:inline;">('+cfg.minCheckInsRequired+' per counselee)</span> '+pill(checkinsOk?'On track':'Behind', checkinsOk?'pill-success':'pill-warning'))+
    row('Counselee reviews completed', mgrRec.counseleeReviewsCompleted+' of '+mgrRec.counseleeCount)+
    row('Coaching training', yn(mgrRec.coachingTrainingCompleted)+(mgrRec.coachingTrainingDate?' on '+fmtDate(mgrRec.coachingTrainingDate):'')+' <span class="table-sub" style="display:inline;">(due by '+fmtDate(cfg.coachingTrainingDueDate)+')</span> '+pill(coachingOk?'On time':'Past due', coachingOk?'pill-success':'pill-warning'))+
    row('360 survey', yn(mgrRec.feedback360Completed))+
    row('Career conversations completed', mgrRec.careerConversationsCompleted+' of '+mgrRec.counseleeCount+(mgrRec.careerConversationDate?' · latest '+fmtDate(mgrRec.careerConversationDate):'')+' <span class="table-sub" style="display:inline;">(due by '+fmtDate(cfg.careerConversationDueDate)+')</span> '+pill(careerOk?'On time':'Past due', careerOk?'pill-success':'pill-warning'))+

/* ============================= RULES ENGINE ============================= */
var RULE_FIELD_OPTIONS = [
  {v:'globalGrade', label:'Global Grade'}, {v:'region', label:'Region'}, {v:'country', label:'Country'},
  {v:'practice', label:'Practice'}, {v:'currentRating', label:'Current Rating (pre-rule)'},
  {v:'promotedPriorYear', label:'Promoted Prior Year'}, {v:'activeBOTP', label:'Active BOTP'},
  {v:'timeInGrade', label:'Time in Grade'}, {v:'learningHoursCompleted', label:'Learning Hours Completed'},
  {v:'mandatoryTrainingStatus', label:'Mandatory Training Status'}, {v:'promotionReadiness', label:'Promotion Readiness'},
  {v:'certificationLevel', label:'Certification Level'}, {v:'utilization', label:'Utilization'}
];
var OP_OPTIONS = [{v:'==',label:'equals'},{v:'!=',label:'not equals'},{v:'>',label:'greater than'},{v:'>=',label:'greater or equal'},{v:'<',label:'less than'},{v:'<=',label:'less or equal'},{v:'isTrue',label:'is true'},{v:'isFalse',label:'is false'}];

var PARAM_META = {
  capRating: {type:'select', options:RATINGS}, forcedRating: {type:'select', options:RATINGS},
  allowException: {type:'bool'}, rtdCutoffDate: {type:'date'}, yearEndCutoffDate: {type:'date'},
  requiredReadiness: {type:'select', options:['Ready Now','Ready 1-2 Yrs','Ready 2+ Yrs','Not Ready']},
  // l1MinGrade/l2MinGrade options start empty and are filled in by applyStateDefaults() once STATE
  // is actually loaded — gradeOrder() reads STATE.adminConfig, which doesn't exist yet at module
  // parse time on this server-backed build (STATE starts null until boot() fetches it).
  l1MinGrade: {type:'select', options:[]}, l2MinGrade: {type:'select', options:[]},
  allowManualOverride: {type:'bool'}, maxContributionLift: {type:'number'}, blockLiftFromNeedsImprovement: {type:'bool'},
};

var SEVERITY_OPTIONS = ['High','Medium','Low'];
var RULE_CATEGORY_OPTIONS = ['Rating','Promotion','Eligibility','Account','People Manager','L&D'];
var RULES_SEARCH = '';
function severityPillClass(sev){ return sev==='High'?'pill-critical':sev==='Medium'?'pill-warning':'pill-success'; }
function nextRuleId(category){
  var prefix = category==='Account' ? 'A' : category==='People Manager' ? 'M' : category==='L&D' ? 'L' : 'R';
  var max = 0;
  STATE.rules.forEach(function(r){
    var rid = r.ruleId||'';
    if (rid.charAt(0)===prefix){ var n = parseInt(rid.slice(1),10); if (!isNaN(n) && n>max) max = n; }
  });
  var n = max+1;
  return prefix + (n<10?'00':n<100?'0':'') + n;
}
function filteredRules(){
  var f = UI.filters['rules']||{};
  var q = (RULES_SEARCH||'').trim().toLowerCase();
  return STATE.rules.filter(function(r){
    if (f.category && r.category!==f.category) return false;
    if (f.severity && r.severity!==f.severity) return false;
    if (q && r.name.toLowerCase().indexOf(q)<0 && (r.ruleId||r.id).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){ return (a.ruleId||a.id).localeCompare(b.ruleId||b.id, undefined, {numeric:true}); });
}

function renderRulesTableBody(){
  var list = filteredRules();
  var tbody = document.getElementById('rules-tbody');
  if (!tbody) return;
  tbody.innerHTML = list.length ? list.map(renderRuleRow).join('') :
    '<tr><td colspan="6"><div class="empty-state">No rules match the current search or filters.</div></td></tr>';
  var countEl = document.getElementById('rules-count');
  if (countEl) countEl.textContent = list.length+' rule'+(list.length===1?'':'s')+(list.length!==STATE.rules.length ? ' (of '+STATE.rules.length+' total)' : '');
  bindRuleRowEvents();
}

function renderRuleRow(r){
  return '<tr>'+
    '<td class="mono">'+esc(r.ruleId||r.id)+'</td>'+
    '<td><div class="table-name">'+esc(r.name)+'</div>'+(r.builtin?'':'<div class="table-sub">Custom rule</div>')+'</td>'+
    '<td>'+pill(r.category,'pill-accent')+'</td>'+
    '<td>'+pill(r.enabled?'Enabled':'Disabled', r.enabled?'pill-success':'pill-neutral')+(r.trackType==='draft'?' <span class="pill pill-warning" title="No finalized threshold or date yet — see the rule\'s description." style="margin-left:4px;">Needs configuration</span>':'')+'</td>'+
    '<td>'+pill(r.severity||'—', severityPillClass(r.severity))+'</td>'+
    '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">'+
    '<button class="btn btn-sm" data-view-rule="'+r.id+'">View</button>'+
    '<button class="btn btn-sm" data-edit-rule="'+r.id+'">Edit</button>'+
    '<button class="btn btn-sm" data-toggle-rule="'+r.id+'">'+(r.enabled?'Disable':'Enable')+'</button>'+
    '<button class="btn btn-sm" data-test-rule="'+r.id+'">Test</button>'+
    '<button class="btn btn-sm" data-history-rule="'+r.id+'">History</button>'+
    '</div></td></tr>';
}

function conditionSummary(r){
  return (r.conditions||[]).map(function(c){ var f=RULE_FIELD_OPTIONS.find(function(x){return x.v===c.field;}); var o=OP_OPTIONS.find(function(x){return x.v===c.operator;}); return (f?f.label:c.field)+' '+(o?o.label:c.operator)+(c.value!=null&&c.value!==''?' "'+c.value+'"':''); }).join(' '+(r.conditionLogic||'AND')+' ');
}
function actionSummary(r){
  var a = r.action||{}; if (a.type==='capRating') return 'cap rating at '+a.value; if (a.type==='setRating') return 'set rating to '+a.value; return '—';
}
function renderParamField(r,k){
  var meta = PARAM_META[k];
  var val = r.params[k];
  var label = k.replace(/([A-Z])/g,' $1').replace(/^./,function(s){return s.toUpperCase();});
  var input;
  if (meta.type==='select') input = '<select data-param="'+k+'">'+meta.options.map(function(o){return '<option value="'+o+'"'+(o===val?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
  else if (meta.type==='bool') input = '<select data-param="'+k+'"><option value="true"'+(val?' selected':'')+'>Yes</option><option value="false"'+(!val?' selected':'')+'>No</option></select>';
  else if (meta.type==='date') input = '<input type="date" data-param="'+k+'" value="'+esc(val)+'"/>';
  else input = '<input type="number" data-param="'+k+'" value="'+esc(val)+'" style="width:80px;"/>';
  return '<div class="field" data-rule-param="'+r.id+'"><label>'+esc(label)+'</label>'+input+'</div>';
}

function bindRuleRowEvents(){

        var before = r.enabled; r.enabled = !r.enabled;        logAudit('Rule Configuration', r.name+' enabled', before, r.enabled, null, 'Rule Toggled');
        persist(r.name+(r.enabled?' enabled':' disabled'));
        renderRulesTableBody();
      }
      // Turning a rule off changes live ratings/eligibility for real cases the moment it happens —
      // confirm before doing that. Turning one on is additive/safe, so it doesn't need a prompt.
      if (r.enabled) confirmAction('Disable '+(r.ruleId||r.id)+'?', 'Disable "'+r.name+'"? It stops applying to every currently active case immediately, which can change ratings or promotion eligibility for real people. You can re-enable it any time.', 'Disable rule', doToggle);

function exportRulesCsv(){
  var headers = ['ruleId','name','category','severity','enabled','builtin','description'];
  var rows = STATE.rules.map(function(r){
    return { ruleId:r.ruleId||r.id, name:r.name, category:r.category, severity:r.severity||'', enabled:r.enabled?'Yes':'No', builtin:r.builtin?'Yes':'No', description:r.description };
  });
  offerDownload('rtd_rules_'+STATE.meta.cycleLabel.replace(/\s+/g,'_')+'.csv', csvStringify(headers, rows));
}
function handleRulesCsvImport(ev){
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var rows = csvParse(String(reader.result));
    var updated = 0, unmatched = [];
    rows.forEach(function(row){
      var rid = (row.ruleId||'').trim();
      if (!rid) return;
      var r = STATE.rules.find(function(x){ return (x.ruleId||x.id).toLowerCase()===rid.toLowerCase(); });
      if (!r){ unmatched.push(rid); return; }
      var before = { name:r.name, category:r.category, severity:r.severity, enabled:r.enabled, description:r.description };
      if (row.name) r.name = row.name;
      if (row.category) r.category = row.category;
      if (row.severity) r.severity = row.severity;
      if (row.description) r.description = row.description;
      if (row.enabled) r.enabled = /^y/i.test(row.enabled);
      logAudit('Rule Configuration', r.name+' (CSV import)', JSON.stringify(before), JSON.stringify({name:r.name,category:r.category,severity:r.severity,enabled:r.enabled,description:r.description}), null, 'Rule Updated via CSV');
      updated++;
    });
    persist('CSV import: '+updated+' rule(s) updated'+(unmatched.length?', '+unmatched.length+' rule ID(s) not found ('+unmatched.slice(0,5).join(', ')+(unmatched.length>5?'…':'')+')':''));
    viewRulesEngine('admin-tab-content');
  };
  reader.readAsText(file);
  ev.target.value = '';
}

        '<select data-co="'+i+'">'+OP_OPTIONS.map(function(o){return '<option value="'+o.v+'"'+(o.v===c.operator?' selected':'')+'>'+o.label+'</option>';}).join('')+'</select>'+

    '<div class="field"><label>Description</label><textarea id="nr-desc" rows="2" placeholder="What this rule does…">'+(existing?esc(existing.description):'')+'</textarea></div>'+
    (paramKeys.length ? '<div class="field"><label>Parameters</label><div class="field-row" id="nr-params">'+paramKeys.map(function(k){ return renderParamField(existing,k); }).join('')+'</div></div>' : '')+
    (isCustom ? (
      '<div class="field"><label>Match logic</label><select id="nr-logic"><option value="AND"'+(draft.conditionLogic==='AND'?' selected':'')+'>Match ALL conditions (AND)</option><option value="OR"'+(draft.conditionLogic==='OR'?' selected':'')+'>Match ANY condition (OR)</option></select></div>'+

      '<button class="btn btn-sm" id="nr-add-cond" style="align-self:flex-start;margin-top:4px;">'+icon('plus',12)+' Add condition</button></div>'+
      '<div class="field"><label>Action</label><div class="field-row">'+

      '<select id="nr-action-value">'+RATINGS.map(function(r){return '<option value="'+r+'"'+(draft.action.value===r?' selected':'')+'>'+r+'</option>';}).join('')+
      '</select></div></div>'
    ) : '<div class="table-sub">Built-in rules run on fixed logic — name, category, severity, description, enabled state, and the parameters above are configurable; the underlying condition/action logic isn\'t (that\'s hardcoded in the engine for reliability). Create a Custom Rule for new condition-based logic.</div>');

  var buttons = [{label:'Cancel', cls:'btn'}];

    logAudit('Rule Configuration', existing.name, 'Active', 'Deleted', null, 'Rule Deleted');
    closeModal();
    persist('Rule deleted');
    viewRulesEngine('admin-tab-content');
  }});
  buttons.push({label: existing?'Save changes':'Create Rule', cls:'btn btn-primary', action:function(){
    var name = document.getElementById('nr-name').value.trim();

    var category = document.getElementById('nr-category').value;
    var severity = document.getElementById('nr-severity').value;
    var enabled = document.getElementById('nr-enabled').value === 'true';
    var description = document.getElementById('nr-desc').value.trim() || (name+' — custom rule.');

    if (existing){
      var before = clone({name:existing.name, category:existing.category, severity:existing.severity, enabled:existing.enabled, description:existing.description, params:existing.params, conditions:existing.conditions, action:existing.action});
      existing.name = name; existing.category = category; existing.severity = severity; existing.enabled = enabled; existing.description = description;
      if (paramKeys.length){
        var pcard = document.getElementById('nr-params');
        Array.prototype.forEach.call(pcard.querySelectorAll('[data-param]'), function(inp){
          var k = inp.getAttribute('data-param'); var meta = PARAM_META[k]; var v = inp.value;
          if (meta.type==='bool') v = (v==='true'); else if (meta.type==='number') v = parseFloat(v);
          existing.params[k] = v;
        });
      }
      if (isCustom){
        existing.conditionLogic = document.getElementById('nr-logic').value;
        existing.conditions = draft.conditions.map(function(c,i){
          return { field: document.querySelector('[data-cf="'+i+'"]').value, operator: document.querySelector('[data-co="'+i+'"]').value, value: document.querySelector('[data-cv="'+i+'"]').value };
        });
        existing.action = { type: document.getElementById('nr-action-type').value, value: document.getElementById('nr-action-value').value };
      }
      logAudit('Rule Configuration', existing.name, JSON.stringify(before), JSON.stringify({name:existing.name,category:existing.category,severity:existing.severity,enabled:existing.enabled,description:existing.description,params:existing.params,conditions:existing.conditions,action:existing.action}), null, 'Rule Updated');
      closeModal();
      persist('Rule updated');
      viewRulesEngine('admin-tab-content');
      return;
    }

    var conditions = draft.conditions.map(function(c,i){
      return { field: document.querySelector('[data-cf="'+i+'"]').value, operator: document.querySelector('[data-co="'+i+'"]').value, value: document.querySelector('[data-cv="'+i+'"]').value };
    });
    var newRule = {
      id: uid('rule'), ruleId: nextRuleId(category), name: name, category: category, severity: severity,
      description: description, enabled: enabled, builtin: false,
      conditionLogic: document.getElementById('nr-logic').value, conditions: conditions,
      action: { type: document.getElementById('nr-action-type').value, value: document.getElementById('nr-action-value').value },
      params: {},
    };
    STATE.rules.push(newRule);
    logAudit('Rule Configuration', newRule.name, '(none)', 'Created', null, 'Rule Created');
    closeModal();
    persist('New rule created — '+newRule.ruleId);
    viewRulesEngine('admin-tab-content');
  }});

  openModal(existing ? ('Edit Rule · '+(existing.ruleId||existing.id)) : 'Create Rule', body, buttons);

  if (isCustom){
    var addCondBtn = document.getElementById('nr-add-cond');
    if (addCondBtn) addCondBtn.addEventListener('click', function(){
      draft.conditions.push({field:'globalGrade', operator:'==', value:''});
      document.getElementById('nr-conditions').innerHTML = conditionsHtml();
      bindConditionRowEvents();
    });
    bindConditionRowEvents();
  }
  function bindConditionRowEvents(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-cdel]'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-cdel'),10);
        draft.conditions.splice(i,1);
        document.getElementById('nr-conditions').innerHTML = conditionsHtml();
        bindConditionRowEvents();
      });
    });
  }
}

/* Which row (if any) of each admin reference list is currently mid-edit, keyed by storeKey.
   Editing an existing row is in-place: its cells swap to inputs/selects with Save/Cancel,
   rather than the old Remove-then-re-Add-it workaround. */
var ADMIN_EDIT = {};
/* selectOptions[f] entries are normally plain strings (value===label); pass {value,label} objects
   instead when a field needs a blank/optional choice with real display text (e.g. "(All Regions)"
   at value ""). optionalFields marks which fields the Add-row validation shouldn't require a
   non-empty value for — a deliberate blank pick from a select, not an unfilled text input. */
function adminListEditor(title, list, fields, storeKey, selectOptions, optionalFields){
  selectOptions = selectOptions || {};
  optionalFields = optionalFields || {};
  var editIdx = ADMIN_EDIT[storeKey];
  var optHtml = function(o, current){
    var v = (o && typeof o==='object') ? o.value : o;
    var label = (o && typeof o==='object') ? o.label : o;
    return '<option value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(label)+'</option>';
  };
  var fieldCell = function(f, val){
    if (selectOptions[f]) return '<select data-admin-edit-input="'+storeKey+'" data-field="'+f+'" data-optional="'+(optionalFields[f]?'1':'')+'">'+selectOptions[f].map(function(o){return optHtml(o, val);}).join('')+'</select>';
    return '<input type="text" data-admin-edit-input="'+storeKey+'" data-field="'+f+'" value="'+esc(val)+'"/>';
  };
  var html = '<div class="card card-pad" style="margin-bottom:16px;"><div class="section-title" style="font-size:14.5px;">'+esc(title)+'</div><div class="section-sub">'+list.length+' entries</div>'+
    '<div class="table-scroll"><table><thead><tr>'+fields.map(function(f){return '<th>'+f.replace(/([A-Z])/g,' $1').replace(/^./,function(s){return s.toUpperCase();})+'</th>';}).join('')+'<th></th></tr></thead><tbody>'+
    list.map(function(item,i){
      if (editIdx===i){
        return '<tr>'+fields.map(function(f){return '<td>'+fieldCell(f, item[f])+'</td>';}).join('')+
          '<td><div style="display:flex;gap:6px;"><button class="btn btn-sm btn-primary" data-admin-save-edit="'+storeKey+'" data-idx="'+i+'">Save</button>'+
          '<button class="btn btn-sm" data-admin-cancel-edit="'+storeKey+'">Cancel</button></div></td></tr>';
      }
      return '<tr>'+fields.map(function(f){return '<td>'+esc(item[f]||(optionalFields[f]?'— All —':''))+'</td>';}).join('')+
        '<td><div style="display:flex;gap:6px;"><button class="btn btn-sm" data-admin-edit="'+storeKey+'" data-idx="'+i+'">Edit</button>'+
        '<button class="btn btn-sm btn-danger" data-admin-del="'+storeKey+'" data-idx="'+i+'">Remove</button></div></td></tr>';
    }).join('')+
    '</tbody></table></div>'+
    '<hr class="divider"/>'+
    '<div class="field-row">'+fields.map(function(f){
      if (selectOptions[f]) return '<div class="field"><label>'+f+'</label><select data-admin-input="'+storeKey+'" data-field="'+f+'" data-optional="'+(optionalFields[f]?'1':'')+'">'+selectOptions[f].map(function(o){return optHtml(o, null);}).join('')+'</select></div>';
      return '<div class="field"><label>'+f+'</label><input type="text" data-admin-input="'+storeKey+'" data-field="'+f+'" placeholder="New '+f+'…"/></div>';
    }).join('')+
    '<button class="btn btn-primary btn-sm" data-admin-add="'+storeKey+'">'+icon('plus',12)+' Add</button></div></div>';
  return html;
}

/* ============================= ADMIN BULK IMPORT (XLSX) =============================
   One workbook, one named sheet tab per admin category — same "reference change only, no employee
   record touched" rule as the individual reference-list editors above. A sheet not present in the
   workbook leaves that category untouched; a sheet that IS present fully replaces it (simple,
   predictable — no per-row merge semantics to reason about). Sheet names are matched
   case/space/punctuation-insensitively, same normalization as gradeOrder()'s siblings. */
var ADMIN_IMPORT_SHEETS = {
  regiontypes: { label:'Region Types', sheetName:'Region Types', headers:['name'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.regionTypes = v; },
    exportRows:function(){ return STATE.adminConfig.regionTypes.map(function(r){ return [r.name]; }); } },
  regions: { label:'Regions', sheetName:'Regions', headers:['name','regionType'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||'', regionType:r.regionType||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.regions = v; },
    exportRows:function(){ return STATE.adminConfig.regions.map(function(r){ return [r.name, r.regionType||'']; }); } },
  roles: { label:'Roles / Local Grade Titles', sheetName:'Roles', headers:['name','globalGrade','localGrade','region'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||'', globalGrade:r.globalGrade||'', localGrade:r.localGrade||'', region:r.region||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.localGrades = v; },
    exportRows:function(){ return STATE.adminConfig.localGrades.map(function(r){ return [r.name, r.globalGrade||'', r.localGrade||'', r.region||'']; }); } },
  practices: { label:'Practices', sheetName:'Practices', headers:['name'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.practices = v; },
    exportRows:function(){ return STATE.adminConfig.practices.map(function(r){ return [r.name]; }); } },
  subpractices: { label:'Sub-Practices', sheetName:'Sub Practices', headers:['name','practice'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||'', practice:r.practice||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.subPractices = v; },
    exportRows:function(){ return STATE.adminConfig.subPractices.map(function(r){ return [r.name, r.practice||'']; }); } },
  contributioncategories: { label:'Contribution Categories', sheetName:'Contribution Categories', headers:['name'],
    build:function(rows){ return rows.map(function(r){ return {name:r.name||''}; }).filter(function(r){return r.name;}); }, apply:function(v){ STATE.adminConfig.contributionCategories = v; },
    exportRows:function(){ return STATE.adminConfig.contributionCategories.map(function(r){ return [r.name]; }); } },
  quotas: { label:'Rating & Promotion Quotas', sheetName:'Quotas', headers:['localGrade','promotions','needsImprovement','succeeding','exceeding','exceptional'],
    build:function(rows){
      // Values are a percentage of the grade's population (0-100), not a headcount — see
      // promotionQuotaExceptions (server/lib/engine.js) and the admin editor above.
      var num = function(v){ return (v==null||v==='') ? null : Math.min(100, Math.max(0, parseFloat(v)||0)); };
      var out = {};
      rows.forEach(function(r){ if (!r.localGrade) return; out[r.localGrade] = { promotions:num(r.promotions), 'Needs Improvement':num(r.needsImprovement), 'Succeeding':num(r.succeeding), 'Exceeding':num(r.exceeding), 'Exceptional':num(r.exceptional) }; });
      return out;
    }, apply:function(v){ STATE.quotaConfig = v; }, count:function(v){ return Object.keys(v).length; },
    exportRows:function(){
      var blank = function(v){ return v==null ? '' : v; };
      return localGradeOrder().map(function(g){ var q = STATE.quotaConfig[g]||{}; return [g, blank(q.promotions), blank(q['Needs Improvement']), blank(q['Succeeding']), blank(q['Exceeding']), blank(q['Exceptional'])]; });
    } },
  ldhours: { label:'L&D Hour Requirements', sheetName:'LD Hours', headers:['country','practice','localGrade','hours'],
    build:function(rows){
      var out = {};
      rows.forEach(function(r){
        if (!r.country || !r.practice || !r.localGrade) return;
        out[r.country] = out[r.country] || {};
        out[r.country][r.practice] = out[r.country][r.practice] || {};
        out[r.country][r.practice][r.localGrade] = parseInt(r.hours,10)||0;
      });
      return out;
    }, apply:function(v){ STATE.ldHoursConfig = v; },
    exportRows:function(){
      var rows = [];
      Object.keys(STATE.ldHoursConfig).forEach(function(country){
        Object.keys(STATE.ldHoursConfig[country]).forEach(function(practice){
          var byGrade = STATE.ldHoursConfig[country][practice];
          Object.keys(byGrade).forEach(function(grade){ rows.push([country, practice, grade, byGrade[grade]]); });
        });
      });
      return rows;
    } },
};
/* Every admin category as one multi-sheet workbook, same sheet names/columns the importer above
   expects — download, edit offline, re-upload through Import Admin Data to round-trip. */
function exportAdminData(){
  var sheets = Object.keys(ADMIN_IMPORT_SHEETS).map(function(key){
    var spec = ADMIN_IMPORT_SHEETS[key];
    return { name: spec.sheetName, rows: [spec.headers].concat(spec.exportRows()) };
  });
  var blob = xlsxBuildWorkbook(sheets);
  offerDownload('rtd_admin_data_'+nowIso().slice(0,10)+'.xlsx', blob);
}
function adminImportSheetKey(sheetName){ return String(sheetName||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
var ADMIN_IMPORT_PARSED = null;
var ADMIN_IMPORT_FILENAME = null;
function viewAdminImport(){
  var html = '<div class="card card-pad" style="margin-bottom:16px;"><div class="section-title" style="font-size:14.5px;">Export current admin data</div>'+
    '<div class="section-sub" style="margin-bottom:12px;">Every category below as one workbook, in the same layout Import expects — a starting point to edit offline and re-upload, or just a record of what\'s configured today.</div>'+
    '<button class="btn btn-sm" id="admin-export-btn">'+icon('folder',12)+' Export current admin data (Excel)</button></div>'+
    '<div class="section-sub" style="margin-bottom:10px;">Upload one Excel workbook to bulk-replace admin reference data — put each category on its own named sheet tab (case-insensitive, spacing doesn\'t matter): <strong>Region Types</strong> (name), <strong>Regions</strong> (name, regionType), <strong>Roles</strong> (name, globalGrade, localGrade, region), <strong>Practices</strong> (name), <strong>Sub Practices</strong> (name, practice), <strong>Contribution Categories</strong> (name), <strong>Quotas</strong> (localGrade, promotions, needsImprovement, succeeding, exceeding, exceptional — each a percentage 0-100, not a headcount), <strong>LD Hours</strong> (country, practice, localGrade, hours). Only sheets present in the workbook are replaced — leave a tab out to leave that category as-is.</div>'+
    '<div class="card card-pad"><input type="file" id="admin-import-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="font-size:12.5px;"/>'+
    '<div id="admin-import-preview" style="margin-top:14px;"></div></div>';
  document.getElementById('admin-tab-content').innerHTML = html;
  ADMIN_IMPORT_PARSED = null;
  var exportBtn = document.getElementById('admin-export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportAdminData);
  var fileInput = document.getElementById('admin-import-file');
  fileInput.addEventListener('change', function(){
    var file = fileInput.files[0];
    if (!file) return;
    if (!xlsxSupported()){ renderAdminImportPreview('excel-error', 'Your browser doesn\'t support in-browser Excel decompression. Try updating your browser.'); return; }
    ADMIN_IMPORT_FILENAME = file.name;
    renderAdminImportPreview('loading');
    file.arrayBuffer().then(function(buf){ return parseXlsxWorkbookAllSheets(buf); }).then(function(sheets){
      ADMIN_IMPORT_PARSED = sheets;
      renderAdminImportPreview();
    }).catch(function(err){ renderAdminImportPreview('excel-error', (err && err.message) ? err.message : String(err)); });
  });
}
function renderAdminImportPreview(mode, detail){
  var el = document.getElementById('admin-import-preview');
  if (!el) return;
  if (mode==='loading'){ el.innerHTML = '<div class="table-sub">Reading workbook — entirely in your browser, nothing is uploaded anywhere…</div>'; return; }
  if (mode==='excel-error'){
    el.innerHTML = '<div class="card card-pad" style="background:var(--critical-soft);border-color:var(--critical);">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
      '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">Couldn\'t read that Excel file</div>'+
      '<div class="table-sub">'+esc(detail||'The file may be corrupted, password-protected, or in an unexpected format.')+'</div></div></div></div>';
    return;
  }
  if (!ADMIN_IMPORT_PARSED) return;
  var bySheetKey = {};
  Object.keys(ADMIN_IMPORT_PARSED).forEach(function(name){ bySheetKey[adminImportSheetKey(name)] = { sheetName:name, rows:ADMIN_IMPORT_PARSED[name] }; });
  var recognized = Object.keys(ADMIN_IMPORT_SHEETS).filter(function(key){ return bySheetKey[key]; });
  if (!recognized.length){ el.innerHTML = '<div class="table-sub">No recognized sheet tabs found in that workbook — check the tab names match one of the categories listed above.</div>'; return; }
  el.innerHTML = '<div class="reason-list" style="margin-bottom:12px;">'+recognized.map(function(key){
    var found = bySheetKey[key];

/* ============================= XLSX HELPERS (client-side, no backend) =============================
   .xlsx is a ZIP archive of XML parts. We read the ZIP central directory ourselves (plain binary
   parsing — a well-documented, stable format), decompress each part with the browser's native
   DecompressionStream('deflate-raw') (no hand-rolled inflate algorithm), and parse the XML with the
   browser's own DOMParser. That keeps the risky part of "write a binary format parser" to a small,
   auditable ZIP-directory reader; the compression and XML parsing are both delegated to the browser's
   own battle-tested engines. Legacy binary .xls (Excel 97-2003 BIFF format) is a different, much more
   involved format and is intentionally NOT supported — those files should be re-saved as .xlsx or .csv. */
function xlsxSupported(){
  return typeof DecompressionStream !== 'undefined' && typeof DOMParser !== 'undefined';
}
async function xlsxInflateRaw(bytes){
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function xlsxUnzip(arrayBuffer){
  var buf = new Uint8Array(arrayBuffer);
  var dv = new DataView(arrayBuffer);
  var eocdSig = 0x06054b50;
  var pos = -1;
  var minPos = Math.max(0, buf.length - 65557);
  for (var i = buf.length - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === eocdSig){ pos = i; break; }
  }
  if (pos < 0) throw new Error('Could not find the end of the Excel file — it may be corrupted, or not actually a .xlsx file.');
  var entryCount = dv.getUint16(pos+10, true);
  var cdOffset = dv.getUint32(pos+16, true);
  var entries = {};
  var offset = cdOffset;
  var dec = new TextDecoder('utf-8');
  for (var e=0; e<entryCount; e++){
    if (offset+46 > buf.length) break;
    var sig = dv.getUint32(offset, true);
    if (sig !== 0x02014b50) break;
    var compMethod = dv.getUint16(offset+10, true);
    var compSize = dv.getUint32(offset+20, true);
    var uncompSize = dv.getUint32(offset+24, true);
    var nameLen = dv.getUint16(offset+28, true);
    var extraLen = dv.getUint16(offset+30, true);
    var commentLen = dv.getUint16(offset+32, true);
    var localHeaderOffset = dv.getUint32(offset+42, true);
    var nameBytes = buf.subarray(offset+46, offset+46+nameLen);
    var name = dec.decode(nameBytes);
    entries[name] = { compMethod:compMethod, compSize:compSize, uncompSize:uncompSize, localHeaderOffset:localHeaderOffset };
    offset += 46 + nameLen + extraLen + commentLen;
  }
  return { buf:buf, dv:dv, entries:entries };
}
async function xlsxReadEntry(zip, name){
  var meta = zip.entries[name];
  if (!meta) return null;
  var dv = zip.dv, buf = zip.buf;
  var lh = meta.localHeaderOffset;
  if (lh+30 > buf.length || dv.getUint32(lh, true) !== 0x04034b50) throw new Error('Malformed Excel file (unreadable "'+name+'" part).');
  var nameLen = dv.getUint16(lh+26, true);
  var extraLen = dv.getUint16(lh+28, true);
  var dataStart = lh + 30 + nameLen + extraLen;
  var compressed = buf.subarray(dataStart, dataStart + meta.compSize);
  if (meta.compMethod === 0) return compressed.slice();
  if (meta.compMethod === 8) return await xlsxInflateRaw(compressed);
  throw new Error('Unsupported compression method in Excel file.');
}
function xlsxParseXml(text){
  var doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Could not parse part of the Excel file — it may be corrupted.');
  return doc;
}
function xlsxParseSharedStrings(text){
  if (!text) return [];
  var doc = xlsxParseXml(text);
  var siNodes = doc.getElementsByTagName('si');
  var out = [];
  for (var i=0;i<siNodes.length;i++){
    var tNodes = siNodes[i].getElementsByTagName('t');
    var s = '';
    for (var j=0;j<tNodes.length;j++){ s += tNodes[j].textContent; }
    out.push(s);
  }
  return out;
}
var XLSX_BUILTIN_DATE_FMT_IDS = {14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,27:1,28:1,29:1,30:1,31:1,32:1,33:1,34:1,35:1,36:1,45:1,46:1,47:1,50:1,57:1};
function xlsxParseStyles(text){
  var result = { numFmts:{}, cellXfs:[] };
  if (!text) return result;
  var doc = xlsxParseXml(text);
  var numFmtNodes = doc.getElementsByTagName('numFmt');
  for (var i=0;i<numFmtNodes.length;i++){
    result.numFmts[numFmtNodes[i].getAttribute('numFmtId')] = numFmtNodes[i].getAttribute('formatCode') || '';
  }
  var cellXfsParent = doc.getElementsByTagName('cellXfs')[0];
  if (cellXfsParent){
    var xfNodes = cellXfsParent.getElementsByTagName('xf');
    for (var j=0;j<xfNodes.length;j++){ result.cellXfs.push(xfNodes[j].getAttribute('numFmtId') || '0'); }
  }
  return result;
}
function xlsxStyleIsDate(styles, styleIndex){
  if (styleIndex==null || isNaN(styleIndex)) return false;
  var numFmtId = styles.cellXfs[styleIndex];
  if (numFmtId==null) return false;
  if (XLSX_BUILTIN_DATE_FMT_IDS[numFmtId]) return true;
  var code = styles.numFmts[numFmtId];
  if (!code) return false;
  var stripped = code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'');
  return /[ymdh]/i.test(stripped) && !/general/i.test(stripped);
}
function xlsxSerialToIsoDate(serial){
  if (!isFinite(serial)) return '';
  var ms = Math.round((serial - 25569) * 86400 * 1000);
  var d = new Date(ms);
  if (isNaN(d.getTime())) return '';
  var y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart ? String(d.getUTCMonth()+1).padStart(2,'0') : ('0'+(d.getUTCMonth()+1)).slice(-2);
  var day = String(d.getUTCDate()).padStart ? String(d.getUTCDate()).padStart(2,'0') : ('0'+d.getUTCDate()).slice(-2);
  return y+'-'+m+'-'+day;
}
function xlsxColLettersToIndex(letters){
  var idx = 0;
  for (var i=0;i<letters.length;i++){ idx = idx*26 + (letters.charCodeAt(i) - 64); }
  return idx - 1;
}
function xlsxParseSheet(text, sharedStrings, styles){
  var doc = xlsxParseXml(text);
  var rowNodes = doc.getElementsByTagName('row');
  var rows = [];
  for (var i=0;i<rowNodes.length;i++){
    var rowNode = rowNodes[i];
    var rAttr = parseInt(rowNode.getAttribute('r'), 10);
    var rowIndex = isNaN(rAttr) ? rows.length : rAttr - 1;
    var rowArr = rows[rowIndex] || (rows[rowIndex] = []);
    var cellNodes = rowNode.getElementsByTagName('c');
    for (var j=0;j<cellNodes.length;j++){
      var c = cellNodes[j];
      var ref = c.getAttribute('r') || '';
      var colLetters = ref.replace(/[0-9]/g,'');
      var colIndex = colLetters ? xlsxColLettersToIndex(colLetters) : rowArr.length;
      var type = c.getAttribute('t');
      var styleAttr = c.getAttribute('s');
      var styleIndex = styleAttr!=null ? parseInt(styleAttr,10) : null;
      var value = '';
      if (type === 'inlineStr'){
        var isNode = c.getElementsByTagName('is')[0];
        if (isNode){
          var tNodes = isNode.getElementsByTagName('t');
          var text2 = ''; for (var k=0;k<tNodes.length;k++){ text2 += tNodes[k].textContent; }
          value = text2;
        }
      } else {
        var vNode = c.getElementsByTagName('v')[0];
        var raw = vNode ? vNode.textContent : '';
        if (type === 's'){
          var sIdx = parseInt(raw, 10);
          value = sharedStrings[sIdx] != null ? sharedStrings[sIdx] : '';
        } else if (type === 'str'){
          value = raw;
        } else if (type === 'b'){
          value = (raw === '1') ? 'TRUE' : 'FALSE';
        } else if (raw === ''){
          value = '';
        } else if (xlsxStyleIsDate(styles, styleIndex)){
          value = xlsxSerialToIsoDate(parseFloat(raw));
        } else {
          value = raw;
        }
      }
      rowArr[colIndex] = value;
    }
  }
  return rows;
}
async function xlsxLocateFirstSheetPath(zip){
  var fallback = 'xl/worksheets/sheet1.xml';
  var wbBytes = await xlsxReadEntry(zip, 'xl/workbook.xml');
  if (!wbBytes) return fallback;
  var dec = new TextDecoder('utf-8');
  var wbDoc = xlsxParseXml(dec.decode(wbBytes));
  var sheetNode = wbDoc.getElementsByTagName('sheet')[0];
  if (!sheetNode) return fallback;
  var rId = sheetNode.getAttribute('r:id');
  var relsBytes = await xlsxReadEntry(zip, 'xl/_rels/workbook.xml.rels');
  if (!rId || !relsBytes) return fallback;
  var relsDoc = xlsxParseXml(dec.decode(relsBytes));
  var relNodes = relsDoc.getElementsByTagName('Relationship');
  for (var i=0;i<relNodes.length;i++){
    if (relNodes[i].getAttribute('Id') === rId){
      var target = (relNodes[i].getAttribute('Target') || '').replace(/^\/?/, '');
      if (!/^xl\//.test(target)) target = 'xl/' + target.replace(/^\.\//,'');
      return target;
    }
  }
  return fallback;
}
async function parseXlsxWorkbook(arrayBuffer){
  var zip = await xlsxUnzip(arrayBuffer);
  var hasAnySheet = Object.keys(zip.entries).some(function(n){ return /^xl\/worksheets\/.*\.xml$/.test(n); });
  if (!hasAnySheet) throw new Error('This doesn\'t look like a valid .xlsx file (missing the expected worksheet data inside).');
  var dec = new TextDecoder('utf-8');
  var sheetPath = await xlsxLocateFirstSheetPath(zip);
  if (!zip.entries[sheetPath]) sheetPath = 'xl/worksheets/sheet1.xml';
  var sheetBytes = await xlsxReadEntry(zip, sheetPath);
  if (!sheetBytes) throw new Error('Could not find worksheet data in this Excel file.');
  var sharedStringsBytes = await xlsxReadEntry(zip, 'xl/sharedStrings.xml');
  var stylesBytes = await xlsxReadEntry(zip, 'xl/styles.xml');
  var sharedStrings = sharedStringsBytes ? xlsxParseSharedStrings(dec.decode(sharedStringsBytes)) : [];
  var styles = stylesBytes ? xlsxParseStyles(dec.decode(stylesBytes)) : { numFmts:{}, cellXfs:[] };
  var rows = xlsxParseSheet(dec.decode(sheetBytes), sharedStrings, styles);
  var compact = rows.filter(function(r){ return r != null; });
  if (!compact.length) return [];
  var headerRow = compact[0] || [];
  var headers = headerRow.map(resolveDataLoadHeader);
  var dataRows = compact.slice(1).filter(function(r){
    return r && r.some(function(v){ return v!=null && String(v).trim()!==''; });
  });
  return dataRows.map(function(r){
    var o = {};
    headers.forEach(function(h, i){
      if (!h) return;
      var v = r[i];
      o[h] = (v==null ? '' : String(v)).trim();
    });
    return o;
  });
}

/* Lists every worksheet in the workbook as {name, path} — used by the Administration bulk import
   below, which needs to find a sheet by its tab name (e.g. "Regions") rather than assuming it's the
   first one, unlike parseXlsxWorkbook (the Annual Data Load employee template always uses sheet 1). */
async function xlsxLocateAllSheets(zip){
  var wbBytes = await xlsxReadEntry(zip, 'xl/workbook.xml');
  if (!wbBytes) return [];
  var dec = new TextDecoder('utf-8');
  var wbDoc = xlsxParseXml(dec.decode(wbBytes));
  var sheetNodes = wbDoc.getElementsByTagName('sheet');
  var relsBytes = await xlsxReadEntry(zip, 'xl/_rels/workbook.xml.rels');
  var relById = {};
  if (relsBytes){
    var relsDoc = xlsxParseXml(dec.decode(relsBytes));
    var relNodes = relsDoc.getElementsByTagName('Relationship');
    for (var i=0;i<relNodes.length;i++){
      var target = (relNodes[i].getAttribute('Target') || '').replace(/^\/?/, '');
      if (!/^xl\//.test(target)) target = 'xl/' + target.replace(/^\.\//,'');
      relById[relNodes[i].getAttribute('Id')] = target;
    }
  }
  var out = [];
  for (var j=0;j<sheetNodes.length;j++){
    var name = sheetNodes[j].getAttribute('name') || ('Sheet'+(j+1));
    var rId = sheetNodes[j].getAttribute('r:id');
    var path = (rId && relById[rId]) || ('xl/worksheets/sheet'+(j+1)+'.xml');
    out.push({ name: name, path: path });
  }
  return out;
}
/* Same row-object extraction as parseXlsxWorkbook's tail end, factored out so a multi-sheet import
   can reuse one already-parsed sharedStrings/styles pair across every sheet instead of re-reading
   them per sheet. Headers are used as-is (trimmed) — admin-import sheets have their own fixed
   column names (see ADMIN_IMPORT_SHEETS), not the employee data-load template's header aliases. */
function xlsxRowsFromSheet(sheetXmlText, sharedStrings, styles){
  var rows = xlsxParseSheet(sheetXmlText, sharedStrings, styles);
  var compact = rows.filter(function(r){ return r != null; });
  if (!compact.length) return [];
  var headerRow = compact[0] || [];
  var headers = headerRow.map(function(h){ return (h==null?'':String(h)).trim(); });
  var dataRows = compact.slice(1).filter(function(r){
    return r && r.some(function(v){ return v!=null && String(v).trim()!==''; });
  });
  return dataRows.map(function(r){
    var o = {};
    headers.forEach(function(h, i){
      if (!h) return;
      var v = r[i];
      o[h] = (v==null ? '' : String(v)).trim();
    });
    return o;
  });
}
/* Reads every worksheet in the workbook into {sheetName: [rowObjects...]} — the multi-sheet
   counterpart to parseXlsxWorkbook. Used by the Administration bulk import, where one workbook
   carries several named tabs (Regions, Roles, Practices, ...) in a single upload. */
async function parseXlsxWorkbookAllSheets(arrayBuffer){
  var zip = await xlsxUnzip(arrayBuffer);
  var hasAnySheet = Object.keys(zip.entries).some(function(n){ return /^xl\/worksheets\/.*\.xml$/.test(n); });
  if (!hasAnySheet) throw new Error('This doesn\'t look like a valid .xlsx file (missing the expected worksheet data inside).');
  var dec = new TextDecoder('utf-8');
  var sharedStringsBytes = await xlsxReadEntry(zip, 'xl/sharedStrings.xml');
  var stylesBytes = await xlsxReadEntry(zip, 'xl/styles.xml');
  var sharedStrings = sharedStringsBytes ? xlsxParseSharedStrings(dec.decode(sharedStringsBytes)) : [];
  var styles = stylesBytes ? xlsxParseStyles(dec.decode(stylesBytes)) : { numFmts:{}, cellXfs:[] };
  var sheets = await xlsxLocateAllSheets(zip);
  var out = {};
  for (var i=0;i<sheets.length;i++){
    var bytes = await xlsxReadEntry(zip, sheets[i].path);
    if (!bytes) continue;
    out[sheets[i].name] = xlsxRowsFromSheet(dec.decode(bytes), sharedStrings, styles);
  }
  return out;
}

/* ============================= XLSX WRITER (client-side, no backend) =============================
   The read side above decodes an existing .xlsx; this builds a new one from scratch for the export
   features (Annual Data Load's "Export results", the admin bulk-import screen's "Export current
   admin data"), entirely in-browser, no server round-trip. Every cell is written as an inline string
   (<c t="inlineStr">) rather than a shared-strings table or typed numeric cells — the simplest
   correct encoding, and every consumer here (a human opening the file, or this same app's own
   importer re-reading it) only ever wants the text back. The ZIP container uses the STORED (no
   compression) method — valid per the ZIP spec and something xl/OOXML readers accept fine — since a
   DEFLATE encoder isn't worth building for what are, at most, a few thousand rows. */
function xmlEscapeText(s){
  return String(s==null?'':s).replace(/[&<>]/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'; }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}
function xlsxIndexToColLetters(n){
  var s = '';
  n = n + 1;
  while (n > 0){ var rem = (n - 1) % 26; s = String.fromCharCode(65 + rem) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
var CRC32_TABLE = (function(){
  var table = [];
  for (var n=0; n<256; n++){
    var c = n;
    for (var k=0; k<8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32Bytes(bytes){
  var crc = 0xFFFFFFFF;
  for (var i=0; i<bytes.length; i++){ crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ bytes[i]) & 0xFF]; }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
/* files: [{name, bytes:Uint8Array}] -> Blob (a valid, uncompressed/STORED .xlsx zip container). */
function zipBuildStored(files){
  var enc = new TextEncoder();
  var localParts = [], centralParts = [], offset = 0;
  var dosTime = 0, dosDate = 0x21; // fixed arbitrary timestamp (Jan 1 2021) -- generated files, not worth wall-clock precision
  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.bytes;
    var crc = crc32Bytes(data), size = data.length;
    var lfh = new Uint8Array(30 + nameBytes.length);
    var dv = new DataView(lfh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true); dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    localParts.push(lfh, data);

    var cdh = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(cdh.buffer);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true); cdv.setUint16(10, 0, true);
    cdv.setUint16(12, dosTime, true); cdv.setUint16(14, dosDate, true); cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true); cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true); cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cdh.set(nameBytes, 46);
    centralParts.push(cdh);

    offset += lfh.length + data.length;
  });
  var centralStart = offset;
  var centralSize = centralParts.reduce(function(s,p){ return s + p.length; }, 0);
  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true); edv.setUint16(4, 0, true); edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true); edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true); edv.setUint32(16, centralStart, true); edv.setUint16(20, 0, true);
  return new Blob(localParts.concat(centralParts, [eocd]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function xlsxWorksheetXml(rows){
  var body = rows.map(function(row, ri){
    var cells = row.map(function(v, ci){
      return '<c r="'+xlsxIndexToColLetters(ci)+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscapeText(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>';
}
/* sheets: [{name, rows}] — rows[0] is the header row, every row an array of primitive values in
   column order. Sheet names are truncated/sanitized to Excel's 31-char, no-[]:*?/\\ tab-name rule. */
function xlsxBuildWorkbook(sheets){
  var enc = new TextEncoder();
  var safeNames = sheets.map(function(s, i){
    var n = String(s.name||('Sheet'+(i+1))).replace(/[\[\]:*?/\\]/g, ' ').trim().slice(0, 31);
    return n || ('Sheet'+(i+1));
  });
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map(function(s,i){ return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('')+
    '</Types>';
  var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';
  var workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets>'+safeNames.map(function(n,i){ return '<sheet name="'+xmlEscapeText(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; }).join('')+'</sheets>'+
    '</workbook>';
  var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map(function(s,i){ return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join('')+
    '</Relationships>';
  var files = [
    { name:'[Content_Types].xml', bytes: enc.encode(contentTypes) },
    { name:'_rels/.rels', bytes: enc.encode(rootRels) },
    { name:'xl/workbook.xml', bytes: enc.encode(workbookXml) },
    { name:'xl/_rels/workbook.xml.rels', bytes: enc.encode(workbookRels) },
  ];
  sheets.forEach(function(s, i){
    files.push({ name:'xl/worksheets/sheet'+(i+1)+'.xml', bytes: enc.encode(xlsxWorksheetXml(s.rows)) });
  });
  return zipBuildStored(files);
}

/* ============================= CSV HELPERS ============================= */
function csvParse(text){
  var rows = []; var row = []; var field = ''; var inQuotes = false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (var i=0;i<text.length;i++){
    var ch = text[i];
    if (inQuotes){
      if (ch==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += ch;
    } else {
      if (ch==='"') inQuotes = true;
      else if (ch===','){ row.push(field); field=''; }
      else if (ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += ch;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  rows = rows.filter(function(r){ return !(r.length===1 && r[0]===''); });
  if (!rows.length) return [];
  var headers = rows[0].map(resolveDataLoadHeader);
  return rows.slice(1).map(function(r){
    var o = {}; headers.forEach(function(h,i){ o[h] = (r[i]!=null?r[i]:'').trim(); }); return o;
  });
}
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function csvStringify(headers, rows){
  return headers.join(',') + '\n' + rows.map(function(r){ return headers.map(function(h){ return csvCell(r[h]); }).join(','); }).join('\n');
}
// 'year' is included so the exported roster shows which cycle year each record belongs to, but it
// is display-only on the way in: commitDataLoad always stamps the current cycle year itself (see
// currentCycleYear()) and never reads a 'year' column back out of an uploaded row, so an old
// export re-uploaded later does not drag a stale year forward.
var DATA_LOAD_TEMPLATE_HEADERS = ['ggid','year','name','email','region','country','globalGrade','localGrade','practice','subPractice','supervisor','peopleManager','priorYearRating','performanceTrack','promotionReadiness','promotionRecommendation','timeInGrade','lpdDate','mandatoryTrainingStatus','learningHoursCompleted','certificationLevel','certificationDate','promotedPriorYear','activeBOTP','botpCompleted','utilization'];

/* A handful of header spellings real HRIS extracts commonly use that don't already match a
   template key once case/spacing/punctuation is normalized away (see normalizeHeaderKey) —
   mapped explicitly so an org's own export doesn't have to be renamed column-by-column to match
   the template. Headers that match a template key by normalization alone (e.g. "Global Grade" /
   globalGrade, "Sub Practice" / subPractice) need no entry here. */
var DATA_LOAD_HEADER_ALIASES = {
  'employeename':'name', 'fullname':'name', 'employeefullname':'name',
  'emailid':'email', 'emailaddress':'email', 'workemail':'email',
  'employeeid':'ggid', 'empid':'ggid',
  'supervisorname':'supervisor', 'supervisorfullname':'supervisor',
  'peoplemanager':'peopleManager', 'peoplemanagername':'peopleManager', 'managername':'peopleManager'
};
function normalizeHeaderKey(h){ return String(h==null?'':h).toLowerCase().replace(/[^a-z0-9]/g,''); }
/* Resolves one uploaded column header to the template field it represents: an alias match first,
   then a normalized match against DATA_LOAD_TEMPLATE_HEADERS itself, else the header is left as-is
   (harmless — it becomes a row property nothing reads, same as before this resolution existed). */
function resolveDataLoadHeader(h){
  var norm = normalizeHeaderKey(h);
  if (!norm) return '';
  if (DATA_LOAD_HEADER_ALIASES[norm]) return DATA_LOAD_HEADER_ALIASES[norm];
  var hit = DATA_LOAD_TEMPLATE_HEADERS.filter(function(k){ return normalizeHeaderKey(k)===norm; });
  return hit.length ? hit[0] : String(h||'').trim();
}

// Downloads a file the server generates (CSV template, roster export), keeping the session cookie
// and reporting a server error as a toast instead of saving an error page as the file.
function downloadFromServer(url, filename){
  fetch(url, { credentials: 'include' }).then(function(resp){
    if (!resp.ok) return resp.json().catch(function(){ return {}; }).then(function(b){ throw new Error(b.error || ('HTTP '+resp.status)); });
    return resp.blob();
  }).then(function(blob){
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(href); }, 1000);
    showToast('Saved '+filename);
  }).catch(function(err){ showToast('Download failed — '+err.message); });
}
// Ordinary browser download — a real hosted page has no need for the Claude-specific downloads
// bridge the Artifact/local-preview builds used; a plain Blob + temporary link works everywhere.
function offerDownload(filename, text){
  try{
    var blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Saved '+filename);
  }catch(e){
    showToast('Download failed — try again');
  }
}

/* Server-side Annual Data Load operations (server/routes/api.js). Each one waits for any pending
   save, calls the API, then reloads the workspace so STATE matches the database. */
function runServerOp(method, url, body, onDone){
  return whenSynced().then(function(){ return api(method, url, body); }).then(function(r){
    if (r.status === 401) return;
    if (!r.ok){ showToast('Failed — ' + (r.body.error || 'server error, try again')); return; }
    return reloadWorkspace(r.body.message).then(function(){ if (onDone) onDone(r.body); });
  }).catch(function(){ showToast('Failed — check your connection and try again'); });
}
function removeAllRecords(){
  return runServerOp('POST', '/api/data-load/remove-all', { actorName: currentUserName() });
}
function factoryReset(){
  return runServerOp('POST', '/api/data-load/factory-reset', { actorName: currentUserName(), confirm: 'DELETE EVERYTHING' }, function(){ go('dataload'); });
}
function loadXlsxFile(file){
  if (!xlsxSupported()){
    DL_PARSED = null;
    renderDataLoadPreview('excel-error', 'Your browser doesn\'t support in-browser Excel decompression. Try updating your browser, or save the file as CSV instead.');
    return;
  }
  renderDataLoadPreview('loading');
  file.arrayBuffer().then(function(buf){ return parseXlsxWorkbook(buf); }).then(function(rows){
    DL_PARSED = rows;
    renderDataLoadPreview();
  }).catch(function(err){
    DL_PARSED = null;
    renderDataLoadPreview('excel-error', (err && err.message) ? err.message : String(err));
  });
}
function nextCycleLabel(){
  var m = STATE.meta.cycleLabel.match(/(\d{4})/);
  if (!m) return STATE.meta.cycleLabel + ' (Next)';
  return STATE.meta.cycleLabel.replace(m[1], String(parseInt(m[1],10)+1));
}
function renderDataLoadPreview(mode, detail){
  var el = document.getElementById('dl-preview');
  if (mode==='loading'){
    el.innerHTML = '<div class="table-sub">Reading and parsing the Excel workbook — entirely in your browser, nothing is uploaded anywhere…</div>';
    return;
  }
  if (mode==='legacy-xls'){
    el.innerHTML = '<div class="card card-pad" style="background:var(--warning-soft);border-color:var(--warning);">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
      '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">Legacy .xls files aren\'t supported</div>'+
      '<div class="table-sub">Modern Excel workbooks (.xlsx) are read directly — but the older binary .xls format (Excel 97–2003) uses a different, much more complex encoding this page doesn\'t parse. In Excel: <strong>File → Save As</strong> → choose <strong>Excel Workbook (*.xlsx)</strong> or <strong>CSV (Comma delimited) (*.csv)</strong>, then upload that instead.</div></div></div></div>';
    return;
  }
  if (mode==='excel-error'){
    el.innerHTML = '<div class="card card-pad" style="background:var(--critical-soft);border-color:var(--critical);">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
      '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">Couldn\'t read that Excel file</div>'+
      '<div class="table-sub">'+esc(detail||'The file may be corrupted, password-protected, or in an unexpected format.')+' You can also save it as CSV and upload that instead.</div></div></div></div>';
    return;
  }
  if (!DL_PARSED || !DL_PARSED.length){ el.innerHTML = '<div class="table-sub">No rows parsed from that file. Make sure the first row of the first sheet has column headers matching the template, with data starting on row 2.</div>'; return; }
  // The server decides what each row will do (same logic as the commit), so the preview is exact.
  el.innerHTML = '<div class="table-sub">Checking '+DL_PARSED.length+' rows against the current roster…</div>';
  var parsed = DL_PARSED;
  api('POST', '/api/data-load/preview', { rows: parsed }).then(function(r){
    if (parsed !== DL_PARSED) return; // a different file was picked meanwhile
    if (r.status === 401) return;
    if (!r.ok){
      el.innerHTML = '<div class="card card-pad" style="background:var(--critical-soft);border-color:var(--critical);">'+
        '<div style="display:flex;gap:10px;align-items:flex-start;">'+icon('alert',16)+
        '<div><div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-primary);">This file can\'t be loaded</div>'+
        '<div class="table-sub">'+esc(r.body.error || 'The server rejected it.')+'</div></div></div></div>';
      return;
    }
    var p = r.body, s = p.summary;
    var html = '<div class="reason-list" style="margin-bottom:12px;">'+
      '<div class="reason-item">'+icon('check',13)+'<span>All '+s.total+' rows will be loaded — none are skipped. '+s.updates+' will update existing employees, '+s.creates+' will be added as new cases.</span></div>'+
      (s.flagged? '<div class="reason-item" style="color:var(--warning);">'+icon('alert',13)+'<span>'+s.flagged+' row(s) are missing some information — they\'ll still be loaded, and flagged with a "Missing data" badge under RTD Review so HR can follow up.</span></div>' : '')+
      '</div>';
    html += '<div class="table-scroll" style="max-height:280px;overflow-y:auto;"><table><thead><tr><th>GGID</th><th>Year</th><th>Name</th><th>Action</th><th>Region</th><th>Grade</th><th>Practice</th><th>Rating</th><th>Data quality</th></tr></thead><tbody>'+
      p.rows.slice(0,15).map(function(o, i){
        var row = parsed[i];
        return '<tr><td class="mono">'+esc(row.ggid||'—')+'</td><td>'+p.year+'</td><td>'+esc(o.name||'—')+'</td>'+
          '<td>'+(o.action==='update'?pill('Update','pill-accent'):pill('New','pill-special'))+'</td>'+
          '<td>'+esc(row.region||'—')+'</td><td>'+esc(row.globalGrade||'—')+'</td><td>'+esc(row.practice||'—')+'</td><td>'+esc(row.priorYearRating||'—')+'</td>'+
          '<td>'+(o.issues.length? '<span class="pill pill-warning" title="'+esc(o.issues.join(' · '))+'">'+icon('alert',11)+' '+o.issues.length+' missing</span>' : '<span class="pill pill-success">'+icon('check',11)+' OK</span>')+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+(s.total>15?'<div class="table-sub" style="margin-top:6px;">+ '+(s.total-15)+' more rows not shown</div>':'')+
      '<button class="btn btn-primary btn-sm" id="dl-commit" style="margin-top:14px;">'+icon('check',12)+' Commit upload ('+s.total+' rows'+(s.flagged? ', '+s.flagged+' flagged':'')+')</button>';
    el.innerHTML = html;
    document.getElementById('dl-commit').addEventListener('click', commitDataLoad);
  }).catch(function(){
    el.innerHTML = '<div class="table-sub" style="color:var(--critical);">Could not reach the server to check this file. Try again.</div>';
  });
}
function commitDataLoad(){
  var btn = document.getElementById('dl-commit');
  if (btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
  runServerOp('POST', '/api/data-load/commit', { fileName: DL_FILENAME || 'Uploaded file', rows: DL_PARSED, actorName: currentUserName() }, function(){
    DL_PARSED = null;
    DL_FILENAME = null;
  }).then(function(){
    var b = document.getElementById('dl-commit');
    if (b){ b.disabled = false; b.innerHTML = icon('check',12)+' Commit upload'; }
  });
}
// Undoes one upload: the employees it created are deleted (with their linked records) and the ones
// it updated are restored to their values from just before it ran. If a later upload re-touched one
// of those employees, that later change is rolled back too (one snapshot per batch per employee).

  return runServerOp('DELETE', '/api/data-load/batches/'+encodeURIComponent(batchId), { actorName: currentUserName() });
}

/* Reached when the sidebar's Year quick filter is set to a past (archived) cycle instead of the
   current one — shown in place of whatever dashboard is selected, since a historical cycle's
   snapshot only has this flat case summary, not the full live employee/account/workflow detail
   the dashboards render. Region/Country/Local Grade/Practice quick filters still apply, since the
   archived case objects carry those same fields (see archiveCurrentCycle). */
/* Reached when the sidebar's Year quick filter is set to a past (archived) cycle — shown in place of
   whichever dashboard is selected. Compares the archived cycle with the live one under the same
   Region/Country/Grade/Practice quick filters: the archive's counts and cases come from
   GET /api/archives/:id/cases, the live counts from the Executive dashboard endpoint. */
function viewYearSnapshot(cycleLabel){
  var meta = WS.archives.filter(function(x){ return x.cycleLabel===cycleLabel; })[0];
  if (!meta){ QF.year=''; saveQuickFilters(); renderApp(); return; }
  loadView(function(){
    return Promise.all([
      fetchJson('/api/archives/'+encodeURIComponent(meta.id)+'/cases'+queryString(qfParams({ limit:ARCHIVE_PAGE }))),
      fetchJson('/api/dashboards/executive'+queryString(qfParams()))
    ]);
  }, function(res){
    var d = res[0], live = res[1];
    var a = d.archive;
    var html = '<div class="card card-pad" style="margin-bottom:16px;background:var(--accent-soft);border-color:var(--accent);">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">'+
      '<div><div style="font-weight:700;font-family:var(--font-display);font-size:14.5px;">Viewing '+esc(a.cycleLabel)+' — read-only</div>'+
      '<div class="table-sub">Archived '+fmtDateTime(a.archivedAt)+' by '+esc(a.archivedBy)+'. This is a historical snapshot; ratings, eligibility, and workflow can\'t be edited here.</div></div>'+
      '<button class="btn btn-sm" id="ys-back">'+icon('grid',12)+' Back to '+esc(STATE.meta.cycleLabel)+'</button>'+
      '</div></div>';
    html += '<div class="card card-pad" style="margin-bottom:16px;"><div class="grid-3">'+
      stat('Cases in view', d.total)+stat('Total Archived', d.totalArchived)+stat('Cycle', esc(a.cycleLabel))+'</div></div>';

    if (d.total){
      var liveTotal = live.total || 0;
      var liveRatingCounts = live.ratingCounts || {}, liveEligCounts = live.eligibilityCounts || {};
      var ratingColors = ['var(--critical)','var(--warning)','var(--success)','var(--special)'];
      var eligData = function(counts){ return [{label:'Eligible',value:counts['Eligible']||0,color:'var(--success)'},{label:'Eligible With Exception',value:counts['Eligible With Exception']||0,color:'var(--warning)'},{label:'Not Eligible',value:counts['Not Eligible']||0,color:'var(--critical)'}]; };

      html += '<div class="section-title" style="margin-top:4px;">'+esc(a.cycleLabel)+' vs. '+esc(STATE.meta.cycleLabel)+'</div>'+
        '<div class="section-sub">Same Region/Country/Grade/Practice quick filters applied to both — Year itself is the only difference</div>';
      html += '<div class="grid-2" style="margin-bottom:16px;">';
      html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Rating distribution — '+esc(a.cycleLabel)+' ('+d.total+')</div>'+
        svgBarChart(RATINGS.map(function(r,i){return {label:r, value:d.ratingCounts[r], color:ratingColors[i]};}), {height:180})+'</div>';
      html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Rating distribution — '+esc(STATE.meta.cycleLabel)+' ('+liveTotal+')</div>'+
        svgBarChart(RATINGS.map(function(r,i){return {label:r, value:liveRatingCounts[r]||0, color:ratingColors[i]};}), {height:180})+'</div>';
      html += '</div>';
      html += '<div class="grid-2" style="margin-bottom:16px;">';
      html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Eligibility — '+esc(a.cycleLabel)+'</div>'+
        '<div style="display:flex;align-items:center;gap:20px;">'+svgDonut(eligData(d.eligibilityCounts))+legendRow(eligData(d.eligibilityCounts))+'</div></div>';
      html += '<div class="card card-pad"><div class="section-title" style="font-size:14.5px;">Eligibility — '+esc(STATE.meta.cycleLabel)+'</div>'+
        '<div style="display:flex;align-items:center;gap:20px;">'+svgDonut(eligData(liveEligCounts))+legendRow(eligData(liveEligCounts))+'</div></div>';
      html += '</div>';
      html += '<div class="card table-scroll">'+archiveCasesTable(d.cases, true)+
        (d.cases.length<d.total?'<div class="table-sub" style="padding:12px;">Showing the first '+d.cases.length+' of '+d.total+' — open the archive from Archives to page through all of them.</div>':'')+'</div>';
    } else {
      html += '<div class="empty-state">No archived cases match the current quick filters.</div>';
    }
    document.getElementById('view').innerHTML = html;
    var back = document.getElementById('ys-back');
    if (back) back.addEventListener('click', function(){ QF.year=''; saveQuickFilters(); renderApp(); });
  });
}

/* ============================= ROUTER / BOOT ============================= */
function viewAccessRestricted(msg){
  document.getElementById('view').innerHTML = '<div class="card card-pad" style="max-width:480px;margin:40px auto;text-align:center;">'+
    '<div style="color:var(--critical);margin-bottom:10px;">'+icon('shield',26)+'</div>'+
    '<div class="section-title" style="font-size:15px;">Restricted</div>'+
    '<div class="table-sub" style="margin-top:6px;">'+esc(msg)+'</div></div>';
}

function renderApp(){
  saveUiState();
  var route = currentRoute();
  var parts = route.split('/');
  var top = parts[0];
  renderSidebar();

  if (ROUTE_HR[top] && !isHR()){
    renderTopbar();
    viewAccessRestricted('This section is available to HR Admin only. Open Account in the upper-right corner to sign in as an HR Admin.');
    window.scrollTo(0,0);
    return;
  }
  // Year quick filter set to a past cycle: the four dashboards below assume the live, editable
  // roster, so a selected archive replaces whichever dashboard is active with its read-only
  // snapshot instead. Other routes (Data Load, Admin, Account, Archives itself, ...) don't use
  // quick filters at all and are unaffected. HR-gated same as Archives, since this surfaces the
  // same historical data.
  var DASH_ROUTES = ['dash-exec','dash-rtd','dash-promo','dash-calib'];
  if (QF.year && QF.year!==STATE.meta.cycleLabel && isHR() && DASH_ROUTES.indexOf(top)>=0){
    renderTopbar('Historical snapshot');
    viewYearSnapshot(QF.year);
    window.scrollTo(0,0);
    return;
  }
  if (top==='dash-exec'){ renderTopbar(); viewExecutiveDashboard(); }
  else if (top==='dash-rtd'){ renderTopbar(); viewRTDDashboard(); }
  else if (top==='dash-promo'){ renderTopbar(); viewPromotionDashboard(); }
  else if (top==='dash-calib'){ renderTopbar(); viewCalibrationDashboard(); }
  else if (top==='dossiers' && parts[1]){ renderTopbar(); viewDossierDetail(parts[1]); }
  else if (top==='account'){ renderTopbar(); viewAccount(); }
  else if (top==='admin'){ renderTopbar(adminTabLabel(parts[1] || ADMIN_TABS[0][0])); viewAdmin(parts[1]); }
  else if (top==='audit'){ renderTopbar(); viewAudit(); }
  else if (top==='dataload'){ renderTopbar(); viewDataLoad(); }
  else if (top==='archives' && parts[1]){ renderTopbar('Archived cycle'); viewArchiveDetail(parts[1]); }
  else if (top==='archives'){ renderTopbar(); viewArchives(); }
  else { renderTopbar(); viewExecutiveDashboard(); }

  window.scrollTo(0,0);
}

/* Narrow-screen sidebar: an off-canvas drawer toggled from the hamburger button in the topbar
   (see renderTopbar). #app and #sidebar-backdrop are outside the parts of the DOM that get
   replaced on every render, so this only needs to be bound once. */
function toggleSidebar(){ document.getElementById('app').classList.toggle('sidebar-open'); }
function closeSidebar(){ document.getElementById('app').classList.remove('sidebar-open'); }
document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

/* The Administration dropdown (see renderTopbar) is rebuilt fresh on every render, so this looks
   the elements up live rather than capturing references — a single listener bound once here,
   same rationale as the sidebar backdrop above, closes it on any click outside the button/menu. */
document.addEventListener('click', function(ev){
  [['admin-dropdown-menu','topbar-admin-btn'], ['profile-dropdown-menu','topbar-profile-btn']].forEach(function(pair){
    var menu = document.getElementById(pair[0]);
    var btn = document.getElementById(pair[1]);
    if (menu && menu.classList.contains('open') && !menu.contains(ev.target) && !(btn && btn.contains(ev.target))){
      menu.classList.remove('open');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  });
});

/* ============================= BOOT (server auth + data load) ============================= */
function showAuthGate(msg){
  var appEl = document.getElementById('app');
  if (appEl) appEl.hidden = true;
  var g = document.getElementById('auth-gate');
  g.hidden = false;
  var m = document.getElementById('auth-gate-msg');
  if (m) m.textContent = msg || '';
}
function hideAuthGate(){
  document.getElementById('auth-gate').hidden = true;
  document.getElementById('app').hidden = false;
}
function clearAuthMessages(){
  document.getElementById('auth-gate-msg').textContent = '';
  document.getElementById('auth-gate-msg-reg').textContent = '';
}
function wireAuthForms(){
  document.getElementById('auth-brand').innerHTML = brandHtml();
  var toRegister = document.getElementById('show-register');
  var toLogin = document.getElementById('show-login');
  if (toRegister) toRegister.addEventListener('click', function(ev){
    ev.preventDefault();
    document.getElementById('login-panel').hidden = true;
    document.getElementById('register-panel').hidden = false;
    clearAuthMessages();
  });
  if (toLogin) toLogin.addEventListener('click', function(ev){
    ev.preventDefault();
    document.getElementById('register-panel').hidden = true;
    document.getElementById('login-panel').hidden = false;
    clearAuthMessages();
  });
  var loginForm = document.getElementById('login-form');
  if (loginForm) loginForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var errEl = document.getElementById('auth-gate-msg');
    errEl.textContent = '';
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    fetch('/api/auth/login', {
      method: 'POST', credentials: 'include', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email, password: password })
    }).then(function(resp){
      return resp.json().catch(function(){ return {}; }).then(function(body){ return { ok: resp.ok, body: body }; });
    }).then(function(r){
      if (!r.ok){ errEl.textContent = r.body.error || 'Login failed — check your email and password.'; return; }
      SESSION_EXPIRED = false;
      JUST_SIGNED_IN = true;
      boot();
    }).catch(function(){ errEl.textContent = 'Could not reach the server. Check your connection.'; });
  });
  var registerForm = document.getElementById('register-form');
  if (registerForm) registerForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var errEl = document.getElementById('auth-gate-msg-reg');
    errEl.textContent = '';
    var email = document.getElementById('register-email').value.trim();
    var password = document.getElementById('register-password').value;
    var password2 = document.getElementById('register-password2').value;
    if (password !== password2){ errEl.textContent = 'Passwords do not match.'; return; }
    if (password.length < 8){ errEl.textContent = 'Password must be at least 8 characters.'; return; }
    fetch('/api/auth/register', {
      method: 'POST', credentials: 'include', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email, password: password })
    }).then(function(resp){
      return resp.json().catch(function(){ return {}; }).then(function(body){ return { ok: resp.ok, body: body }; });
    }).then(function(r){
      if (!r.ok){ errEl.textContent = r.body.error || 'Could not create that account.'; return; }
      SESSION_EXPIRED = false;
      JUST_SIGNED_IN = true;
      boot();
    }).catch(function(){ errEl.textContent = 'Could not reach the server. Check your connection.'; });
  });
}
var HASH_LISTENER_BOUND = false;
// Set when the server has just accepted a sign-in. If the very next "who am I" check still finds no
// session, the browser dropped the session cookie (typically: the server marks it HTTPS-only but the
// app is opened over plain http) — say so instead of silently showing the login form again.
var JUST_SIGNED_IN = false;
function boot(){
  fetch('/api/auth/me', { credentials: 'include' }).then(function(meResp){
    var justSignedIn = JUST_SIGNED_IN;
    JUST_SIGNED_IN = false;
    if (!meResp.ok){
      showAuthGate(justSignedIn ? 'Your password was accepted, but this browser didn\'t keep the sign-in. '+
        (location.protocol === 'http:' ? 'The server is marking its login cookie as HTTPS-only while this page is plain http. Ask whoever runs the server to set COOKIE_SECURE=auto in server/.env (or open the app over https).' : 'Check that cookies are allowed for this site.') : '');
      return null;
    }
    return meResp.json().then(function(me){
      SESSION_EMAIL = me.email;
      PREFS.role = me.role === 'HR Admin' ? 'HR Admin' : 'RTD Reviewer';
      savePrefs();
      return loadWorkspace().then(function(){
        hideAuthGate();
        var hashBefore = location.hash;
        restoreUiStateIfEmpty();
        if (!HASH_LISTENER_BOUND){ window.addEventListener('hashchange', renderApp); HASH_LISTENER_BOUND = true; }
        // Restoring the last route changes the hash, and the hashchange listener renders it.
        if (location.hash === hashBefore) renderApp();
      });
    });
  }).catch(function(err){
    console.error('boot failed', err);
    showAuthGate('Could not load the app: ' + ((err && err.message) || 'server unreachable') + '. Check your connection and reload the page.');
  });
}
wireAuthForms();
boot();

})();
</script>
