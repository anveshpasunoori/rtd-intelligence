<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RTD Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================= DESIGN TOKENS ============================= */
  /* "Collective"-style admin palette: soft lavender-grey canvas, white cards with a faint shadow,
     indigo primary with purple / mint / pink accents, Nunito type. Stat cards use --stat-1..4 for
     their colored top border and number. */
  :root {
    color-scheme: light;
    --bg: #eff1f9;
    --bg-elevated: #f4f5fb;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --border: #dfe3f1;
    --border-soft: #e9ecf6;
    --text-primary: #212529;
    --text-secondary: #5a6378;
    --text-tertiary: #9097a8;
    --accent: #4755ab;
    --accent-hover: #3a4695;
    --accent-soft: #e7e9f7;
    --accent-contrast: #ffffff;
    --success: #02a47b;
    --success-soft: #dff7f0;
    --warning: #c27400;
    --warning-soft: #fff1dc;
    --critical: #e8386b;
    --critical-soft: #ffe6ee;
    --special: #b162ac;
    --special-soft: #f6e9f5;
    --stat-1: #4755ab;
    --stat-2: #b162ac;
    --stat-3: #03c895;
    --stat-4: #ff4f81;
    --sidebar-bg: #ffffff;
    --sidebar-active: #b162ac;
    --brand-bg: #4755ab;
    --header-bg: #ffffff;
    --header-text: #212529;
    --header-muted: #8a90a2;
    --header-hover: #f1f2f9;
    --header-border: transparent;
    --header-input: #eeeeee;
    --shadow-sm: 0 1px 2px 1px rgba(154,154,204,0.22);
    --shadow-md: 0 8px 24px rgba(61,119,180,0.14);
    --shadow-lg: 0 18px 40px rgba(40,48,110,0.18);
    --shadow-header: 1px 0 3px rgba(0,0,0,0.15);
    --header-h: 60px;
    --sidebar-w: 240px;
    --sidebar-w-collapsed: 64px;
    --radius-sm: 4px;
    --radius-md: 4px;
    --radius-lg: 8px;
    --font-display: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-text: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161a2c;
      --bg-elevated: #20253b;
      --surface: #1d2136;
      --surface-raised: #252a42;
      --border: #30365a;
      --border-soft: #282d48;
      --text-primary: #e6e8f2;
      --text-secondary: #a5aac4;
      --text-tertiary: #727894;
      --accent: #6f7ddb;
      --accent-hover: #8a96e6;
      --accent-soft: rgba(111,125,219,0.18);
      --accent-contrast: #ffffff;
      --success: #2fd3a6;
      --success-soft: rgba(47,211,166,0.14);
      --warning: #f0a53a;
      --warning-soft: rgba(240,165,58,0.14);
      --critical: #ff6b93;
      --critical-soft: rgba(255,107,147,0.14);
      --special: #d38fce;
      --special-soft: rgba(211,143,206,0.16);
      --stat-1: #8c98ee;
      --stat-2: #d38fce;
      --stat-3: #2fd3a6;
      --stat-4: #ff6b93;
      --sidebar-bg: #1d2136;
      --sidebar-active: #d38fce;
      --brand-bg: #3d4896;
      --header-bg: #1d2136;
      --header-text: #e6e8f2;
      --header-muted: #8f95b2;
      --header-hover: rgba(255,255,255,0.06);
      --header-border: #282d48;
      --header-input: #252a42;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow-md: 0 8px 20px rgba(0,0,0,0.45);
      --shadow-lg: 0 20px 48px rgba(0,0,0,0.55);
      --shadow-header: 0 1px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161a2c;
    --bg-elevated: #20253b;
    --surface: #1d2136;
    --surface-raised: #252a42;
    --border: #30365a;
    --border-soft: #282d48;
    --text-primary: #e6e8f2;
    --text-secondary: #a5aac4;
    --text-tertiary: #727894;
    --accent: #6f7ddb;
    --accent-hover: #8a96e6;
    --accent-soft: rgba(111,125,219,0.18);
    --accent-contrast: #ffffff;
    --success: #2fd3a6;
    --success-soft: rgba(47,211,166,0.14);
    --warning: #f0a53a;
    --warning-soft: rgba(240,165,58,0.14);
    --critical: #ff6b93;
    --critical-soft: rgba(255,107,147,0.14);
    --special: #d38fce;
    --special-soft: rgba(211,143,206,0.16);
    --stat-1: #8c98ee;
    --stat-2: #d38fce;
    --stat-3: #2fd3a6;
    --stat-4: #ff6b93;
    --sidebar-bg: #1d2136;
    --sidebar-active: #d38fce;
    --brand-bg: #3d4896;
    --header-bg: #1d2136;
    --header-text: #e6e8f2;
    --header-muted: #8f95b2;
    --header-hover: rgba(255,255,255,0.06);
    --header-border: #282d48;
    --header-input: #252a42;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 8px 20px rgba(0,0,0,0.45);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.55);
    --shadow-header: 0 1px 0 rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0; text-wrap: balance; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .tabular { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }

  /* ============================= APP SHELL ============================= */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #app-body { display: flex; flex: 1; min-height: 0; }

  /* White sidebar with a soft shadow; collapses to an icon rail (see the collapse toggle at its
     foot, and the #app.sidebar-collapsed rules further down). */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--sidebar-bg); box-shadow: 0 8px 24px rgba(61,119,180,0.12);
    display: flex; flex-direction: column;
    position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; overflow-x: hidden;
    transition: width 0.18s ease; z-index: 20;
  }
  .sidebar-head { display: none; align-items: center; justify-content: space-between; padding: 14px 16px 6px 18px; }
  .sidebar-head strong { font-size: 13px; font-weight: 800; }
  /* Brand block: a solid indigo tile at the left of the header, exactly as wide as the sidebar. */
  .brand {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    align-self: stretch; width: var(--sidebar-w); padding: 0 18px;
    background: var(--brand-bg); color: #ffffff; text-decoration: none; cursor: pointer;
    transition: width 0.18s ease, padding 0.18s ease; overflow: hidden;
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.16);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
  .brand-text strong { font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; }
  .brand-text span { font-size: 10px; color: rgba(255,255,255,0.72); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }

  .sidebar-filters {
    padding: 14px 8px 16px 8px; margin: 0 10px 4px 10px;
    display: flex; flex-direction: column; gap: 7px;
    border-bottom: 1px solid var(--border-soft);
  }
  .sidebar-filters select {
    width: 100%; font-size: 13px; padding: 7px 9px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
    font-family: var(--font-text); outline: none; cursor: pointer;
  }
  .sidebar-filters select:focus { border-color: var(--accent); }

  .nav-scroll { flex: 1; padding: 6px 10px 16px 10px; }
  .nav-group { margin-top: 16px; }
  .nav-group:first-child { margin-top: 6px; }
  .nav-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-tertiary); padding: 0 12px 6px 12px; white-space: nowrap;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--text-secondary); font-size: 14px; font-weight: 600;
    cursor: pointer; user-select: none; text-decoration: none; white-space: nowrap;
    margin-bottom: 2px; position: relative;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav-item svg { flex-shrink: 0; }
  .nav-item:hover { color: var(--sidebar-active); }
  .nav-item.active { color: var(--sidebar-active); background: var(--special-soft); }
  .nav-item .count {
    margin-left: auto; font-size: 10.5px; font-weight: 800;
    background: var(--bg-elevated); color: var(--text-secondary);
    border-radius: 20px; padding: 1px 7px;
  }
  .nav-item.active .count { background: var(--sidebar-active); color: #ffffff; }
  .sidebar-foot { border-top: 1px solid var(--border-soft); padding: 8px 10px; flex-shrink: 0; }
  .sidebar-collapse-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
    background: transparent; border: none; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-secondary); font-family: var(--font-text); font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .sidebar-collapse-btn:hover { color: var(--sidebar-active); }
  .sidebar-collapse-btn svg { flex-shrink: 0; transition: transform 0.18s ease; }

  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--special-soft); color: var(--special);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0;
  }
  .account-row {
    display: flex; align-items: center; gap: 11px; padding: 10px 4px;
  }
  .account-row + .account-row { border-top: 1px solid var(--border-soft); }
  .account-row.clickable { cursor: pointer; border-radius: 8px; }
  .account-row.clickable:hover { background: var(--bg-elevated); }
  .account-row .who { display: flex; flex-direction: column; min-width: 0; }
  .account-row .who strong { font-size: 12.5px; font-weight: 700; }
  .account-row .who span { font-size: 11px; color: var(--text-tertiary); }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* White header: indigo brand block at the left (sidebar-wide), page title, then search, theme,
     Administration and the profile avatar at the right. */
  #topbar {
    position: sticky; top: 0; z-index: 30; height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px 0 0; background: var(--header-bg); color: var(--header-text);
    box-shadow: var(--shadow-header); border-bottom: 1px solid var(--header-border);
  }
  #topbar .crumb-sep { display: none; }
  #topbar .crumb { margin-left: 14px; font-size: 16px; font-weight: 700; font-family: var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #topbar .crumb .sub { color: var(--header-muted); font-weight: 600; }
  #topbar .spacer { flex: 1; }
  .hdr-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px;
    background: transparent; border: 1px solid transparent; color: var(--header-text);
    font-family: var(--font-text); font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .hdr-btn:hover, .hdr-btn.active { background: var(--header-hover); color: var(--accent); }
  .hdr-btn.icon-only { padding: 0; border-radius: 50%; background: var(--header-hover); color: var(--accent); }
  .hdr-btn .admin-chevron { color: var(--header-muted); display: inline-flex; }
  .topbar-admin-wrap, .topbar-profile-wrap { position: relative; flex-shrink: 0; }
  .admin-dropdown {
    display: none; position: absolute; top: calc(100% + 10px); right: 0; min-width: 220px;
    background: var(--surface); color: var(--text-primary); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md); padding: 6px; z-index: 40;
  }
  .admin-dropdown.open { display: block; }
  .admin-dropdown-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
  }
  .admin-dropdown-item svg { flex-shrink: 0; }
  .admin-dropdown-item:hover { background: var(--bg-elevated); color: var(--sidebar-active); }
  .admin-dropdown-item.active { background: var(--special-soft); color: var(--sidebar-active); font-weight: 700; }
  .admin-dropdown-item.danger { color: var(--critical); }
  .admin-dropdown-item.danger:hover { background: var(--critical-soft); color: var(--critical); }
  .dropdown-sep { height: 1px; background: var(--border-soft); margin: 6px 4px; }
  .profile-menu { min-width: 260px; }
  .profile-menu-head { display: flex; align-items: center; gap: 11px; padding: 10px 10px 12px 10px; }
  .profile-menu-head .who { display: flex; flex-direction: column; min-width: 0; }
  .profile-menu-head .who strong { font-size: 13.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-menu-head .who span { font-size: 12px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-profile {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 3px; height: 40px;
    border-radius: 999px; border: 1px solid transparent; background: transparent; cursor: pointer; flex-shrink: 0;
    color: var(--header-muted);
  }
  .topbar-profile:hover, .topbar-profile.active { background: var(--header-hover); }
  .topbar-profile .profile-chevron { display: inline-flex; }
  .topbar-profile .user-avatar { width: 34px; height: 34px; font-size: 13px; background: var(--accent); color: var(--accent-contrast); position: relative; }
  /* "Online" dot on the header avatar. */
  .topbar-profile .user-avatar::after {
    content: ''; position: absolute; right: -1px; top: -1px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--stat-3); border: 2px solid var(--header-bg);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--header-input); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 0 11px; height: 36px; width: 260px; flex-shrink: 1; min-width: 160px;
    color: var(--header-muted);
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box input {
    border: none; background: transparent; outline: none; font-size: 13.5px; width: 100%; min-width: 0;
    color: var(--header-text); font-family: var(--font-text);
    text-overflow: ellipsis;
  }
  .search-box input::placeholder { color: var(--header-muted); }

  #view { padding: 24px 28px 60px 28px; max-width: 1400px; width: 100%; margin: 0 auto; }
  /* A view refreshing its data from the API keeps its current content, dimmed, until the new data arrives. */
  #view.is-loading { opacity: 0.55; pointer-events: none; transition: opacity 0.15s ease; }

  /* Collapsed sidebar (wide screens only — on narrow screens the sidebar is a drawer instead). */
  @media (min-width: 901px) {
    #app.sidebar-collapsed #sidebar { width: var(--sidebar-w-collapsed); }
    #app.sidebar-collapsed .sidebar-filters,
    #app.sidebar-collapsed .nav-label,
    #app.sidebar-collapsed .nav-item span,
    #app.sidebar-collapsed .sidebar-collapse-btn span { display: none; }
    #app.sidebar-collapsed .nav-scroll { padding: 10px 8px; }
    #app.sidebar-collapsed .nav-item,
    #app.sidebar-collapsed .sidebar-collapse-btn { justify-content: center; padding: 10px 0; }
    #app.sidebar-collapsed .sidebar-foot { padding: 8px; }
    #app.sidebar-collapsed .sidebar-collapse-btn svg { transform: rotate(180deg); }
    #app.sidebar-collapsed #topbar .brand { width: var(--sidebar-w-collapsed); padding: 0; justify-content: center; }
    #app.sidebar-collapsed #topbar .brand-text { display: none; }
  }

  /* Page greeting at the top of the Executive dashboard. */
  .page-greeting { margin-bottom: 18px; }
  .page-greeting h1 { font-size: 24px; font-weight: 600; letter-spacing: 0; color: var(--text-primary); }
  .page-greeting h1 span { color: var(--accent); }
  .page-greeting .section-sub { margin: 2px 0 0 0; }

  /* ============================= PRIMITIVES ============================= */
  .card {
    background: var(--surface); border: none;
    border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  }
  .card-pad { padding: 20px; }
  .section-title { font-size: 18px; font-weight: 700; font-family: var(--font-display); letter-spacing: 0; margin-bottom: 2px; }
  .section-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  /* Chart cards: centered title in the primary color. */
  .chart-card > .section-title { text-align: center; color: var(--accent); font-weight: 600; font-size: 19px; }
  .chart-card > .section-sub { text-align: center; }

  /* Stat cards: 2px colored top border, a large faded line icon on the left, and the number
     (bold, in the card's color) with its label on the right. kpi-auto cards take their color from
     their position in the row; the others from their kpi-<color> class. */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .kpi-card-v2 {
    --kpi: var(--stat-1);
    display: grid; grid-template-columns: auto 1fr; grid-template-areas: "icon value" "icon label" "sub sub";
    align-items: center; column-gap: 14px; padding: 20px 22px;
    border-top: 2px solid var(--kpi);
  }
  .kpi-grid > .kpi-auto:nth-child(4n+1), .kpi-card-v2.kpi-accent { --kpi: var(--stat-1); }
  .kpi-grid > .kpi-auto:nth-child(4n+2), .kpi-card-v2.kpi-special { --kpi: var(--stat-2); }
  .kpi-grid > .kpi-auto:nth-child(4n+3), .kpi-card-v2.kpi-success { --kpi: var(--stat-3); }
  .kpi-grid > .kpi-auto:nth-child(4n+4), .kpi-card-v2.kpi-critical { --kpi: var(--stat-4); }
  .kpi-card-v2.kpi-warning { --kpi: var(--warning); }
  .kpi-card-v2 .kpi-top { grid-area: icon; display: flex; align-items: center; gap: 6px; }
  .kpi-icon-badge { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-tertiary); opacity: 0.55; }
  .kpi-icon-badge svg { width: 44px; height: 44px; stroke-width: 1.2; }
  .kpi-card-v2 .kpi-value2 { grid-area: value; text-align: right; font-size: 28px; font-weight: 800; font-family: var(--font-display); color: var(--kpi); line-height: 1.15; white-space: nowrap; }
  .kpi-card-v2 .kpi-label2 { grid-area: label; text-align: right; font-size: 13.5px; color: var(--text-secondary); font-weight: 600; }
  .kpi-card-v2 .kpi-sub2 { grid-area: sub; font-size: 12px; color: var(--text-tertiary); margin-top: 10px; }
  .kpi-card-v2 .kpi-sub2:empty { display: none; }
  .kpi-card-v2 .kpi-chevron { color: var(--text-tertiary); display: inline-flex; }
  .kpi-card-v2.clickable-kpi { cursor: pointer; transition: box-shadow .15s; }
  .kpi-card-v2.clickable-kpi:hover { box-shadow: var(--shadow-md); }
  .kpi-card-v2.kpi-active { box-shadow: 0 0 0 2px var(--kpi); }
  .icon-badge-round { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-badge-round.badge-accent { background: var(--accent-soft); color: var(--accent); }
  .icon-badge-round.badge-success { background: var(--success-soft); color: var(--success); }
  .icon-badge-round.badge-warning { background: var(--warning-soft); color: var(--warning); }
  .icon-badge-round.badge-critical { background: var(--critical-soft); color: var(--critical); }
  .icon-badge-round.badge-special { background: var(--special-soft); color: var(--special); }
  .mini-progress-track { height: 5px; border-radius: 3px; background: var(--border-soft); overflow: hidden; margin-top: 6px; }
  .mini-progress-fill { height: 100%; border-radius: 3px; }

  .grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .grid-2-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  /* Promotions top row: the funnel gets the widest column so its labels stay readable. */
  .grid-promo { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

  /* #auth-gate's and #app's own display rules would otherwise beat the hidden attribute. */

<div id="auth-gate" hidden>

          <div class="field"><label for="register-password2">Confirm password</label><input id="register-password2" type="password" autocomplete="new-password" required minlength="8"/></div>

<script>
(function(){
"use strict";

/* Capture the pristine, pre-render document source immediately — before any
   dynamic rendering touches the DOM — so republishing never serializes a
   live/mutated DOM, only this untouched initial shell with a fresh state blob
   swapped in. */
/* ============================= STATE ============================= */
/* The server holds the data and runs the rules engine (server/lib/engine.js); this page never
   downloads the roster. STATE holds only the shared workspace settings (rules, Administration
   reference data, cycle label, configs) from GET /api/workspace, and WS the rest of that response:
   record counts, filter options, archived cycles and this cycle's uploads. Each screen fetches its
   own aggregates and rows from the API (see the VIEW sections). */
var STATE = null;
var WS = null;
function currentCycleYear(){
  var m = STATE.meta.cycleLabel.match(/(\d{4})/);
  return m ? parseInt(m[1],10) : new Date().getFullYear();
}
// Fills in settings an older workspace may lack (the server applies the same defaults).
function applyStateDefaults(){
  if (!STATE.meta.cycleLabel) STATE.meta.cycleLabel = 'FY2026 RTD Cycle';
  ensureQuotaConfigDefaults();
  PARAM_META.l1MinGrade.options = gradeOrder();
  PARAM_META.l2MinGrade.options = gradeOrder();
}
var UI = { filters: {}, sort: {}, modal: null, search: '' };

/* ============================= VIEWER ROLE (per-browser, not shared) =============================
   Role lives in this viewer's own localStorage — never in the persisted artifact STATE — because each
   viewer can pick a different role on the same shared page. This is a UI-level convenience, not a
   security boundary: there is no backend or login here, so it restricts what the app *shows*, not what a
   determined user could inspect in devtools. */
/* theme defaults to "light" explicitly rather than following the OS/browser's own dark-mode
   setting — a viewer whose system happens to be in dark mode should still see the app the way it
   was designed to look until they deliberately flip the switch, not silently inherit dark. */
function loadPrefs(){
  try{
    var raw = localStorage.getItem('rtd_viewer_prefs_v1');
    if (raw){ var p = JSON.parse(raw); if (p && p.role) return {role:p.role, userId:p.userId||null, theme:p.theme==='dark'?'dark':'light', sidebarCollapsed:!!p.sidebarCollapsed}; }
  }catch(e){}
  return { role:'RTD Reviewer', userId:null, theme:'light', sidebarCollapsed:false };
}
function savePrefs(){ try{ localStorage.setItem('rtd_viewer_prefs_v1', JSON.stringify(PREFS)); }catch(e){} }
var PREFS = loadPrefs();
function applyTheme(){ document.documentElement.setAttribute('data-theme', PREFS.theme==='dark'?'dark':'light'); }
applyTheme();
// PREFS.role is overwritten from the server login's role on every boot (see boot()); the Account
// page's identity picker no longer changes it, so access follows the logged-in account.
function isHR(){ return PREFS.role === 'HR Admin'; }
/* Signing in from the Account page (or being provisioned under Administration → Users &
   Permissions) is the whole identity layer this app has — no passwords, no backend. When nobody
   has signed in on this browser/device, currentUser() returns null ("guest") and currentUserName()
   falls back to the static seed name, which is exactly the app's original default behavior, so
   nothing regresses for anyone who never touches Account. */
function currentUser(){
  if (!PREFS.userId) return null;
  return (STATE.adminConfig.users||[]).filter(function(u){ return u.id===PREFS.userId; })[0] || null;
}
// First name for the dashboard greeting: the picked reviewer identity, else the login's email
// (anvesh.pasunoori@… → "Anvesh").
function greetingName(){
  var u = currentUser();
  var base = u ? u.name : (SESSION_EMAIL ? SESSION_EMAIL.split('@')[0] : 'there');
  var first = base.split(/[\s._-]+/)[0] || base;
  return first.charAt(0).toUpperCase() + first.slice(1);
}
// Name recorded on audit entries and uploads: the reviewer identity picked on the Account page,
// else the logged-in account's email.
function currentUserName(){
  var u = currentUser();
  return u ? u.name : (SESSION_EMAIL || STATE.meta.currentUser);
}

/* Region Type -> Region hierarchy, read live off Administration > Region Types & Regions
   (STATE.adminConfig) — same pattern as gradeOrder()/localGradeOrder(): the admin-configured list
   is the source of truth. Region itself is the org's actual country-level value (e.g. "United
   States"); Region Type is the broader roll-up an admin groups those countries into (e.g. "North
   America"). Every employee whose Region falls under the selected Region Type is shown, regardless
   of what a raw regionType value on the record might say — falls back to the employee's own
   regionType field only when their region isn't in the configured map at all. */
function regionTypeMap(){
  var map = {};
  (STATE.adminConfig.regionTypes||[]).forEach(function(rt){ if (rt.name) map[rt.name] = []; });
  (STATE.adminConfig.regions||[]).forEach(function(r){
    if (!r.name || !r.regionType) return;
    if (!map[r.regionType]) map[r.regionType] = [];
    map[r.regionType].push(r.name);
  });
  return map;
}
function regionTypeForRegion(region){
  var hit = (STATE.adminConfig.regions||[]).filter(function(r){ return r.name===region; })[0];
  return hit ? hit.regionType : null;
}
function regionTypeForEmployee(e){ return regionTypeForRegion(e.region) || e.regionType || ''; }

/* Sidebar quick filters (Region Type / Region / Local Grade / Practice) — a per-viewer convenience
   narrowing of what's shown, so it lives in localStorage the same way and never touches shared
   STATE. */
function loadQuickFilters(){
  try{
    var raw = localStorage.getItem('rtd_quick_filters_v1');
    if (raw){ var q = JSON.parse(raw); if (q) return {regionType:q.regionType||'', region:q.region||'', localGrade:q.localGrade||'', practice:q.practice||'', year:q.year||''}; }
  }catch(e){}
  return { regionType:'', region:'', localGrade:'', practice:'', year:'' };
}
function saveQuickFilters(){ try{ localStorage.setItem('rtd_quick_filters_v1', JSON.stringify(QF)); }catch(e){} }
var QF = loadQuickFilters();
function quickFiltersActive(){ return !!(QF.regionType || QF.region || QF.localGrade || QF.practice || QF.year); }
function matchesQuickFilters(e){
  if (QF.regionType && regionTypeForEmployee(e) !== QF.regionType) return false;
  if (QF.region && e.region !== QF.region) return false;
  if (QF.localGrade && e.localGrade !== QF.localGrade) return false;
  if (QF.practice && e.practice !== QF.practice) return false;
  return true;
}

function byId(arr, id){ for (var i=0;i<arr.length;i++){ if (arr[i].id===id) return arr[i]; } return null; }
function fmtMoney(n){ if (n==null) return '—'; return '$' + Math.round(n).toLocaleString('en-US'); }
function fmtDate(d){ if(!d) return '—'; var parts=d.split('-'); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m[parseInt(parts[1],10)-1]+' '+parseInt(parts[2],10)+', '+parts[0]; }
function fmtDateTime(iso){ if(!iso) return '—'; var d = new Date(iso); return fmtDate(d.toISOString().slice(0,10)) + ' · ' + d.toISOString().slice(11,16)+' UTC'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(name){ return name.split(' ').map(function(p){return p[0];}).join('').slice(0,2).toUpperCase(); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }
function nowIso(){ return new Date().toISOString(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

var RATINGS = ['Needs Improvement','Succeeding','Exceeding','Exceptional'];
var RATING_RANK = {'Needs Improvement':0,'Succeeding':1,'Exceeding':2,'Exceptional':3};
/* Distinct Global Grades, most-junior first, read live off Administration > Roles & Grade Titles
   instead of a hard-coded list — that screen already promises free-text grades ("type a new one...
   if a title needs its own grade"), so anything derived from the grade set (quotas, rank
   comparisons, rule/filter dropdowns) needs to track whatever grades are actually configured rather
   than a fixed C1-F4 scheme. Order follows first appearance in the roles list, which is how both the
   seed data and an admin's own edits naturally sort junior to senior. */
function gradeOrder(){
  var seen = {}, list = [];
  (STATE.adminConfig.localGrades||[]).forEach(function(r){
    var g = r.globalGrade;
    if (g && !seen[g]){ seen[g] = true; list.push(g); }
  });
  return list;
}
/* Distinct Local Grades, same order/derivation as gradeOrder() above but at the per-role level —
   Local Grade is the actual title-level code (e.g. B1 Associate Consultant vs B2 Consultant, both
   under the broader Global Grade B), so quotas need this finer granularity: two roles sharing a
   Global Grade can still need very different promotion/rating caps. */
function localGradeOrder(){
  var seen = {}, list = [];
  (STATE.adminConfig.localGrades||[]).forEach(function(r){
    var g = r.localGrade;
    if (g && !seen[g]){ seen[g] = true; list.push(g); }
  });
  return list;
}
/* The title a Local Grade code stands for (e.g. 'B1' -> 'Associate Consultant'), per Administration
   > Roles & Grade Titles — falls back to the bare code itself when it's not in that list (an
   orphaned/legacy code on some employee record shouldn't make the filter dropdown break). */
function localGradeName(code){
  var hit = (STATE.adminConfig.localGrades||[]).filter(function(r){ return r.localGrade===code; })[0];
  return hit ? hit.name : code;
}
/* The reverse of localGradeName: an employee record's own localGrade field actually stores the
   readable title (e.g. "Sr Consultant"), not the code — but STATE.quotaConfig, localGradeOrder(),
   and the admin quota editor are all keyed by code (e.g. "C1"). Needed anywhere a quota needs to
   be looked up for a given employee/case. Falls back to the input itself when no title matches
   (an orphaned/legacy title), same fallback style as localGradeName. */
function localGradeCodeForName(name){
  var hit = (STATE.adminConfig.localGrades||[]).filter(function(r){ return r.name===name; })[0];
  return hit ? hit.localGrade : name;
}

/* Forced-distribution quotas: what PERCENTAGE of a Local Grade's population may receive each
   rating, and what percentage may be promoted, this cycle. Admin-configurable under
   Administration > Rating & Promotion Quotas. Null = uncapped. Stored as a percentage (not a
   headcount) so the actual cap tracks the grade's headcount automatically as it changes cycle to
   cycle — see promotionQuotaExceptions in server/lib/engine.js for where the promotions percentage is converted to an
   actual count. Seeded with a sensible default per Local Grade — the allowed share (promotions
   and the Needs Improvement/Exceeding/Exceptional caps) shrinks as seniority rises, with
   Succeeding left uncapped throughout since it's meant to absorb whoever doesn't land in a more
   tightly controlled bucket. A grade added later with no matching default just comes up uncapped
   rather than erroring. */
// Wrapped in a function (rather than run immediately at parse time) because it needs STATE to
// already hold real data — it's called from applyStateDefaults() once boot() has loaded it, not
// at module-load time when STATE is still null.
function ensureQuotaConfigDefaults(){
  if (!STATE.quotaConfig){
    STATE.quotaConfig = {};
    var DEFAULT_LOCAL_GRADE_QUOTAS = {
      'B1': { promotions:25, 'Needs Improvement':10, 'Succeeding':null, 'Exceeding':30, 'Exceptional':10 },
      'B2': { promotions:20, 'Needs Improvement':10, 'Succeeding':null, 'Exceeding':25, 'Exceptional':10 },
      'C1': { promotions:20, 'Needs Improvement':5,  'Succeeding':null, 'Exceeding':25, 'Exceptional':10 },
      'C2': { promotions:15, 'Needs Improvement':5,  'Succeeding':null, 'Exceeding':20, 'Exceptional':10 },
      'D1': { promotions:10, 'Needs Improvement':5,  'Succeeding':null, 'Exceeding':15, 'Exceptional':5 },
      'D2': { promotions:10, 'Needs Improvement':0,  'Succeeding':null, 'Exceeding':10, 'Exceptional':5 },
      'E1': { promotions:5,  'Needs Improvement':0,  'Succeeding':null, 'Exceeding':10, 'Exceptional':5 },
      'E2': { promotions:5,  'Needs Improvement':0,  'Succeeding':null, 'Exceeding':5,  'Exceptional':5 },
    };
    localGradeOrder().forEach(function(g){
      STATE.quotaConfig[g] = DEFAULT_LOCAL_GRADE_QUOTAS[g] || { promotions:null, 'Needs Improvement':null, 'Succeeding':null, 'Exceeding':null, 'Exceptional':null };
    });
  }
}

function ratingPillClass(r){
  if (r==='Needs Improvement') return 'pill-critical';

}
function eligPillClass(e){
  if (e==='Eligible') return 'pill-success';

}

/* ============================= PERSISTENCE ============================= */
// Set once a save has failed due to the session no longer being valid, so the auth gate's own
// message (see showAuthGate) explains why the app just kicked the user back to it, instead of the
// generic "could not reach the server" text.
var SESSION_EXPIRED = false;
// Email of the server-authenticated login (set in boot()); shown in the header's profile menu.
var SESSION_EMAIL = '';
function serverLogout(){
  fetch('/api/auth/logout', {method:'POST', credentials:'include'}).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
}
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
/* ============================= SERVER SYNC ============================= */
/* Reading: fetchJson() for every screen's data (it waits for any save in flight, so a screen
   re-rendered right after a change shows that change).
   Saving: persist() sends what changed since the last save to POST /api/sync —
   - settings: the workspace settings document, when it changed (HR Admin; the server answers 409
     if someone else saved settings first);
   - patch.employees: only the changed fields of employee records loaded on this page (EMP_CACHE);
   - audit: audit entries logged since the last save (PENDING_AUDIT).
   One save is in flight at a time; changes made meanwhile go out in the next one. */
var SYNC = { version: 0, base: null, inFlight: false, again: false, msg: null };
var PENDING_AUDIT = [];
// Employee records fetched from GET /api/employees/:id, each with the JSON of every field as last
// saved, so a save can send just the fields that changed.
var EMP_CACHE = {};
function cacheEmployee(e){
  var base = {};
  Object.keys(e).forEach(function(k){ base[k] = JSON.stringify(e[k]); });
  EMP_CACHE[e.id] = { obj: e, base: base };
  return e;
}
function cachedEmployee(id){ return EMP_CACHE[id] ? EMP_CACHE[id].obj : null; }
function settingsJson(){
  var o = Object.assign({}, STATE);
  // lastUpdated is stamped by the server on every change, so it isn't a settings edit.
  o.meta = Object.assign({}, o.meta); delete o.meta.lastUpdated;
  return JSON.stringify(o);
}
function employeePatches(){
  var out = [];
  Object.keys(EMP_CACHE).forEach(function(id){
    var c = EMP_CACHE[id], set = {}, changed = false;
    Object.keys(c.obj).forEach(function(k){
      var j = JSON.stringify(c.obj[k]);
      if (j !== c.base[k]){ set[k] = j === undefined ? null : JSON.parse(j); changed = true; }
    });
    if (changed) out.push({ id: id, set: set });
  });
  return out;
}
// JSON request helper for the API. Resolves to {ok, status, body}; a 401 sends the user back to
// the login screen.
function api(method, url, body){
  return fetch(url, {
    method: method, credentials: 'include',
    headers: body!==undefined ? {'Content-Type':'application/json'} : {},
    body: body!==undefined ? JSON.stringify(body) : undefined
  }).then(function(resp){
    return resp.json().catch(function(){ return {}; }).then(function(json){
      if (resp.status === 401){
        SESSION_EXPIRED = true;
        showAuthGate('Your session expired. Log in again — your last change may not have been saved, so check it after logging back in.');
      }
      return { ok: resp.ok, status: resp.status, body: json };
    });
  });
}
// GET a JSON resource once no save is in flight; rejects with the server's error message.
function fetchJson(url){
  return whenSynced().then(function(){ return api('GET', url); }).then(function(r){
    if (!r.ok){ var err = new Error(r.body.error || ('Request failed ('+r.status+')')); err.status = r.status; throw err; }
    return r.body;
  });
}
function queryString(params){
  var parts = [];
  Object.keys(params).forEach(function(k){
    var v = params[k];
    if (v !== undefined && v !== null && v !== '') parts.push(encodeURIComponent(k)+'='+encodeURIComponent(v));
  });
  return parts.length ? '?'+parts.join('&') : '';
}
// The sidebar quick filters as API query parameters, plus any extras.
function qfParams(extra){
  return Object.assign({ regionType: QF.regionType, region: QF.region, localGrade: QF.localGrade, practice: QF.practice }, extra||{});
}
function loadWorkspace(){
  return api('GET', '/api/workspace').then(function(r){
    if (!r.ok) throw new Error(r.body.error || ('Could not load data ('+r.status+')'));
    WS = r.body;
    STATE = r.body.settings;
    SYNC.version = r.body.version;
    applyStateDefaults();
    SYNC.base = settingsJson();
    PENDING_AUDIT = [];
    EMP_CACHE = {};
  });
}
// Re-reads the workspace (after a server-side operation, or to recover from a rejected save) and
// re-renders.
function reloadWorkspace(toastMsg){
  return loadWorkspace().then(function(){
    renderApp();
    if (toastMsg) showToast(toastMsg);
  }).catch(function(){ showToast('Could not reload data from the server — refresh the page'); });
}
// Resolves once no save is in flight, so a read or server-side operation never races a pending save.
function whenSynced(){
  return new Promise(function(resolve){
    (function check(){ if (!SYNC.inFlight) resolve(); else setTimeout(check, 80); })();
  });
}
function persist(successMsg){
  saveUiState();
  SYNC.msg = successMsg;
  if (SYNC.inFlight){ SYNC.again = true; return; }
  runSync();
}
function runSync(){
  var settings = settingsJson();
  var patches = employeePatches();
  var audit = PENDING_AUDIT.slice();
  var msg = SYNC.msg;
  var settingsChanged = settings !== SYNC.base;
  if (!settingsChanged && !patches.length && !audit.length){ showToast(msg || 'Saved'); return; }
  var payload = { patch: { employees: patches }, audit: audit };
  if (settingsChanged){ payload.settings = JSON.parse(settings); payload.baseVersion = SYNC.version; }
  SYNC.inFlight = true;
  api('POST', '/api/sync', payload).then(function(r){
    SYNC.inFlight = false;
    if (r.status === 401){ showToast('NOT saved — your session expired, log in again'); return; }
    if (r.status === 409 || r.status === 403 || r.status === 404){
      SYNC.again = false;
      reloadWorkspace('NOT saved — ' + (r.body.error || 'you don\'t have permission for that change') + (r.status === 409 ? ' Loaded the latest; please redo your change.' : ''));
      return;
    }
    if (!r.ok){ showToast('NOT saved — ' + (r.body.error || 'server error, try again')); return; }
    SYNC.base = settings;
    SYNC.version = r.body.version;
    PENDING_AUDIT.splice(0, audit.length);
    patches.forEach(function(p){
      var c = EMP_CACHE[p.id];
      if (c) Object.keys(p.set).forEach(function(k){ c.base[k] = JSON.stringify(p.set[k]); });
    });
    if (SYNC.again){ SYNC.again = false; runSync(); return; }
    showToast(msg || 'Saved');
  }).catch(function(){
    SYNC.inFlight = false;
    showToast('NOT saved — check your connection and try again');
  });
}
function logAudit(entity, field, oldValue, newValue, employeeId, action){
  var e = employeeId ? cachedEmployee(employeeId) : null;
  PENDING_AUDIT.push({
    id: uid('AUD'), timestamp: nowIso(), user: currentUserName(),
    employeeId: employeeId||null, employeeName: e? e.name : null,
    entity: entity, field: field, oldValue: oldValue, newValue: newValue, action: action||'Updated'
  });
  if (WS) WS.counts.audit++;
}
/* The one entry point for a change made directly to an employee's own profile (a rating/eligibility
   override, a core-details edit, a primary-account pick) — records it twice: in the org-wide Audit
   Log, and in a changeHistory array kept on the employee record itself, so "who changed what on this
   person" is visible right on their dossier. Reference-data edits under Administration aren't about
   one employee and use logAudit() directly. */
function logProfileChange(empId, entity, field, before, after, action){
  var e = cachedEmployee(empId);
  if (e){
    if (!e.changeHistory) e.changeHistory = [];
    e.changeHistory.push({ at: nowIso(), by: currentUserName(), field: field, before: before, after: after, action: action||'Updated' });
  }
  logAudit(entity, field, before, after, empId, action);
}

/* Renders a server-backed view: fetches, then renders — ignoring the response if the user has
   navigated or re-rendered since. A re-render of the same route keeps the old content (dimmed) while
   loading instead of flashing an empty page. `source` is a URL or a function returning a promise. */
var VIEW_SEQ = 0;
function loadView(source, render){
  var seq = ++VIEW_SEQ;
  var view = document.getElementById('view');
  var route = currentRoute();
  if (view.getAttribute('data-route') === route && view.children.length) view.classList.add('is-loading');
  else { view.innerHTML = '<div class="empty-state">Loading…</div>'; view.setAttribute('data-route', ''); }
  var p = typeof source === 'function' ? source() : fetchJson(source);
  return p.then(function(data){
    if (seq !== VIEW_SEQ) return;
    view.classList.remove('is-loading');
    render(data);
    view.setAttribute('data-route', route);
  }).catch(function(err){
    if (seq !== VIEW_SEQ) return;
    view.classList.remove('is-loading');
    view.setAttribute('data-route', '');
    if (err && err.status === 401) return;
    view.innerHTML = '<div class="empty-state">'+esc((err && err.message) || 'Could not load this page.')+'</div>';
  });
}
// A view's own re-render (sort, tab, load more) — invalidates any load still in flight for it.
function viewSeqBump(){ return ++VIEW_SEQ; }

/* ============================= CASE PRESENTATION ============================= */
/* The rules engine — ratings, eligibility, risk flags, AI confidence and the achievement tie-break —
   runs on the server (server/lib/engine.js); these helpers only format its results. */
// A rule's configuration from the workspace settings (Rules Engine screens).
function rule(id){ return byId(STATE.rules, id); }
function achievementSummaryText(a){
  var parts = [];
  if (a.awards) parts.push(a.awards+' award'+(a.awards>1?'s':''));
  if (a.exceptionalContribs) parts.push(a.exceptionalContribs+' Exceptional-impact contribution'+(a.exceptionalContribs>1?'s':''));
  if (a.significantContribs) parts.push(a.significantContribs+' Significant-impact contribution'+(a.significantContribs>1?'s':''));
  if (a.certLevel && a.certLevel!=='None') parts.push(a.certLevel+' certification');
  parts.push(a.utilization+'% utilization');
  return parts.join(', ');
}
// Table badge for a case tied with others on a top-tier rating at 100% confidence (row.achievementRank
// is set by the server only for members of such a tie).
function achievementRankBadge(row){
  var r = row.achievementRank;
  if (!r) return '';
  var tip = 'Tied with '+(r.of-1)+' other '+r.tier+' case'+(r.of-1===1?'':'s')+' at 100% confidence — ranked by achievements this cycle: '+achievementSummaryText(row.achievement)+'.';
  return '<div class="table-sub" style="margin-top:3px;" title="'+esc(tip)+'">'+icon('award',12)+' Achievement rank #'+r.rank+' of '+r.of+'</div>';
}

function dossierAchievementNote(c){

/* ============================= CHART PRIMITIVES (inline SVG) ============================= */
/* Stacked 3D-style funnel: one tapered band per stage, each a fixed step narrower than the one above
   (the shape is a visual guide, not data-scaled — these stages are independent criteria, so a later
   stage can outnumber an earlier one, and a 0 stage must still show). Each band has an elliptical
   rim on top and a curved bottom, its count printed inside, and its label plus percentage of the
   largest stage on the left with a connector line in the band's color.
   data: [{label, value, color, textColor?}] */
function svgFunnelChart(data){
  var n = data.length;
  var W = 380, labelX = 128, fx0 = 146, fx1 = W - 6, cx = (fx0 + fx1) / 2;
  var maxTop = fx1 - fx0, minBot = maxTop * 0.32;
  var bandH = 40, gap = 7, ry = 7, top = ry + 1;
  var H = top + n * bandH + (n - 1) * gap + ry + 2;
  var step = (maxTop - minBot) / n;
  var maxV = Math.max.apply(null, data.map(function(d){ return d.value; }).concat([1]));
  var parts = data.map(function(d, i){
    var tw = maxTop - i * step, bw = tw - step;
    var y0 = top + i * (bandH + gap), y1 = y0 + bandH, ym = (y0 + y1) / 2;
    var color = d.color || 'var(--accent)';
    var lx = cx - tw / 2, rx = cx + tw / 2, blx = cx - bw / 2, brx = cx + bw / 2;
    var body = 'M'+lx+','+y0+' L'+blx+','+y1+' Q'+cx+','+(y1 + ry * 2)+' '+brx+','+y1+' L'+rx+','+y0+' Z';
    var edgeX = cx - (tw + bw) / 4;
    var pct = Math.round(d.value / maxV * 100);
    var txt = d.textColor || '#ffffff';
    return '<g>'+
      '<path d="'+body+'" fill="'+color+'"/>'+
      '<ellipse cx="'+cx+'" cy="'+y0+'" rx="'+(tw / 2)+'" ry="'+ry+'" fill="'+color+'"/>'+
      '<ellipse cx="'+cx+'" cy="'+y0+'" rx="'+(tw / 2)+'" ry="'+ry+'" fill="#000" fill-opacity="0.13"/>'+
      '<text x="'+cx+'" y="'+(ym + 6)+'" text-anchor="middle" font-size="17" font-weight="800" fill="'+txt+'" style="font-family:var(--font-display);">'+d.value+'</text>'+
      '<line x1="'+(labelX + 4)+'" y1="'+ym+'" x2="'+(edgeX - 3)+'" y2="'+ym+'" stroke="'+color+'" stroke-width="1.5"/>'+
      '<text x="'+labelX+'" y="'+(ym - 2)+'" text-anchor="end" font-size="12.5" font-weight="700" style="fill:var(--text-secondary);font-family:var(--font-text);">'+esc(d.label)+'</text>'+
      '<text x="'+labelX+'" y="'+(ym + 12)+'" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--text-tertiary);font-family:var(--font-text);">'+pct+'%</text>'+
      '</g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:440px;margin:0 auto;" role="img" aria-label="'+esc(data.map(function(d){ return d.label+': '+d.value; }).join(', '))+'">'+parts+'</svg>';
}
function svgBarChart(data, opts){
  // data: [{label, value, color}]
  opts = opts || {};
  var w = opts.width || 560, h = opts.height || 190, pad = 28, gap = opts.gap!=null?opts.gap:14;
  var max = Math.max.apply(null, data.map(function(d){return d.value;}).concat([1]));
  var barW = (w - pad*2 - gap*(data.length-1)) / data.length;
  var innerH = h - 48;
  function labelLines(label){
    var words = String(label).split(' ');
    if (words.length <= 1) return [label];
    var mid = Math.ceil(words.length/2);
    return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')];
  }
  var bars = data.map(function(d,i){
    var bh = max? (d.value/max)*innerH : 0;
    var x = pad + i*(barW+gap);
    var y = innerH - bh + 14;
    var lines = labelLines(d.label);
    var labelSvg = lines.map(function(ln,li){ return '<tspan x="'+(x+barW/2)+'" dy="'+(li===0?0:11)+'">'+esc(ln)+'</tspan>'; }).join('');
    return '<g>'+
      '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="5" fill="'+(d.color||'var(--accent)')+'"/>'+
      '<text x="'+(x+barW/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-primary)" font-family="var(--font-display)" class="tabular">'+d.value+'</text>'+
      '<text x="'+(x+barW/2)+'" y="'+(innerH+30)+'" text-anchor="middle" font-size="10" fill="var(--text-tertiary)">'+labelSvg+'</text>'+
    '</g>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'+
    '<line x1="'+pad+'" y1="'+(innerH+14)+'" x2="'+(w-pad)+'" y2="'+(innerH+14)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
    bars+'</svg>';
}

/* A symmetric ~13/37/37/13% bell shape across the 4 rating buckets (Needs Improvement, Succeeding,
   Exceeding, Exceptional) -- the normal-distribution PDF sampled at z = -1.5/-0.5/0.5/1.5 and
   normalized to sum to 1. This is the reference curve svgBellCurveOverlay compares actual counts
   against, not something fitted to the data itself -- an over- or under-weighted bar should be
   visible against it at a glance, the way forced-ranking calibration curves are usually read. */
var IDEAL_RATING_CURVE = [0.135, 0.365, 0.365, 0.135];
function svgBellCurveOverlay(data, opts){
  // data: [{label, value, color}] — draws the same bars svgBarChart would, then overlays a smooth
  // curve through the idealized distribution shape (IDEAL_RATING_CURVE) scaled to the same total
  // population, on the same height scale as the bars so the two are directly comparable.
  opts = opts || {};
  var w = opts.width || 560, h = opts.height || 190, pad = 28, gap = opts.gap!=null?opts.gap:14;
  var total = data.reduce(function(s,d){ return s+d.value; }, 0);
  var idealValues = data.map(function(d,i){ return (IDEAL_RATING_CURVE[i]!=null ? IDEAL_RATING_CURVE[i] : 1/data.length) * total; });
  var max = Math.max.apply(null, data.map(function(d){return d.value;}).concat(idealValues).concat([1]));
  var barW = (w - pad*2 - gap*(data.length-1)) / data.length;
  var innerH = h - 48;
  function labelLines(label){
    var words = String(label).split(' ');
    if (words.length <= 1) return [label];
    var mid = Math.ceil(words.length/2);
    return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')];
  }
  var points = [];
  var bars = data.map(function(d,i){
    var bh = max? (d.value/max)*innerH : 0;
    var x = pad + i*(barW+gap);
    var y = innerH - bh + 14;
    var cx = x + barW/2;
    var idealH = max ? (idealValues[i]/max)*innerH : 0;
    points.push([cx, innerH - idealH + 14]);
    var lines = labelLines(d.label);
    var labelSvg = lines.map(function(ln,li){ return '<tspan x="'+cx+'" dy="'+(li===0?0:11)+'">'+esc(ln)+'</tspan>'; }).join('');
    return '<g>'+
      '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="5" fill="'+(d.color||'var(--accent)')+'"/>'+
      '<text x="'+cx+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-primary)" font-family="var(--font-display)" class="tabular">'+d.value+'</text>'+
      '<text x="'+cx+'" y="'+(innerH+30)+'" text-anchor="middle" font-size="10" fill="var(--text-tertiary)">'+labelSvg+'</text>'+
    '</g>';
  }).join('');
  var path = 'M '+points[0][0]+' '+points[0][1];
  for (var i=0;i<points.length-1;i++){
    var p0 = points[i], p1 = points[i+1], mx = (p0[0]+p1[0])/2;
    path += ' C '+mx+' '+p0[1]+', '+mx+' '+p1[1]+', '+p1[0]+' '+p1[1];
  }
  var dots = points.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--special)" stroke="var(--bg-elevated)" stroke-width="1.5"/>'; }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'+
    '<line x1="'+pad+'" y1="'+(innerH+14)+'" x2="'+(w-pad)+'" y2="'+(innerH+14)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
    bars+'<path d="'+path+'" fill="none" stroke="var(--special)" stroke-width="2.5" stroke-linecap="round"/>'+dots+
    '</svg>';
}

function svgDonut(data, opts){
  // data: [{label, value, color}]
  opts = opts || {};
  var size = opts.size || 168, stroke = opts.stroke || 20;
  var r = (size - stroke)/2, cx = size/2, cy = size/2, circumference = 2*Math.PI*r;
  var total = data.reduce(function(s,d){return s+d.value;},0) || 1;
  var offset = 0;
  var segs = data.map(function(d){
    var frac = d.value/total;
    var len = frac*circumference;
    var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+stroke+'" '+
      'stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    offset += len;
    return seg;
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border-soft)" stroke-width="'+stroke+'"/>'+
    segs+
    '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text-primary)" font-family="var(--font-display)" class="tabular">'+total+'</text>'+
    '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="9.5" fill="var(--text-tertiary)">TOTAL</text>'+
    '</svg>';
}

function legendRow(data){

function sparkline(values, opts){
  opts = opts || {};
  var w = opts.width||100, h = opts.height||28;
  var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var range = (max-min)||1;
  var pts = values.map(function(v,i){
    var x = (i/(values.length-1))*w;
    var y = h - ((v-min)/range)*h;
    return x+','+y;
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* Publishing a new version reloads this view (per the artifact capability contract), which clears
   ALL in-memory JS state — not just the hash router, but which sub-tab was open (DOSSIER_TAB),
   table sort (RTD_SORT), and the on-page filters/search (UI). Which Administration page was open
   no longer needs its own entry here — that page is now the URL itself (admin/<key>), which is
   part of location.hash and so is already covered by the plain `hash` field below. sessionStorage
   survives that reload (same tab, same origin), so we snapshot all of it and restore it once on
   boot if the hash comes back empty — otherwise every save (an override, deleting a Practice,
   advancing a workflow step, anything that persists) bounces the viewer back to the first tab /
   default filters, which reads as "my action navigated me away." saveUiState() is called from
   persist() itself (the one place every mutation flows through) so the snapshot is always fresh
   right before a reload can happen, plus from renderApp() as a matter of course on ordinary
   navigation. */
var UI_STATE_KEY = 'rtd_ui_state_v1';
function saveUiState(){
  try {
    if (!location.hash || location.hash === '#') return;
    sessionStorage.setItem(UI_STATE_KEY, JSON.stringify({
      hash: location.hash,
      dossierTab: (typeof DOSSIER_TAB!=='undefined') ? DOSSIER_TAB : null,
      rtdSort: (typeof RTD_SORT!=='undefined') ? RTD_SORT : null,
      rulesSearch: (typeof RULES_SEARCH!=='undefined') ? RULES_SEARCH : null,
      filters: UI.filters,
      sort: UI.sort,
      search: UI.search
    }));
  } catch(err){}
}
function restoreUiStateIfEmpty(){
  if (location.hash && location.hash !== '#') return;
  try {
    var raw = sessionStorage.getItem(UI_STATE_KEY);
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (saved.dossierTab) DOSSIER_TAB = saved.dossierTab;
    if (saved.rtdSort) RTD_SORT = saved.rtdSort;
    if (typeof saved.rulesSearch === 'string') RULES_SEARCH = saved.rulesSearch;
    if (saved.filters) UI.filters = saved.filters;
    if (saved.sort) UI.sort = saved.sort;
    if (typeof saved.search === 'string') UI.search = saved.search;
    if (saved.hash && saved.hash !== '#') location.hash = saved.hash;
  } catch(err){}
}

function renderSidebar(){
  var route = currentRoute();
  var top = route.split('/')[0];
  // The brand lives in the header; this row (narrow screens only) just labels the drawer and closes it.
  var html = '<div class="sidebar-head"><strong>Menu</strong>'+
    '<button class="btn btn-icon sidebar-close-btn" id="sidebar-close-btn" title="Close menu">'+icon('x',15)+'</button>'+
    '</div>'+
    sidebarFiltersHtml()+
    '<div class="nav-scroll">';
  NAV.forEach(function(g){
    if (g.hr && !isHR()) return;
    html += '<div class="nav-group"><div class="nav-label">'+g.group+'</div>';
    g.items.forEach(function(it){
      var active = top===it.key;
      html += '<div class="nav-item'+(active?' active':'')+'" data-nav="'+it.key+'" title="'+esc(it.label)+'">'+icon(it.icon,17)+'<span>'+it.label+'</span>'+
        (it.count?'<span class="count">'+it.count()+'</span>':'')+'</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="sidebar-foot"><button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="'+(PREFS.sidebarCollapsed?'Expand sidebar':'Collapse sidebar')+'">'+
    icon('chevronsLeft',17)+'<span>Collapse Sidebar</span></button></div>';
  // Profile/Account and Administration live in the topbar's upper-right corner (see renderTopbar).
  document.getElementById('sidebar').innerHTML = html;
  document.getElementById('app').classList.toggle('sidebar-collapsed', !!PREFS.sidebarCollapsed);
  document.getElementById('sidebar-collapse-btn').addEventListener('click', function(){
    PREFS.sidebarCollapsed = !PREFS.sidebarCollapsed; savePrefs(); renderSidebar();
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function(el){
    el.addEventListener('click', function(){ go(el.getAttribute('data-nav')); closeSidebar(); });
  });
  document.getElementById('sidebar-close-btn').addEventListener('click', closeSidebar);
  bindSidebarFilters();
}

function bindSidebarFilters(){
  var rtSel = document.getElementById('sf-regiontype');
  var rSel = document.getElementById('sf-region');
  var gSel = document.getElementById('sf-localgrade');
  var pSel = document.getElementById('sf-practice');
  var ySel = document.getElementById('sf-year');
  if (rtSel) rtSel.addEventListener('change', function(){
    QF.regionType = rtSel.value;
    // Region is scoped to the selected Region Type's list, so drop a now-out-of-scope Region
    // choice rather than leaving a filter combination that could never match anyone.

    if (QF.regionType && QF.region && regions.indexOf(QF.region)<0) QF.region = '';

  if (rSel) rSel.addEventListener('change', function(){ QF.region = rSel.value; saveQuickFilters(); renderApp(); });
  if (gSel) gSel.addEventListener('change', function(){ QF.localGrade = gSel.value; saveQuickFilters(); renderApp(); });
  if (pSel) pSel.addEventListener('change', function(){ QF.practice = pSel.value; saveQuickFilters(); renderApp(); });
  if (ySel) ySel.addEventListener('change', function(){ QF.year = ySel.value; saveQuickFilters(); renderApp(); });
  var clearLink = document.getElementById('sf-clear');
  if (clearLink) clearLink.addEventListener('click', function(){ QF = {regionType:'', region:'', localGrade:'', practice:'', year:''}; saveQuickFilters(); renderApp(); });
}

/* ============================= SHARED FILTER BAR ============================= */
function distinctValues(field){
  // Filter options come from the server (GET /api/workspace → options), not from the roster.
  return (WS && WS.options && WS.options[field]) || [];
}
/* Region / Local Grade / Practice also exist as sidebar Quick Filters (QF, shared across every
   page). A page's own filter bar can offer them too for convenience, but that selection needs to
   BE the same shared QF value — not a second, page-local copy — or picking one on, say, RTD Review
   silently stops applying the moment you navigate to Executive/Promotions/Calibration, even though
   those all already scope their data through QF. Everything else in a filter bar (Rating, People
   Manager, Contribution Type, ...) has no sidebar equivalent and stays page-local as before. */
var GLOBAL_FILTER_FIELDS = {regionType:1, region:1, localGrade:1, practice:1};
function filterBar(fields, storeKey){
  var f = UI.filters[storeKey] = UI.filters[storeKey] || {};
  var html = '<div class="filter-bar">';
  fields.forEach(function(fld){
    var vals = fld.options || distinctValues(fld.field);
    var labelFor = fld.labelFor || function(v){ return v; };
    var current = GLOBAL_FILTER_FIELDS[fld.field] ? QF[fld.field] : f[fld.field];
    html += '<select data-filter="'+fld.field+'" data-store="'+storeKey+'"><option value="">'+fld.label+' — All</option>'+
      vals.map(function(v){ return '<option value="'+esc(v)+'"'+(current===v?' selected':'')+'>'+esc(labelFor(v))+'</option>'; }).join('')+
      '</select>';
  });
  html += '<button class="btn btn-sm" id="clear-filters-'+storeKey+'">Clear filters</button></div>';
  return html;
}
function bindFilterBar(storeKey, onChange){
  var selects = document.querySelectorAll('[data-store="'+storeKey+'"]');
  Array.prototype.forEach.call(selects, function(sel){
    sel.addEventListener('change', function(){
      var field = sel.getAttribute('data-filter');
      if (GLOBAL_FILTER_FIELDS[field]){
        QF[field] = sel.value || '';
        saveQuickFilters();
        renderApp(); // keeps the sidebar's own copy of this same filter in sync, not just this page
      } else {
        var f = UI.filters[storeKey] = UI.filters[storeKey]||{};
        if (sel.value) f[field] = sel.value; else delete f[field];
        onChange();
      }
    });
  });
  var clearBtn = document.getElementById('clear-filters-'+storeKey);
  if (clearBtn) clearBtn.addEventListener('click', function(){
    UI.filters[storeKey] = {};
    var touchedGlobal = false;
    Array.prototype.forEach.call(selects, function(sel){
      var field = sel.getAttribute('data-filter');
      if (GLOBAL_FILTER_FIELDS[field]){ QF[field] = ''; touchedGlobal = true; }
    });
    if (touchedGlobal){ saveQuickFilters(); renderApp(); } else { onChange(); }
  });
}

// Stat card whose color comes from its position in the row (see .kpi-auto in the CSS).
function kpiTile(label, value, iconHtml, delta){
  return '<div class="card kpi-card-v2 kpi-auto">'+
    '<div class="kpi-top"><div class="kpi-icon-badge">'+iconHtml+'</div></div>'+
    '<div class="kpi-value2 tabular">'+value+'</div>'+
    '<div class="kpi-label2">'+esc(label)+'</div>'+
    (delta?'<div class="kpi-sub2">'+esc(delta)+'</div>':'')+
    '</div>';
}
/* Small colored circular icon badge for a Key Insights row — same accent/success/warning/critical/
   special palette as the KPI cards, just round instead of rounded-square. */
function statusIcon(name, colorClass, size){
  size = size || 26;
  return '<span class="icon-badge-round badge-'+colorClass+'" style="width:'+size+'px;height:'+size+'px;">'+icon(name, Math.round(size*0.54))+'</span>';
}
/* Icon-badge KPI card: colored icon chip, big value, label, and an optional sub-line (plain text
   or a mini progress bar via miniProgressBar). `clickAttr`, when given, makes the whole card a
   button that toggles a drill-down filter — the card renders a chevron and highlights active. */
function kpiCardV2(label, value, iconHtml, colorClass, subHtml, clickAttr, active){
  return '<div class="card kpi-card-v2 kpi-'+colorClass+(clickAttr?' clickable-kpi':'')+(active?' kpi-active':'')+'"'+(clickAttr?' '+clickAttr:'')+'>'+
    '<div class="kpi-top"><div class="kpi-icon-badge">'+iconHtml+'</div>'+
    (clickAttr?'<span class="kpi-chevron">'+icon('chevronRight',14)+'</span>':'')+
    '</div>'+
    '<div class="kpi-value2 tabular">'+value+'</div>'+
    '<div class="kpi-label2">'+esc(label)+'</div>'+
    (subHtml?'<div class="kpi-sub2">'+subHtml+'</div>':'')+
    '</div>';
}
function miniProgressBar(pct){
  var color = pct>=85?'var(--success)':pct>=60?'var(--warning)':'var(--critical)';
  return '<div class="mini-progress-track"><div class="mini-progress-fill" style="width:'+pct+'%;background:'+color+';"></div></div>';
}
/* Compact percentage + mini bar for a table cell — the AI confidence score for one case's rating
   or promotion recommendation, with the underlying reasons as a native tooltip. */
function confidenceBar(score, reasons){
  var tip = reasons ? reasons.join(' ') : '';
  return '<div style="min-width:88px;" title="'+esc(tip)+'"><span class="tabular" style="font-weight:600;font-size:12px;">'+score+'%</span>'+miniProgressBar(score)+'</div>';
}
function complianceRow(label, num, den){
  var pct = den? Math.round(num/den*100):0;
  return '<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;"><span style="color:var(--text-secondary);">'+esc(label)+'</span><span style="font-weight:700;" class="tabular">'+num+' / '+den+' ('+pct+'%)</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%; background:'+(pct>=85?'var(--success)':pct>=60?'var(--warning)':'var(--critical)')+';"></div></div></div>';
}
function riskTable(rows){
  if (!rows.length) return '<div class="empty-state">No flagged cases right now.</div>';
  return '<div class="table-scroll"><table><thead><tr><th>Employee</th><th>Practice</th><th>Rating</th><th>Eligibility</th><th>Risk indicators</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr class="clickable" data-go="dossiers/'+r.id+'"><td><div class="table-name">'+esc(r.name)+'</div><div class="table-sub">'+esc(r.ggid)+'</div></td>'+
      '<td>'+esc(r.practice)+'</td><td>'+pill(r.finalRating, ratingPillClass(r.finalRating))+'</td>'+
      '<td>'+pill(r.eligibilityStatus, eligPillClass(r.eligibilityStatus))+'</td>'+
      '<td>'+r.risk.map(function(x){return pill(x,'pill-critical');}).join(' ')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function bindGoLinks(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(el){
    el.addEventListener('click', function(){ go(el.getAttribute('data-go')); });
  });
  // "View all N flagged cases" — filters RTD Review down to just the at-risk cases.
  Array.prototype.forEach.call(document.querySelectorAll('[data-go-risk]'), function(el){
    el.addEventListener('click', function(){ UI.filters['rtd'] = {risk:'1'}; go('dash-rtd'); });
  });
}
// "Load more" footer for a paged table.
function loadMoreHtml(id, shown, total){
  if (shown >= total) return '';
  return '<div style="padding:12px;text-align:center;"><button class="btn btn-sm" id="'+id+'">Load more ('+shown+' of '+total+' shown)</button></div>';
}

/* One row per case — the computed, post-HR-override outcome: final rating and promotion eligibility
   as they stand now, whether HR stepped in on either, learning/certification compliance, risk flags
   and promotion-quota position. Exports everything RTD Review's current filters match (not just the
   rows loaded on screen); the server computes the rows, the workbook is built here. */
function exportFinalizedResults(){
  fetchJson('/api/dashboards/rtd/export'+queryString(rtdQuery({}))).then(function(d){
    var rows = [['GGID','Name','Email','Region','Country','Global Grade','Local Grade','Practice','Sub-Practice',
      'Final Rating','Rating Source','Promotion Eligibility','Eligibility Source','Learning Compliance',
      'Certification','Quota Rank','Quota Status','Risk Flags']];
    d.rows.forEach(function(r){
      rows.push([r.ggid, r.name, r.email, r.region, r.country, r.globalGrade, r.localGrade, r.practice, r.subPractice,
        r.finalRating, r.ratingSource, r.eligibility, r.eligibilitySource, r.learning, r.certification, r.quotaRank, r.quotaStatus, r.risk]);
    });
    var blob = xlsxBuildWorkbook([{ name:'RTD Results', rows:rows }]);
    offerDownload('rtd_finalized_results_'+d.cycleLabel.replace(/\s+/g,'_')+'.xlsx', blob);
  }).catch(function(err){ showToast('Export failed — '+err.message); });
}
function thSort(label, field){
  var arrow = RTD_SORT.field===field ? (RTD_SORT.dir===1?' ↑':' ↓') : '';
  return '<th data-sort="'+field+'">'+esc(label)+arrow+'</th>';
}

/* ============================= VIEW: PROMOTION DASHBOARD ============================= */

}

  var readyHtml = '<div class="card card-pad">'+

    (d.readyForReview.length ? '<div class="reason-list" style="margin-top:10px;">'+d.readyForReview.map(function(r){

/* ============================= OVERRIDES & CORRECTIONS ============================= */
// Fetches one employee (with its computed case) for an edit, caching the record so the save sends
// only the fields that changed.
function withEmployee(empId, fn){
  fetchJson('/api/employees/'+encodeURIComponent(empId)).then(function(d){
    fn(cacheEmployee(d.employee), d.case, d);
  }).catch(function(err){ showToast('Could not load this employee — '+err.message); });
}
function openEligibilityOverrideModal(empId){
  withEmployee(empId, function(e, c){
    var body = '<div class="field"><label>Employee</label><div style="font-weight:600;">'+esc(e.name)+' · '+esc(e.ggid)+'</div></div>'+
      '<div class="field"><label>AI/system-recommended status</label><div>'+pill(c.eligibility.systemStatus, eligPillClass(c.eligibility.systemStatus))+'</div></div>'+
      '<div class="field"><label>Override status</label><select id="ov-status"><option value="">— No override —</option>'+
      ['Eligible','Eligible With Exception','Not Eligible'].map(function(s){return '<option value="'+s+'"'+(e.promotionEligibilityOverride===s?' selected':'')+'>'+s+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>Justification (audit note)</label><textarea id="ov-note" rows="3" placeholder="Reason for the manual override…"></textarea></div>';
    openModal('Promotion Eligibility Override', body, [
      {label:'Cancel', cls:'btn'},
      {label:'Save Override', cls:'btn btn-primary', action:function(){
        var val = document.getElementById('ov-status').value;
        var note = document.getElementById('ov-note').value;
        var before = e.promotionEligibilityOverride || c.eligibility.status;
        e.promotionEligibilityOverride = val || null;
        logProfileChange(empId, 'Promotion Eligibility', 'promotionEligibilityOverride', before, val||'(cleared)', 'Override'+(note?': '+note:''));
        closeModal();
        persist('Eligibility override saved');
        renderApp();
      }}
    ]);
  });
}
function openRatingOverrideModal(empId, prefill){
  withEmployee(empId, function(e, c){
    // An existing override always wins over a suggestion — this just pre-fills the form for a fresh
    // decision, it never silently replaces one HR already made.
    var defaultRating = e.ratingOverride || (prefill && prefill.rating) || '';
    var defaultNote = e.ratingOverrideNote || (prefill && prefill.note) || '';
    var body = '<div class="field"><label>Employee</label><div style="font-weight:600;">'+esc(e.name)+' · '+esc(e.ggid)+'</div></div>'+
      '<div class="field"><label>System-computed rating</label><div>'+pill(c.rating.systemRating, ratingPillClass(c.rating.systemRating))+'</div></div>'+
      (prefill && !e.ratingOverride ? '<div class="field"><div class="reason-item" style="color:var(--warning);">'+icon('alert',13)+'<span>Suggested from the Promotion quota exceptions review — check it over, adjust if needed, then confirm.</span></div></div>' : '')+
      '<div class="field"><label>Override rating</label><select id="ro-rating"><option value="">— No override —</option>'+
      RATINGS.map(function(r){return '<option value="'+r+'"'+(defaultRating===r?' selected':'')+'>'+r+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>Justification (audit note)</label><textarea id="ro-note" rows="3" placeholder="Reason for the manual override…">'+esc(defaultNote)+'</textarea></div>';
    openModal('HR Rating Override', body, [
      {label:'Cancel', cls:'btn'},
      {label:'Save Override', cls:'btn btn-primary', action:function(){
        var val = document.getElementById('ro-rating').value;
        var note = document.getElementById('ro-note').value;
        var before = c.rating.finalRating;
        e.ratingOverride = val || null;
        e.ratingOverrideNote = note || null;
        logProfileChange(empId, 'Rating Override', 'ratingOverride', before, val||'(cleared)', 'HR Override'+(note?': '+note:''));
        closeModal();
        persist('Rating override saved');
        renderApp();
      }}
    ]);
  });
}

/* Fields an annual data upload can leave blank (see issuesForCreate/issuesForUpdate in
   server/lib/dataload.js) and that otherwise have no editor anywhere in the app. Recomputed on save
   so the "Missing data" badge/risk flag clears itself once every required field is filled in. */
function recomputeCoreDataIssues(e){
  var issues = [];
  if (!e.ggid) issues.push('Missing GGID');
  if (!e.name) issues.push('Missing Name');
  if (!e.region) issues.push('Missing Region');
  if (!e.globalGrade) issues.push('Missing Global Grade');
  if (!e.practice) issues.push('Missing Practice');
  return issues;
}
function openEditCoreDetailsModal(empId){
  var e = cachedEmployee(empId);
  if (!e) return;
  var fields = [
    ['ggid','GGID'], ['name','Name'], ['email','Email'], ['region','Region'], ['country','Country'],
    ['globalGrade','Global Grade'], ['localGrade','Local Grade'], ['practice','Practice'], ['subPractice','Sub-Practice'],
    ['supervisor','Supervisor'], ['peopleManager','People Manager']
  ];
  var body = (e.dataQualityIssues && e.dataQualityIssues.length ?
    '<div class="field"><div class="reason-item" style="color:var(--warning);">'+icon('alert',13)+'<span>'+esc(e.dataQualityIssues.join(' · '))+'</span></div></div>' : '')+
    '<div class="field-row">'+fields.map(function(f){
      return '<div class="field"><label>'+f[1]+'</label><input type="text" data-core-field="'+f[0]+'" value="'+esc(e[f[0]]||'')+'"/></div>';
    }).join('')+'</div>';
  openModal('Edit Core Details · '+(e.ggid||e.name), body, [
    {label:'Cancel', cls:'btn'},
    {label:'Save', cls:'btn btn-primary', action:function(){
      var before = clone(e);
      fields.forEach(function(f){
        var input = document.querySelector('[data-core-field="'+f[0]+'"]');
        e[f[0]] = input.value.trim();
      });
      if (!e.firstName && !e.lastName){ e.firstName = e.name.split(' ')[0]||''; e.lastName = e.name.split(' ').slice(1).join(' '); }
      e.dataQualityIssues = recomputeCoreDataIssues(e);
      logProfileChange(empId, 'Employee', 'core details', before.ggid+' / '+before.name, e.ggid+' / '+e.name, 'HR manual correction');
      closeModal();
      persist('Core details updated'+(e.dataQualityIssues.length? ' — '+e.dataQualityIssues.length+' field(s) still missing' : ''));
      renderApp();
    }}
  ]);
}

/* ============================= MODAL ============================= */
function openModal(title, bodyHtml, buttons){
  var wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modal-root';
  wrap.innerHTML = '<div class="modal"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn btn-icon" id="modal-close">'+icon('x',15)+'</button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div>'+
    '<div class="modal-foot">'+buttons.map(function(b,i){return '<button class="'+b.cls+'" data-mbtn="'+i+'">'+esc(b.label)+'</button>';}).join('')+'</div></div>';
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  wrap.addEventListener('click', function(ev){ if (ev.target===wrap) closeModal(); });
  buttons.forEach(function(b,i){
    var el = wrap.querySelector('[data-mbtn="'+i+'"]');
    el.addEventListener('click', function(){ if (b.action) b.action(); else closeModal(); });
  });
}
function closeModal(){ var m = document.getElementById('modal-root'); if (m) m.remove(); }
/* Shared confirmation step for actions that can't be undone from the UI (removing reference data,
   turning off a rule that's actively gating live cases). Cancel just closes the modal. */
function confirmAction(title, message, confirmLabel, onConfirm){
  openModal(title, '<div class="table-sub">'+esc(message)+'</div>', [
    {label:'Cancel', cls:'btn'},
    {label:confirmLabel||'Confirm', cls:'btn btn-danger', action:function(){ closeModal(); onConfirm(); }}
  ]);
}

/* People Manager Considerations — only for employees who are people managers. "# of Counselees" is
   context only, never a pass/fail check (a manager doesn't control how many counselees they're
   assigned). Check-ins, coaching training and career conversations are shown against the targets
   configured under Administration → Manager Config. */
function dossierPeopleManagerCard(mgrRec){
  if (!mgrRec) return '<div class="card card-pad" style="margin-top:16px;"><div class="section-title" style="font-size:15px;">People Manager Considerations</div><div class="empty-state" style="padding:24px;">No manager record on file for this employee.</div></div>';
  var row = function(label, valueHtml){ return '<div class="reason-item"><span><strong>'+esc(label)+':</strong> '+valueHtml+'</span></div>'; };
  var yn = function(b){ return b ? pill('Completed','pill-success') : pill('Not completed','pill-neutral'); };
  var cfg = STATE.managerConfig;
  var checkinsRequired = mgrRec.counseleeCount * (cfg.minCheckInsRequired||0);
  var checkinsOk = checkinsRequired===0 || mgrRec.checkInsCompleted >= checkinsRequired;
  var coachingOk = !!(mgrRec.coachingTrainingDate && mgrRec.coachingTrainingDate <= cfg.coachingTrainingDueDate);
  var careerOk = !!(mgrRec.careerConversationDate && mgrRec.careerConversationDate <= cfg.careerConversationDueDate);
